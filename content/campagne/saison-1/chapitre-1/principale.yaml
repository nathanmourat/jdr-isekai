# Chapitre 1 — quête principale (scènes de groupe : les choix sont votés, le meneur du jour tranche en cas d'égalité).
scenes:
  # ─────────────────────────────────────────────────────────────
  - id: ch1-appel
    pnj: aureliath
    titre: "L'Appel"
    type: groupe
    lieu: temple-du-seuil
    decor: temple-du-seuil
    quete: q-ch1-appel
    disponible_si: { pas_flag: appel-fait }
    noeuds:
      debut:
        repliques:
          - { dit: "Printemps 1012. Un cercle de lumière bleue embrase le sol du Temple du Seuil. Des chants montent, des vitraux vibrent… puis le silence." }
          - { dit: "Au centre du cercle, des silhouettes se relèvent, hagardes : les invoqués. À la lisière de la lumière, d'autres jeunes gens, attirés ici par une résonance qu'ils ne savent pas nommer : les réincarnés.", si: { origine: reincarne } }
          - { qui: aureliath, dit: "« Bienvenue à Velmaris, [[Appelé||Appelés]]. Je suis Auréliath, Grand Prieur de l'Ordre de la Lumière Sereine. [[N'aie||N'ayez]] crainte : la Lumière [[t'a choisi||vous a choisis]]. »" }
          - { qui: aureliath, dit: "« Le Souverain des Cendres s'est éveillé au nord. Le Mur d'Aube faiblit. Le royaume a besoin de héros. »" }
          - { qui: aveline, expression: neutre, dit: "Une jeune femme en armure argentée s'avance, la main sur le pommeau. « Capitaine Aveline de Castelroc. Je suis chargée de [[ta||votre]] sécurité. » Son regard s'attarde sur [[toi||vous]], méfiant." }
        choix:
          - texte: "« Un monde de magie ? Génial. Où est-ce qu'on signe ? » (enthousiaste)"
            effets: [{ reputation: { ordre: 5 }, affinite: { aveline: 2 } }]
            aller: enthousiaste
          - texte: "« Personne ne [[m'a demandé mon||nous a demandé notre]] avis. Qui a décidé de [[m'arracher à ma vie||nous arracher à nos vies]] ? » (méfiant)"
            effets: [{ reputation: { ordre: -5 }, affinite: { aveline: 4 }, flag: mefiance-ordre }]
            aller: mefiant
          - texte: "« Excusez-moi, il y a des toilettes dans ce monde ? » (humour)"
            effets: [{ affinite: { aveline: 3 } }]
            aller: humour
      enthousiaste:
        repliques:
          - { qui: aureliath, dit: "Le Grand Prieur sourit largement. « Voilà l'esprit des héros ! »" }
          - { qui: aveline, dit: "Aveline soupire. « Les derniers à avoir dit ça sont enterrés sous le Mur d'Aube. »" }
        suite: question
      mefiant:
        repliques:
          - { qui: aureliath, dit: "Le sourire du Grand Prieur se fige une fraction de seconde. « La Lumière a ses raisons. [[Tu les comprendras||Vous les comprendrez]]. »" }
          - { qui: aveline, dit: "Aveline [[te||vous]] jette un regard nouveau. Presque… approbateur." }
        suite: question
      humour:
        repliques:
          - { dit: "Un acolyte s'étrangle. Auréliath cligne des yeux." }
          - { qui: aveline, expression: joie, dit: "Aveline détourne la tête, mais [[tu l'as||vous l'avez]] vue : elle a souri. « Par ici. Et oui, il y en a. »" }
        suite: question
      # Le Grand Prieur s'adresse à UN joueur, par son pseudo : lui seul répond (3 réponses selon sa classe ou sa race).
      question:
        repliques:
          - { qui: aureliath, dit: "Le Grand Prieur lève une main. Son regard [[te détaille longuement||parcourt vos visages un à un, puis s'arrête]]." }
        parole_a:
          regle: { classe: [arcaniste, invocateur, guerisseur, barde, alchimiste] }
          question: { qui: aureliath, dit: "« {pseudo}. Je sens quelque chose s'éveiller en toi. Dis-moi : que sais-tu de la magie de ce monde ? »" }
          reponses:
            - { texte: "« Je la sens crépiter au bout de mes doigts. Le feu, le givre… ils me répondent déjà. »", si: { classe: arcaniste }, effets: [{ reputation: { ordre: 3 } }], aller: suite }
            - { texte: "« Quelque chose m'accompagne depuis mon arrivée. Une présence, à mes côtés. »", si: { classe: invocateur }, effets: [{ reputation: { ordre: 2 } }], aller: suite }
            - { texte: "« Je sais seulement que mes mains apaisent la douleur. Le reste, je l'apprendrai. »", si: { classe: guerisseur }, effets: [{ reputation: { ordre: 4 } }], aller: suite }
            - { texte: "« La magie ? Chez moi, ça s'appelle une bonne chanson au bon moment. »", si: { classe: barde }, effets: [{ affinite: { aveline: 1 } }], aller: suite }
            - { texte: "« De la magie ? Montrez-moi vos fioles, je vous dirai ce que j'en pense. »", si: { classe: alchimiste }, effets: [{ reputation: { ordre: 1 } }], aller: suite }
            - { texte: "« Je préfère l'acier. La magie, je la laisse à ceux qui ont le temps de réciter. »", si: { classe: [lame-runique, gardien, berserker, ombre, archer] }, effets: [{ affinite: { aveline: 2 } }], aller: suite }
            - { texte: "« Les anciens parlent du Voile et de ses dangers. Je sais qu'on ne joue pas avec. »", si: { race: [elfe, demi-elfe] }, effets: [{ flag: mefiance-ordre }], aller: suite }
            - { texte: "« Rien du tout. Mais j'apprends vite. »", effets: [{ reputation: { ordre: 1 } }], aller: suite }
            - { texte: "« Assez pour me méfier de ceux qui s'en servent sur les autres sans demander. »", effets: [{ reputation: { ordre: -3 }, affinite: { aveline: 2 } }], aller: suite }
            - { texte: "« Ça dépend. Elle fait aussi le café ? »", effets: [{ affinite: { aveline: 1 } }], aller: suite }
      suite:
        repliques:
          - { qui: aureliath, dit: "« [[Repose-toi||Reposez-vous]]. Demain, la Couronne [[te||vous]] recevra. En attendant, la Guilde de la Rose des Vents [[t'ouvrira ses portes : tu y apprendras||vous ouvrira ses portes : vous y apprendrez]] à survivre. »" }
          - { dit: "Ce soir-là, en contemplant les tours blanches de Lysmont depuis la fenêtre du temple, [[tu vois flotter devant tes yeux une fenêtre translucide : ton niveau, tes capacités… et ton don.||chacun de vous voit flotter devant ses yeux une fenêtre translucide : votre niveau, vos capacités… et votre don.]]" }
        effets:
          - { flag: [appel-fait, aveline-rencontree], recruter: aveline, quete: { id: q-ch1-appel, etape: examen }, journal: "L'Appel : {groupe} arrivent au Temple du Seuil. La capitaine Aveline de Castelroc est chargée de leur sécurité." }
        fin: true

  # ─────────────────────────────────────────────────────────────
  - id: ch1-examen
    pnj: rowena
    titre: "L'examen de la Guilde"
    type: groupe
    lieu: guilde
    decor: guilde
    quete: q-ch1-appel
    disponible_si: { quete_etape: { q-ch1-appel: examen } }
    noeuds:
      debut:
        repliques:
          - { dit: "Le hall de la Guilde de la Rose des Vents sent la bière, le cuir et la sueur. Des dizaines de regards se tournent vers vous." }
          - { qui: rowena, dit: "« Ah. [[Un Appelé||Les Appelés]]. » Dame Rowena mâchonne sa pipe éteinte. « Ici, [[ton don ne vaut rien tant que tu n'as pas prouvé que tu sais||votre don ne vaut rien tant que vous n'avez pas prouvé que vous savez]] tenir debout. »" }
          - { qui: kaya, dit: "Une jeune femme aux oreilles de loup argentées [[te||vous]] dévisage, adossée à un pilier. « Pff. [[Il a l'air tout mou||Ils ont l'air tout mous]]. Je parie dix pièces [[qu'il tombe||qu'ils tombent]] au premier coup. »" }
          - { qui: kaya, dit: "Elle vous fixe un instant de plus, puis son regard s'adoucit. « …Un Ourvalis ? Hé. Bonne chance, alors. »", si: { race: ourvalis } }
          - { qui: rowena, dit: "« L'examen est simple : [[tu affrontes||vous affrontez]] notre golem d'entraînement. S'il [[te||vous]] met au tapis, [[reviens||revenez]] dans un an. »" }
        suite: pari
      # Pari partagé : chaque joueur dit s'il mise. Les 20 pièces sont réparties entre ceux qui misent
      # (à trois : 7 + 7 + 6). En cas de victoire, chacun récupère le double de sa part (voir `gain_pari`).
      pari:
        repliques:
          - { qui: kaya, dit: "Kaya fait sauter une pièce dans sa main. « Allez, soyons joueurs. Vingt pièces, pour [[toi||tout le groupe]], que [[tu ne tiens||vous ne tenez]] pas debout jusqu'au bout. [[Tu suis||Qui suit]] ? »" }
        pari: { mise: 20, gain: 2, flag: pari-kaya, aller: conseil, personne: sans-pari }
      sans-pari:
        repliques:
          - { qui: kaya, dit: "« Personne ne parie ? Tss. Prudent[[||s]], en plus d'être mou[[||s]]. » Elle range sa pièce, presque déçue." }
        suite: conseil
      conseil:
        parole_a:
          regle: { classe: [lame-runique, gardien, berserker, ombre, archer] }
          question: { qui: rowena, dit: "Rowena pointe sa pipe vers {nom}. « Toi, {pseudo}. Ce golem fait deux fois ta taille. Tu comptes t'y prendre comment ? »" }
          reponses:
            - { texte: "« Je me mets devant et j'encaisse. [[Je frapperai quand il fatiguera.||Les autres frapperont pendant ce temps.]] »", si: { classe: gardien }, effets: [{ reputation: { guilde: 3 } }], aller: combat }
            - { texte: "« Je cogne fort. Et s'il tient encore debout, je recommence. »", si: { classe: [berserker, lame-runique] }, effets: [{ reputation: { guilde: 2 } }], aller: combat }
            - { texte: "« Je cherche le point faible. Tout le monde en a un, même l'argile. »", si: { classe: [ombre, archer] }, effets: [{ reputation: { guilde: 3 } }], aller: combat }
            - { texte: "« De loin. Très loin. Avec quelque chose qui explose. »", si: { classe: [arcaniste, invocateur, alchimiste] }, effets: [{ reputation: { guilde: 2 } }], aller: combat }
            - { texte: "« Je tiens debout plus longtemps que lui.[[|| Et je garde les autres debout.]] »", si: { classe: [guerisseur, barde] }, effets: [{ reputation: { guilde: 2 } }], aller: combat }
            - { texte: "« Avec prudence. Je regarde d'abord comment il bouge. »", effets: [{ reputation: { guilde: 2 } }], aller: combat }
            - { texte: "« On verra bien une fois dedans. »", effets: [{ reputation: { guilde: 1 } }], aller: combat }
            - { texte: "« Vous n'auriez pas un golem plus petit ? »", effets: [{ reputation: { guilde: 1 } }], aller: combat }
      combat:
        repliques:
          - { dit: "Le golem d'argile se met en marche dans un grincement." }
        combat: { rencontre: examen-guilde, victoire: victoire, defaite: defaite }
      victoire:
        repliques:
          - { qui: rowena, dit: "« Pas mal. Pas mal du tout. » Elle tamponne une carte de cuivre. « Rang F. Les contrats sont au tableau. Ne mourez pas bêtement. »" }
          - { qui: kaya, dit: "Kaya rend la mise et y ajoute vingt pièces de sa poche, en grommelant. « Ouais, bon. [[Tu as||Vous avez]] de la chance. »", si: { flag: pari-kaya } }
        effets:
          - { gain_pari: 2 }
          - { flag: examen-reussi, points_guilde: 50, quete: { id: q-ch1-appel, etape: crypte }, journal: "{groupe} réussissent l'examen de la Guilde : rang F." }
        suite: ellipse
      defaite:
        repliques:
          - { qui: rowena, dit: "« Bon. Le golem [[t'a laminé||vous a laminés]]. » Elle soupire. « Mais [[tu t'es relevé||vous vous êtes relevés]]. C'est ce que je cherche. Rang F, à l'essai. »" }
          - { qui: kaya, dit: "Kaya empoche les vingt pièces avec un grand sourire. « Sans rancune. »", si: { flag: pari-kaya } }
        effets:
          - { perte_pari: true }
          - { flag: examen-reussi, points_guilde: 20, quete: { id: q-ch1-appel, etape: crypte }, journal: "{groupe} entrent à la Guilde « à l'essai »." }
        suite: ellipse
      ellipse:
        repliques:
          - { qui: rowena, dit: "« Maintenant, au travail : contrats, entraînement, premières cicatrices. Et quand vous voudrez que les mois passent, prenez une chambre au Chaudron Fêlé. Le temps ne file que si vous le décidez. »" }
          - { qui: aveline, dit: "Aveline passera souvent « par hasard » à la Guilde. Officiellement pour vous surveiller." }
          - { dit: "On raconte que des lueurs étranges apparaissent parfois sous les ruines de la Crypte de la Fontaine, à l'automne. La Guilde vous y enverra en Brumaire 1013." }
        fin: true

  # ─────────────────────────────────────────────────────────────
  - id: ch1-crypte
    titre: "La Crypte de la Fontaine"
    type: groupe
    lieu: crypte-fontaine
    decor: crypte-entree
    quete: q-ch1-appel
    disponible_si: { quete_etape: { q-ch1-appel: crypte }, date_min: { annee: 1013, mois: 7, jour: 1 } }
    noeuds:
      debut:
        repliques:
          - { dit: "L'automne est là. Des paysans ont vu des lueurs violettes sous les ruines de la Crypte de la Fontaine. Rowena [[t'a||vous a]] confié l'affaire." }
          - { qui: aveline, dit: "Aveline [[t'attend||vous attend]] à l'entrée, en armure complète. « Ordre du roi : je [[t'accompagne||vous accompagne]]. Et… je n'allais pas [[te laisser descendre seul||vous laisser descendre seuls]]. »" }
          - { dit: "L'escalier s'enfonce dans le noir. Une odeur d'eau croupie et de vieille pierre monte des profondeurs." }
        choix:
          - texte: "Descendre dans la crypte."
            aller: avant-descente
      avant-descente:
        parole_a:
          regle: { classe: [ombre, archer, gardien] }
          question: { qui: aveline, dit: "Aveline s'arrête sur la première marche et se tourne vers {nom}. « {pseudo}, c'est toi qui ouvres la marche, ou c'est moi ? »" }
          reponses:
            - { texte: "« Moi. Je passe devant, sans bruit. Si quelque chose bouge, je le verrai avant qu'il nous voie. »", si: { classe: ombre }, effets: [{ affinite: { aveline: 2 } }], aller: donjon }
            - { texte: "« Moi. Mon bouclier d'abord, tout le monde derrière. »", si: { classe: gardien }, effets: [{ affinite: { aveline: 3 } }], aller: donjon }
            - { texte: "« Passe devant. Je couvre depuis l'arrière, une flèche encochée. »", si: { classe: archer }, effets: [{ affinite: { aveline: 1 } }], aller: donjon }
            - { texte: "« Un escalier sous terre ? Laisse faire un nain. »", si: { race: nain }, effets: [{ affinite: { aveline: 2 } }], aller: donjon }
            - { texte: "« Je vois dans le noir. Je guide, tu me suis. »", si: { race: elfe }, effets: [{ affinite: { aveline: 2 } }], aller: donjon }
            - { texte: "« Ensemble, côte à côte. »", effets: [{ affinite: { aveline: 2 } }], aller: donjon }
            - { texte: "« Après toi, capitaine. C'est toi qui as l'armure. »", effets: [{ affinite: { aveline: 1 } }], aller: donjon }
            - { texte: "« On tire à pile ou face ? »", effets: [{ affinite: { aveline: 1 } }], aller: donjon }
      donjon:
        donjon: { id: crypte-fontaine, sortie: sortie }
      sortie:
        repliques:
          - { dit: "Vous remontez à la surface, couverts de poussière. Dans votre sac, le sceau cendré pulse d'une lumière violette, comme un cœur." }
          - { qui: aveline, expression: colere, dit: "« Ce symbole… » Aveline pâlit. « On l'a trouvé sur les ruines de Valgrane, il y a dix ans. Le jour où mon père… » Elle se tait." }
        effets:
          - { flag: sceau-trouve, xp: 60, quete: { id: q-ch1-appel, etape: lanternes }, journal: "Dans la Crypte de la Fontaine, {groupe} découvrent un sceau cendré." }
        choix:
          - texte: "Remettre le sceau à l'Ordre, comme le veut la loi."
            effets: [{ reputation: { ordre: 10 }, flag: sceau-ordre }]
            aller: ellipse
          - texte: "Le confier à la Guilde : Rowena saura quoi en faire."
            effets: [{ reputation: { guilde: 10 }, flag: sceau-guilde }]
            aller: ellipse
          - texte: "Le garder et l'étudier vous-mêmes, en secret."
            effets: [{ flag: sceau-garde, affinite: { aveline: 2 } }]
            aller: ellipse
      ellipse:
        repliques:
          - { dit: "L'hiver approche. Le sceau ne quitte pas vos pensées. Toute la ville parle déjà de la prochaine Fête des Lanternes, le 15 Floréal 1014." }
        fin: true

  # ─────────────────────────────────────────────────────────────
  - id: ch1-lanternes
    titre: "La Nuit des Lanternes"
    type: groupe
    lieu: lysmont-place
    decor: lysmont-lanternes-nuit
    quete: q-ch1-appel
    disponible_si: { quete_etape: { q-ch1-appel: lanternes }, date_min: { annee: 1014, mois: 2, jour: 15 } }
    noeuds:
      debut:
        repliques:
          - { dit: "15 Floréal 1014, Fête des Lanternes. Des milliers de lanternes de papier s'élèvent au-dessus de Lysmont, chacune portant le nom d'un disparu." }
          - { qui: bram, dit: "Bram, le tavernier, distribue des brochettes en riant. « Ce soir, c'est la maison qui régale ! »", si: { pas_flag: mort:bram } }
          - { qui: seraphine, dit: "Sur le balcon du château, une jeune femme blonde vous fait un petit signe discret. La princesse Séraphine." }
          - { qui: aveline, dit: "Aveline est là elle aussi, en civil pour une fois, une lanterne éteinte entre les doigts." }
          - { qui: aveline, expression: gene, dit: "« C'est… pour mon père. » Elle hésite, sans vous regarder. « Vous voulez bien rester un moment ? »", si: { affinite_min: { aveline: 20 } } }
        choix:
          - texte: "Lâcher une lanterne avec Aveline, en silence."
            si: { affinite_min: { aveline: 20 } }
            effets: [{ affinite: { aveline: 6 }, flag: heros:lanterne-aveline }]
            aller: lanterne
          - texte: "Profiter de la fête : danses, musique, brochettes."
            effets: [{ affinite: { aveline: 1 } }]
            aller: attaque
      lanterne:
        repliques:
          - { qui: aveline, expression: tristesse, dit: "Vos lanternes montent côte à côte. Aveline murmure : « Il s'appelait Gauvain. Il n'était pas un traître. » Pour la première fois, sa voix tremble." }
          - { qui: aveline, expression: gene, dit: "Elle s'essuie les yeux d'un revers de main. « …Merci. N'en parlez à personne. »" }
        suite: attaque
      attaque:
        repliques:
          - { dit: "Soudain, les lanternes virent au violet. Un cri. Puis une explosion de cendres au centre de la place." }
          - { dit: "Des gobelins cendrés surgissent des égouts, guidés par des cultistes. La foule panique." }
          - { qui: aveline, expression: colere, dit: "« Protégez les civils ! » hurle Aveline en dégainant." }
        choix:
          - texte: "Couvrir la fuite des civils, même si les cultistes s'échappent."
            effets: [{ reputation: { couronne: 5 }, affinite: { aveline: 5 }, flag: civils-proteges }]
            aller: combat1
          - texte: "Foncer sur le cultiste qui dirige l'attaque, coûte que coûte."
            effets: [{ flag: [heros:civils-abandonnes, cultiste-poursuivi], reputation: { guilde: 5 } }]
            aller: combat1
      combat1:
        combat: { rencontre: lanternes-cultistes, victoire: vorthak, defaite: defaite1 }
      defaite1:
        repliques:
          - { dit: "Vous tombez sous le nombre. Quand vous rouvrez les yeux, la garde a repoussé les gobelins… mais le Chaudron Fêlé est en flammes." }
        effets: [{ pnj_mort: bram }]
        suite: vorthak
      vorthak:
        repliques:
          - { dit: "Les flammes s'ouvrent. Une silhouette en armure noire s'avance, une épée nimbée de feu violet à la main." }
          - { qui: vorthak, dit: "« Alors c'est vous, les nouveaux jouets de l'Ordre. » Il rit. « Le Souverain m'a demandé de vous saluer. »" }
          - { qui: vorthak, dit: "« Le sceau. Vous l'avez. Je le sens. Rendez-le-moi, et je laisse vivre cette ville une année de plus. »", si: { flag: sceau-garde } }
        choix:
          - texte: "« Viens le chercher. »"
            aller: combat2
          - texte: "« Pourquoi vous attaquez Lysmont ? Qu'est-ce que vous voulez vraiment ? » (Esprit, difficulté 17)"
            test: { carac: ESP, difficulte: 17, reussite: revelation, echec: combat2 }
      revelation:
        repliques:
          - { qui: vorthak, dit: "Il incline la tête, amusé. « Ce que nous voulons ? Demandez à votre Grand Prieur combien coûte un Appel. Demandez-lui qui paie. »" }
        effets: [{ flag: indice-prix-appel }]
        suite: combat2
      combat2:
        combat: { rencontre: lanternes-vorthak, victoire: victoire, defaite: defaite2 }
      victoire:
        repliques:
          - { qui: vorthak, dit: "Vorthak recule, son armure fendue. « Intéressant… très intéressant. » Il disparaît dans un tourbillon de cendres." }
          - { qui: aveline, expression: joie, dit: "Aveline s'appuie sur son épée, essoufflée, et vous regarde avec un sourire épuisé. « Vous… vous avez été incroyables. »" }
        effets: [{ reputation: { couronne: 10, guilde: 5 }, affinite: { aveline: 4 } }]
        suite: bilan
      defaite2:
        repliques:
          - { dit: "Vorthak vous balaie comme des fétus de paille, puis s'en va, l'air ennuyé. « Revenez quand vous serez dignes de mon temps. »" }
        effets: [{ reputation: { couronne: -5 } }]
        suite: bilan
      bilan:
        repliques:
          - { dit: "À l'aube, Lysmont compte ses morts. Les lanternes calcinées jonchent les pavés." }
          - { qui: bram, dit: "Bram, couvert de suie, vous serre la main à vous broyer les os. « Vous avez sauvé ma taverne. Ici, vous ne paierez plus jamais une bière. »", si: { flag: civils-proteges, pas_flag: mort:bram } }
          - { dit: "Le Chaudron Fêlé n'est plus que cendres. Bram n'a pas survécu.", si: { flag: mort:bram } }
        effets:
          - { flag: lanternes-faites, quete: { id: q-ch1-appel, etape: serment }, journal: "Fête des Lanternes : Vorthak, émissaire des Cendres, attaque Lysmont." }
        fin: true

  # ─────────────────────────────────────────────────────────────
  - id: ch1-serment
    pnj: edmund-iv
    titre: "Le Serment"
    type: groupe
    lieu: chateau
    decor: chateau-trone
    quete: q-ch1-appel
    disponible_si: { quete_etape: { q-ch1-appel: serment }, date_min: { annee: 1014, mois: 10, jour: 3 } }
    noeuds:
      debut:
        repliques:
          - { dit: "Nivôse 1014. La salle du trône est glaciale. Le roi Edmund IV vous toise depuis son trône doré." }
          - { qui: edmund-iv, dit: "« Vous avez défendu ma capitale. Bien. Mais un héros sans maître est une épée sans fourreau : dangereux. »" }
          - { qui: edmund-iv, dit: "« Agenouillez-vous et jurez fidélité à la Couronne. Vous aurez titres, or, et l'honneur de mourir pour Aubeclaire. »" }
          - { qui: seraphine, dit: "La princesse Séraphine, debout à côté du trône, serre les poings. Elle croise votre regard et secoue très légèrement la tête." }
          - { qui: aveline, dit: "Aveline, au garde-à-vous, fixe un point droit devant elle. Mais ses jointures blanchissent sur son épée." }
        choix:
          - texte: "Jurer fidélité à la Couronne."
            effets: [{ reputation: { couronne: 15, guilde: -5 }, flag: serment-couronne, affinite: { aveline: 2 } }]
            aller: jure
          - texte: "Refuser poliment : vous resterez des aventuriers libres, fidèles à la Guilde."
            effets: [{ reputation: { couronne: -10, guilde: 15 }, flag: independants }]
            aller: refus
          - texte: "Négocier : une alliance d'égal à égal, pas un serment de vassal. (Charisme, difficulté 18)"
            test: { carac: CHA, difficulte: 18, reussite: negociation, echec: negociation-ratee }
          - texte: "Faire semblant de jurer, en croisant les doigts dans votre dos."
            effets: [{ reputation: { couronne: 10 }, flag: [serment-couronne, heros:parole-trahie] }]
            aller: faux
      jure:
        repliques:
          - { qui: edmund-iv, dit: "« Relevez-vous, chevaliers d'Aubeclaire. » Le roi sourit enfin. Séraphine détourne les yeux." }
        suite: epilogue
      refus:
        repliques:
          - { qui: edmund-iv, dit: "Un silence de mort. « …Soit. La Guilde répondra de vous. Ne me décevez pas. »" }
          - { qui: seraphine, dit: "En sortant, Séraphine vous rattrape dans un couloir. « C'était courageux. Ou stupide. Les deux me plaisent. »" }
        suite: epilogue
      negociation:
        repliques:
          - { qui: edmund-iv, dit: "Le roi plisse les yeux… puis éclate d'un rire bref. « Vous avez du cran. Une alliance, donc. Mais je m'en souviendrai. »" }
        effets: [{ reputation: { couronne: 5, guilde: 5 }, flag: allies-libres }]
        suite: epilogue
      negociation-ratee:
        repliques:
          - { qui: edmund-iv, dit: "« Des conditions ? À MOI ? » Le roi se lève, furieux. « Hors de ma vue ! »" }
        effets: [{ reputation: { couronne: -15, guilde: 10 }, flag: independants }]
        suite: epilogue
      faux:
        repliques:
          - { dit: "Vous prononcez les mots du serment. Personne ne remarque vos doigts croisés… sauf Aveline, juste derrière vous. Son visage se ferme." }
        suite: epilogue
      epilogue:
        repliques:
          - { dit: "Ce soir-là, sur les remparts, vous regardez les étoiles d'un ciel qui n'est pas le vôtre." }
          - { qui: aveline, dit: "« Le printemps prochain, on m'envoie à la frontière sud. » Aveline hésite. « J'aimerais… que vous veniez. » Elle rougit. « Pour la mission, évidemment. »", si: { affinite_min: { aveline: 35 } } }
          - { dit: "Deux ans ont passé depuis l'Appel. Velmaris n'est plus un monde étranger : c'est le vôtre, désormais. Et il brûle déjà au nord." }
        effets:
          - { terminer_quete: q-ch1-appel, xp: 150 }
          - { fin_chapitre: 1 }
        fin: true
