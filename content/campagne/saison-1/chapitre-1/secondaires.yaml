# Chapitre 1 — quêtes secondaires (scènes de groupe, disponibles après l'examen de la Guilde).
# Une quête secondaire se joue par étapes : chaque étape est une courte scène dans un lieu de la carte
# (voir `etapes` dans quetes.yaml). On ne tombe plus directement sur un combat.
scenes:
  - id: sq-loups-guilde
    pnj: rowena
    titre: "Les loups de la Combe : l'affaire"
    type: groupe
    lieu: guilde
    decor: guilde
    quete: q-loups
    disponible_si: { flag: examen-reussi, pas_flag: loups-acceptes }
    noeuds:
      debut:
        repliques:
          - { qui: rowena, dit: "« Un fermier de la Combe-aux-Saules, Gareth, perd ses moutons. Il n'a pas de quoi payer un vrai contrat, alors personne n'y va. » Rowena [[te||vous]] regarde par-dessus sa pipe. « Sauf si ça [[t'intéresse||vous intéresse]]. »" }
        choix:
          - texte: "« [[J'y vais||On y va]]. »"
            effets: [{ flag: loups-acceptes, quete: { id: q-loups, etape: ferme } }]
            aller: accepte
      accepte:
        repliques:
          - { qui: rowena, dit: "« La ferme est au sud-ouest, à l'entrée de la Combe. Et [[reviens||revenez]] me dire comment ça s'est fini. »" }
        fin: true
  - id: sq-loups-ferme
    pnj: gareth
    titre: "Les loups de la Combe : la ferme de Gareth"
    type: groupe
    lieu: combe-aux-saules
    decor: combe-aux-saules
    quete: q-loups
    disponible_si: { quete_etape: { q-loups: ferme } }
    noeuds:
      debut:
        repliques:
          - { qui: gareth, dit: "« Trois moutons cette semaine ! Et hier, ma petite Rose a vu des yeux jaunes à la lisière. » Gareth tord son chapeau de paille entre ses mains." }
          - { qui: gareth, dit: "« Les traces partent de l'enclos vers les ronces, là-bas. Moi, je n'ose plus y aller. »" }
        effets: [{ quete: { id: q-loups, etape: traces } }]
        fin: true
  - id: sq-loups-traces
    titre: "Les loups de la Combe : les traces"
    type: groupe
    lieu: combe-lisiere
    decor: combe-aux-saules
    quete: q-loups
    disponible_si: { quete_etape: { q-loups: traces } }
    noeuds:
      debut:
        repliques:
          - { dit: "À la lisière, la terre est retournée. Des empreintes larges comme une main… et d'autres, toutes petites, à côté." }
        choix:
          - texte: "Suivre les grandes empreintes."
            aller: grandes
          - texte: "Regarder de plus près les petites."
            effets: [{ flag: louveteaux-vus }]
            aller: petites
      grandes:
        repliques:
          - { dit: "La piste est franche : elle file droit vers un énorme saule, au fond de la Combe." }
        effets: [{ quete: { id: q-loups, etape: taniere } }]
        fin: true
      petites:
        repliques:
          - { dit: "Des louveteaux. La meute ne chasse pas par plaisir : elle nourrit ses petits. La piste mène à un énorme saule, au fond de la Combe." }
        effets: [{ quete: { id: q-loups, etape: taniere }, xp: 10 }]
        fin: true
  - id: sq-loups
    titre: "Les loups de la Combe : le vieux saule"
    type: groupe
    lieu: combe-taniere
    decor: combe-aux-saules
    quete: q-loups
    disponible_si: { quete_etape: { q-loups: taniere } }
    noeuds:
      debut:
        repliques:
          - { dit: "Une tanière s'ouvre sous les racines du vieux saule. Des grognements… et des gémissements plus aigus : des louveteaux." }
        choix:
          - texte: "Attaquer la meute."
            aller: combat
          - texte: "Utiliser votre don pour parler à la louve. (Langue universelle)"
            si: { don: langue-universelle }
            aller: parler
          - texte: "Effrayer la meute avec du feu et du bruit pour la faire partir. (Force, difficulté 16)"
            test: { carac: FOR, difficulte: 16, reussite: fuite, echec: combat }
      parler:
        repliques:
          - { dit: "La louve vous écoute, babines retroussées. Puis, lentement, elle comprend : les fermiers, les pièges, les bois plus au sud où le gibier abonde." }
          - { dit: "À l'aube, la meute est partie. Gareth n'en croit pas ses yeux." }
        effets: [{ xp: 80, flag: loups-sauves }]
        suite: fin
      fuite:
        repliques:
          - { dit: "Torches, cris, casseroles : la meute détale vers le sud avec ses petits. Aucun sang versé." }
        effets: [{ xp: 60, flag: loups-sauves }]
        suite: fin
      combat:
        combat: { rencontre: loups-alpha, victoire: victoire, defaite: defaite }
      victoire:
        repliques:
          - { dit: "La meute est décimée. Les louveteaux s'enfuient dans les fourrés." }
        suite: fin
      defaite:
        repliques:
          - { dit: "Les loups vous repoussent. Gareth vous traîne jusqu'à sa ferme et vous soigne avec une soupe épaisse. « On réessaiera. »" }
        suite: fin
      fin:
        repliques:
          - { dit: "Le calme revient sur la Combe. Il reste à prévenir Gareth… et Rowena, à la Guilde." }
        effets: [{ quete: { id: q-loups, etape: retour } }]
        fin: true
  - id: sq-loups-retour
    pnj: rowena
    rend_quete: true
    titre: "Les loups de la Combe : le compte rendu"
    type: groupe
    lieu: guilde
    decor: guilde
    quete: q-loups
    disponible_si: { quete_etape: { q-loups: retour } }
    noeuds:
      debut:
        repliques:
          - { qui: rowena, dit: "« Alors, ces loups ? »" }
          - { qui: rowena, dit: "« Partis sans une goutte de sang ? » Elle hausse un sourcil. « C'est rare, ça. Et ça me plaît. »", si: { flag: loups-sauves } }
          - { qui: gareth, dit: "Gareth a fait le chemin jusqu'à la Guilde, son chapeau à la main. « Merci, du fond du cœur. Tenez, c'est pas grand-chose, mais c'est honnête. »" }
        effets: [{ or: 25, points_guilde: 30, terminer_quete: q-loups, reputation: { guilde: 3 } }]
        fin: true

  # Orlan Cassebrune, colporteur de reliques (test 4) : il remplace Ferrand dans cette scène (Ferrand reste l'expert qui identifie).
  # Démasqué ou arrêté : flag orlan-parti, il ne revient jamais. Sinon il part 3 jours plus tard et revient 60 jours après
  # (minuteurs orlan-depart et orlan-retour), avec une nouvelle relique : sq-reliques-retour.
  - id: sq-reliques
    pnj: orlan
    titre: "Le marchand de reliques"
    type: groupe
    lieu: taverne
    decor: taverne
    quete: q-reliques
    disponible_si: { flag: examen-reussi }
    noeuds:
      debut:
        effets: [{ quete: { id: q-reliques, etape: enqueter }, flag: orlan-rencontre }]
        repliques:
          - { qui: orlan, dit: "« Approchez, approchez ! Orlan Cassebrune, colporteur de merveilles ! » Il brandit un petit os jauni, posé sur un coussin de velours mité. « Ceci, [[{{mon ami|mon amie}}||{{groupe:mes amis|mes amies|mes amis}}]], est un os authentique de Saint Aldebrand, le Premier Appelé ! Il guérit les fièvres et porte chance aux aventuriers. Cent pièces seulement ! »" }
          - { qui: orlan, dit: "« J'ai aussi un cheveu de la Reine des Brumes. Mais celui-là, je le garde pour moi. »" }
          - { qui: bram, dit: "Bram lève les yeux au ciel derrière son comptoir. « Ça fait trois semaines qu'il vend des os de poulet. »", si: { pas_flag: mort:bram } }
          - { qui: ferrand, dit: "À la table du fond, Ferrand l'expert lève un sourcil et ne dit rien. Il a l'air de souffrir pour toute la profession." }
        choix:
          - texte: "Examiner la « relique » de près. (Intelligence, difficulté 15)"
            test: { carac: INT, difficulte: 15, reussite: demasque, echec: rate }
          - texte: "L'acheter. On ne sait jamais."
            si: { or_min: 100 }
            visible_si_bloque: true
            effets: [{ or: -100, objet: relique-douteuse, flag: orlan-achete }]
            aller: achete
          - texte: "Aller prévenir l'Ordre : vendre de fausses reliques est un crime."
            aller: ordre
          - texte: "L'ignorer et retourner à sa bière."
            aller: ignore
      demasque:
        repliques:
          - { dit: "Un os de poulet, verni et gravé à la hâte. [[Tu le brandis||Vous le brandissez]] sous le nez des clients. Rires, huées : Orlan ramasse son coussin et s'enfuit sous les quolibets, en jurant qu'on n'a « aucun respect pour l'histoire »." }
        effets: [{ xp: 50, reputation: { guilde: 5 }, flag: [orlan-demasque, orlan-parti] }]
        suite: fin
      rate:
        repliques:
          - { dit: "L'os a l'air… vrai ? [[Tu n'en es pas {{sûr|sûre}}||Vous n'en êtes pas {{groupe:sûrs|sûres|sûrs}}]]. Orlan [[t'adresse||vous adresse]] un clin d'œil satisfait." }
        effets: [{ minuteur: { id: orlan-depart, jours: 3 } }, { minuteur: { id: orlan-retour, jours: 63 } }]
        suite: fin
      achete:
        repliques:
          - { dit: "Orlan empoche l'or avec un sourire radieux et une révérence un peu trop basse. La relique sent vaguement le poulet rôti." }
        effets: [{ minuteur: { id: orlan-depart, jours: 3 } }, { minuteur: { id: orlan-retour, jours: 63 } }]
        suite: fin
      ordre:
        repliques:
          - { qui: elianne, dit: "Sœur Elianne arrive en personne, le visage grave. « Ces escrocs salissent la mémoire des Appelés. Merci. » Orlan est emmené par deux gardes, en protestant qu'il est « victime d'un fournisseur malhonnête »." }
        effets: [{ reputation: { ordre: 8 }, flag: [orlan-arrete, orlan-parti], xp: 40 }]
        suite: fin
      ignore:
        repliques:
          - { qui: orlan, dit: "Orlan hausse les épaules et range son coussin. « Les vraies merveilles attendent toujours leur heure. »" }
        effets: [{ minuteur: { id: orlan-depart, jours: 3 } }, { minuteur: { id: orlan-retour, jours: 63 } }]
        suite: fin
      fin:
        effets: [{ terminer_quete: q-reliques, points_guilde: 15 }]
        fin: true

  # Le retour d'Orlan (peut se rejouer) : à son arrivée, on tire la relique proposée (une sur trois) et si elle est vraie (10 %).
  - id: sq-reliques-retour
    pnj: orlan
    titre: "Le retour du colporteur"
    type: groupe
    repetable: true
    lieu: taverne
    decor: taverne
    disponible_si: { minuteur_passe: orlan-retour, pas_flag: orlan-parti }
    noeuds:
      debut:
        effets: [{ tirage_un: [orlan-relique-phalange, orlan-relique-clou, orlan-relique-larme] }, { tirage: { flag: orlan-relique-vraie, chance: 0.1 } }]
        repliques:
          - { qui: orlan, dit: "« [[{{Mon ami|Mon amie}}||{{groupe:Mes amis|Mes amies|Mes amis}}]] ! » Orlan Cassebrune ouvre grand les bras. « Je n'oublie jamais un visage. Surtout un visage qui m'a déjà fait confiance. »" }
          - { qui: orlan, dit: "« Et cet os de saint, il vous porte chance ? Non ? Il faut lui laisser le temps. »", si: { flag: orlan-achete } }
          - { qui: orlan, dit: "Il déballe un coffret doublé de soie. « Cette fois, c'est du sérieux. La phalange de Saint Aldebrand. L'autre phalange. Il en avait plusieurs, vous savez. »", si: { flag: orlan-relique-phalange } }
          - { qui: orlan, dit: "Il déballe un coffret doublé de soie. « Cette fois, c'est du sérieux. Un clou de la Porte d'Aube, arraché la nuit où le Mur a tenu. Il n'en reste presque plus. »", si: { flag: orlan-relique-clou } }
          - { qui: orlan, dit: "Il déballe un coffret doublé de soie. « Cette fois, c'est du sérieux. Une larme de Sainte Ysolde, dans sa fiole de cristal. Elle relève les mourants, dit-on. »", si: { flag: orlan-relique-larme } }
          - { qui: bram, dit: "Bram, en essuyant une chope : « Il est revenu. Évidemment qu'il est revenu. »", si: { pas_flag: mort:bram } }
        choix:
          - texte: "Examiner la relique de près. (Intelligence, difficulté 15)"
            test: { carac: INT, difficulte: 15, reussite: examen-ok, echec: rate }
          - texte: "L'acheter. On ne sait jamais."
            si: { or_min_chapitre: 100 }
            visible_si_bloque: true
            effets: [{ prix_chapitre: 100, flag: orlan-achete }]
            aller: achete
          - texte: "Aller prévenir l'Ordre : vendre de fausses reliques est un crime."
            aller: ordre
          - texte: "L'ignorer et retourner à sa bière."
            aller: ignore
      examen-ok:
        repliques:
          - { dit: "[[Tu approches||Vous approchez]] la relique de la lanterne et [[la tournes||la tournez]] lentement entre [[tes||vos]] doigts." }
        aiguillage: [{ si: { flag: orlan-relique-vraie }, aller: sincere }]
        suite: demasque
      sincere:
        repliques:
          - { dit: "Ce n'est pas un os de poulet. Le travail est ancien, les gravures sont justes, et quand [[tu la prends||vous la prenez]] en main, une chaleur douce remonte le long du bras." }
          - { qui: orlan, dit: "Orlan pâlit. « Elle est… vraie ? » Il s'assoit lourdement. « Trente ans de métier, et c'est la première fois. »" }
        choix:
          - texte: "L'acheter."
            si: { or_min_chapitre: 100 }
            visible_si_bloque: true
            effets: [{ prix_chapitre: 100, flag: orlan-achete }]
            aller: achete-vraie
          - texte: "La lui laisser."
            aller: depart
      demasque:
        repliques:
          - { dit: "Un os de poulet. Encore. Celui-ci a même gardé un peu de sauce. [[Tu le brandis||Vous le brandissez]] devant toute la taverne ; Orlan s'enfuit, et cette fois, on ne le reverra plus." }
        effets: [{ xp: 40, reputation: { guilde: 3 }, flag: [orlan-demasque, orlan-parti] }]
        fin: true
      rate:
        repliques:
          - { dit: "Impossible de trancher. Orlan sourit de toutes ses dents." }
        suite: depart
      achete:
        repliques:
          - { dit: "L'or change de mains. Orlan compte les pièces deux fois, par principe." }
        aiguillage: [{ si: { flag: orlan-relique-vraie }, aller: achete-vraie }]
        suite: achete-fausse
      achete-fausse:
        repliques:
          - { dit: "Orlan empoche l'or avec une révérence. La relique sent toujours le poulet." }
        effets: [{ objet: relique-douteuse }]
        suite: depart
      achete-vraie:
        repliques:
          - { qui: orlan, dit: "Orlan emballe l'objet avec un soin qu'on ne lui connaissait pas." }
        aiguillage: [{ si: { flag: orlan-relique-phalange }, aller: don-phalange }, { si: { flag: orlan-relique-clou }, aller: don-clou }]
        suite: don-larme
      don-phalange:
        repliques:
          - { qui: orlan, dit: "« Prenez-en soin. Moi, je n'y croyais pas. »" }
        effets: [{ objet: "relique-phalange-{palier}" }]
        suite: depart
      don-clou:
        repliques:
          - { qui: orlan, dit: "« Prenez-en soin. Moi, je n'y croyais pas. »" }
        effets: [{ objet: "relique-clou-{palier}" }]
        suite: depart
      don-larme:
        repliques:
          - { qui: orlan, dit: "« Prenez-en soin. Moi, je n'y croyais pas. »" }
        effets: [{ objet: larme-ysolde }]
        suite: depart
      ordre:
        repliques:
          - { dit: "Un garçon de salle court chercher l'Ordre. Orlan, lui, ne bouge pas : il commande même une bière." }
        aiguillage: [{ si: { flag: orlan-relique-vraie }, aller: ordre-vraie }]
        suite: ordre-fausse
      ordre-fausse:
        repliques:
          - { qui: elianne, dit: "Sœur Elianne arrive en personne, le visage grave. « Ces escrocs salissent la mémoire des Appelés. Merci. » Orlan est emmené par deux gardes, en protestant qu'il est « victime d'un fournisseur malhonnête »." }
        effets: [{ xp: 30, reputation: { ordre: 5 }, flag: [orlan-arrete, orlan-parti] }]
        fin: true
      ordre-vraie:
        repliques:
          - { qui: elianne, dit: "« Elle est authentique. » Elianne la tient comme un nouveau-né. « Où l'avez-vous trouvée ? » Orlan bafouille une histoire de grenier. L'Ordre la lui achète à bon prix : il repart ravi, et parfaitement innocent." }
        effets: [{ reputation: { ordre: 5 } }]
        suite: depart
      ignore:
        repliques:
          - { qui: orlan, dit: "« Je repasserai. Je repasse toujours. »" }
        suite: depart
      depart:
        repliques:
          - { dit: "Orlan range son coffret. Dans quelques jours, il repartira vers d'autres marchés." }
        effets: [{ minuteur: { id: orlan-depart, jours: 3 } }, { minuteur: { id: orlan-retour, jours: 63 } }]
        fin: true

  - id: sq-tanneurs-plainte
    titre: "Les disparus des Tanneurs : la plainte"
    type: groupe
    lieu: quartier-tanneurs
    decor: quartier-tanneurs
    quete: q-tanneurs
    disponible_si: { flag: examen-reussi, pas_flag: tanneurs-commence }
    noeuds:
      debut:
        repliques:
          - { dit: "Les ruelles des Tanneurs sentent l'urine et la teinture. Une mère [[t'agrippe||vous agrippe]] le bras : « Ma fille, Lina. Partie chercher de l'eau il y a trois jours. »" }
          - { dit: "« La garde ne vient plus ici. Je n'ai que [[toi||vous]]. »" }
        effets: [{ flag: tanneurs-commence, quete: { id: q-tanneurs, etape: piste } }]
        fin: true
  - id: sq-tanneurs-piste
    titre: "Les disparus des Tanneurs : la piste"
    type: groupe
    lieu: quartier-tanneurs
    decor: quartier-tanneurs
    quete: q-tanneurs
    disponible_si: { quete_etape: { q-tanneurs: piste } }
    noeuds:
      debut:
        repliques:
          - { dit: "Près du puits, un seau renversé. Des traces de pas, une odeur de soufre." }
          - { dit: "Et, gravé sur une porte, un symbole violet que [[tu commences||vous commencez]] à connaître.", si: { flag: sceau-trouve } }
        choix:
          - texte: "Suivre la piste de soufre. (Esprit, difficulté 14)"
            test: { carac: ESP, difficulte: 14, reussite: piste, echec: retard }
          - texte: "Interroger les ivrognes du coin, avec quelques pièces. (Charisme, difficulté 13)"
            test: { carac: CHA, difficulte: 13, reussite: piste, echec: retard }
      piste:
        repliques:
          - { dit: "La piste mène à une tannerie abandonnée, au bout de la ruelle. Sous la trappe de la cave : des chants étouffés." }
        effets: [{ flag: tanneurs-piste-fraiche, quete: { id: q-tanneurs, etape: cave } }]
        fin: true
      retard:
        repliques:
          - { dit: "Des heures précieuses sont perdues. À la nuit tombée seulement, quelqu'un parle enfin d'une tannerie abandonnée, au bout de la ruelle." }
        effets: [{ quete: { id: q-tanneurs, etape: cave } }]
        fin: true
  - id: sq-tanneurs
    titre: "Les disparus des Tanneurs : la cave"
    type: groupe
    lieu: tannerie-abandonnee
    # dehors (tannerie-abandonnee), puis la cave (tannerie-cave) dès qu'on descend
    decor: tannerie-abandonnee
    quete: q-tanneurs
    disponible_si: { quete_etape: { q-tanneurs: cave } }
    noeuds:
      debut:
        repliques:
          - { dit: "Au bout de la ruelle, la tannerie abandonnée. Volets cloués, enseigne effacée, et dans la cour, des cuves de trempage à sec où ne pousse plus qu'une mousse noire." }
          - { dit: "Pourtant, le seuil n'a rien d'abandonné : la poussière est couverte de traces de pas, et de deux sillons parallèles, comme si on avait traîné quelqu'un." }
          - { dit: "Au fond de l'atelier, une trappe de cave. Ses gonds sont graissés de frais. Une odeur monte entre les planches : de la cire, sucrée, presque écœurante. De la cire violette." }
          - { dit: "Sous [[tes||vos]] pieds, très loin, un chant étouffé. Des voix qui répètent la même phrase, encore et encore.", si: { flag: tanneurs-piste-fraiche } }
          - { dit: "Aucun bruit ne monte de la trappe. Un silence trop parfait, celui de quelqu'un qui [[t'attend||vous attend]].", si: { pas_flag: tanneurs-piste-fraiche } }
        choix:
          - texte: "Descendre dans la cave."
            si: { flag: tanneurs-piste-fraiche }
            aller: piste
          - texte: "Descendre dans la cave."
            si: { pas_flag: tanneurs-piste-fraiche }
            aller: retard
      piste:
        decor: tannerie-cave
        repliques:
          - { dit: "L'échelle grince à chaque barreau. [[Tu retiens ton||Vous retenez votre]] souffle. En bas, la lumière est violette." }
          - { dit: "La cave est plus grande que la tannerie elle-même. Des cages de fer le long des murs, des dizaines de bougies violettes fondues en flaques, et sur chaque pierre, le même symbole : un cercle brisé, entouré de flammes." }
          - { dit: "Les cultistes sont en plein rituel, dos à l'échelle, et ne [[t'ont pas {{entendu|entendue}}||vous ont pas {{groupe:entendus|entendues|entendus}}]]. Ils chantent dans une langue qui râpe la gorge." }
          - { dit: "Dans la cage du fond, une jeune fille aux mains tachées de teinture lève la tête. Lina. Vivante." }
          - { dit: "Un cultiste se retourne pour moucher une bougie, et [[te||vous]] voit. Il a l'air aussi surpris que [[toi||vous]]." }
        combat: { rencontre: tanneurs-cultistes, victoire: sauvee, defaite: echec }
      retard:
        decor: tannerie-cave
        repliques:
          - { dit: "L'échelle grince à chaque barreau. [[Tu retiens ton||Vous retenez votre]] souffle. En bas, la lumière est violette." }
          - { dit: "La cave est plus grande que la tannerie elle-même. Des cages de fer le long des murs, des dizaines de bougies violettes fondues en flaques, et sur chaque pierre, le même symbole : un cercle brisé, entouré de flammes." }
          - { dit: "Les bougies brûlent, mais plus personne ne chante. Les cultistes [[t'attendent||vous attendent]] au pied de l'échelle, lames tirées. « Vous en avez mis, du temps. »" }
          - { dit: "Au fond, une cage est ouverte, et les bougies autour d'elle se sont éteintes." }
        combat: { rencontre: tanneurs-cultistes, victoire: trop-tard, defaite: echec }
      sauvee:
        decor: tannerie-cave
        repliques:
          - { qui: lina, dit: "Lina se jette dans les bras de sa mère en pleurant. Les deux autres disparus sont là aussi, affaiblis mais vivants." }
        effets: [{ reputation: { couronne: 5, guilde: 5 }, xp: 70, flag: lina-sauvee }]
        suite: fin
      trop-tard:
        decor: tannerie-cave
        repliques:
          - { dit: "Les cultistes sont vaincus. Deux prisonniers sont sauvés… mais pour Lina, il est trop tard. Sa mère s'effondre." }
        effets: [{ pnj_mort: lina, xp: 50 }]
        suite: fin
      echec:
        decor: tannerie-cave
        repliques:
          - { dit: "Vous êtes repoussés. Quand la garde investit la cave le lendemain, elle est vide. On ne retrouvera jamais Lina." }
        effets: [{ pnj_mort: lina, reputation: { couronne: -5 } }]
        suite: fin
      fin:
        decor: tannerie-abandonnee
        repliques:
          - { dit: "Il faut que la Guilde sache ce qui se cachait sous cette tannerie." }
        effets: [{ quete: { id: q-tanneurs, etape: retour }, flag: cultistes-lysmont }]
        fin: true
  - id: sq-tanneurs-retour
    pnj: rowena
    rend_quete: true
    titre: "Les disparus des Tanneurs : le rapport"
    type: groupe
    lieu: guilde
    decor: guilde
    quete: q-tanneurs
    disponible_si: { quete_etape: { q-tanneurs: retour } }
    noeuds:
      debut:
        repliques:
          - { qui: rowena, dit: "Rowena écoute sans un mot, puis repose sa pipe. « Des cultistes des Cendres. Dans MA ville. » Elle griffonne un ordre pour la garde." }
          - { qui: rowena, dit: "« La petite Lina est rentrée chez elle. C'est grâce à [[toi||vous]]. »", si: { flag: lina-sauvee } }
        effets: [{ terminer_quete: q-tanneurs, points_guilde: 30 }]
        fin: true

  - id: sq-apprenti
    pnj: elianne
    titre: "L'apprenti de l'Ordre"
    type: groupe
    lieu: temple-du-seuil
    decor: temple-du-seuil
    quete: q-apprenti
    disponible_si: { flag: examen-reussi }
    noeuds:
      debut:
        effets: [{ quete: { id: q-apprenti, etape: parler } }]
        repliques:
          - { qui: elianne, dit: "« Tobin, mon apprenti, passe ses nuits dans les archives interdites. S'il se fait prendre par le Grand Prieur… » Sœur Elianne se mord la lèvre. « Pouvez-vous lui parler ? »" }
          - { qui: tobin, dit: "Vous trouvez Tobin entre deux rayonnages, une bougie à la main, un vieux registre ouvert. « Regardez ! Les registres de l'Appel. Il manque des pages. Toujours les mêmes : le prix. »" }
        choix:
          - texte: "Lire le registre avec lui."
            effets: [{ flag: indice-prix-appel, xp: 30 }]
            aller: lire
          - texte: "Le convaincre de remettre le registre en place avant qu'il ne soit trop tard."
            effets: [{ reputation: { ordre: 5 } }]
            aller: raisonner
          - texte: "Le dénoncer au Grand Prieur Auréliath."
            effets: [{ reputation: { ordre: 10 }, flag: tobin-denonce }]
            aller: denonce
      lire:
        repliques:
          - { dit: "Une seule ligne a échappé au grattoir : « …et pour chaque Appel, le Voile cède d'un fil, et au nord, les Cendres s'en nourrissent. »" }
          - { qui: elianne, expression: surprise, dit: "Elianne, derrière vous, a tout entendu. Elle est livide." }
        suite: fin
      raisonner:
        repliques:
          - { qui: tobin, dit: "Tobin soupire et range le registre. « Vous avez raison. Mais un jour, quelqu'un devra savoir. »" }
        suite: fin
      denonce:
        repliques:
          - { qui: aureliath, dit: "Le Grand Prieur vous remercie chaleureusement. Le lendemain, Tobin a été « envoyé dans un monastère du nord ». Elianne ne vous adresse plus la parole." }
        suite: fin
      fin:
        effets: [{ terminer_quete: q-apprenti, points_guilde: 15 }]
        fin: true

  - id: sq-tournoi-inscription
    pnj: aveline
    titre: "Le tournoi des écuyers : l'inscription"
    type: groupe
    lieu: arene
    decor: arene
    quete: q-tournoi
    disponible_si: { flag: examen-reussi, pas_flag: tournoi-inscrit }
    noeuds:
      debut:
        repliques:
          - { qui: aveline, dit: "Aveline, juge du tournoi, [[t'accueille||vous accueille]]. « Un de nos écuyers s'est cassé la jambe. Il me faut un remplaçant. Et un adversaire coriace pour le finaliste : un mercenaire qui triche. »" }
          - { qui: aveline, expression: gene, dit: "« Si [[tu gagnes… je t'offre||vous gagnez… je vous offre]] une pâtisserie. » Elle se racle la gorge. « C'est une coutume. »" }
          - { qui: aveline, dit: "« Il traîne sur la place avant chaque combat. [[Va||Allez]] voir comment il s'y prend, puis [[reviens||revenez]] ici. »" }
        effets: [{ flag: tournoi-inscrit, quete: { id: q-tournoi, etape: reperer } }]
        fin: true
  - id: sq-tournoi-reperage
    titre: "Le tournoi des écuyers : le tricheur"
    type: groupe
    lieu: lysmont-place
    decor: lysmont-place
    quete: q-tournoi
    disponible_si: { quete_etape: { q-tournoi: reperer } }
    noeuds:
      debut:
        repliques:
          - { dit: "Le mercenaire est là, près de la fontaine, entouré de parieurs. Un grand gaillard au sourire trop sûr de lui." }
        choix:
          - texte: "L'observer de loin pendant qu'il s'échauffe."
            aller: observe
          - texte: "Payer un verre à l'un de ses anciens adversaires."
            si: { or_min: 2 }
            visible_si_bloque: true
            effets: [{ or: -2 }]
            aller: verre
      observe:
        repliques:
          - { dit: "Il glisse quelque chose dans son gant gauche avant chaque passe : une poignée de sable. Maintenant, [[tu sais||vous savez]] d'où viendra le coup bas." }
        effets: [{ quete: { id: q-tournoi, etape: duel }, xp: 10 }]
        fin: true
      verre:
        repliques:
          - { dit: "« Il vise les yeux. Du sable, toujours de la main gauche. » L'écuyer vide sa chope. « Et il frappe quand on recule. »" }
        effets: [{ quete: { id: q-tournoi, etape: duel }, xp: 10 }]
        fin: true
  - id: sq-tournoi
    pnj: aveline
    titre: "Le tournoi des écuyers : le duel"
    type: groupe
    lieu: arene
    decor: arene
    quete: q-tournoi
    disponible_si: { quete_etape: { q-tournoi: duel } }
    noeuds:
      debut:
        repliques:
          - { qui: aveline, dit: "« [[Te||Vous]] voilà. Le finaliste est prêt. » Aveline baisse la voix. « Méfie-toi de sa main gauche. »" }
        choix:
          - texte: "Entrer en lice."
            aller: combat
      combat:
        combat: { rencontre: tournoi-ecuyers, victoire: victoire, defaite: defaite }
      victoire:
        repliques:
          - { dit: "La foule rugit. Le mercenaire, désarmé, est escorté hors de l'arène." }
          - { qui: aveline, expression: joie, dit: "Aveline vous tend un gâteau de Lysmont, les joues roses. « Coutume. C'est la coutume. »" }
        effets: [{ affinite: { aveline: 6 }, objet: gateau-lysmont, reputation: { couronne: 5 }, or: 40 }]
        suite: fin
      defaite:
        repliques:
          - { qui: aveline, dit: "« Il trichait, je l'ai vu. » Aveline fait disqualifier le mercenaire. « Vous vous êtes battus honnêtement. C'est ce qui compte. »" }
        effets: [{ affinite: { aveline: 3 } }]
        suite: fin
      fin:
        effets: [{ terminer_quete: q-tournoi, points_guilde: 25 }]
        fin: true

  # ─────────────────────────────────────────────────────────────
  #  Quête d'initiation : la boutique (changement 4 du test 1)
  - id: sq-boutique
    pnj: halvine
    titre: "Premiers pas au Comptoir"
    type: individuel
    lieu: boutique
    decor: boutique
    quete: q-boutique
    disponible_si: { flag: examen-reussi, pas_flag: boutique-decouverte }
    noeuds:
      debut:
        repliques:
          - { qui: halvine, dit: "« Un nouveau visage de la Guilde ! Entrez, entrez. Dame Halvine Corbelet, pour vous servir. Ici, tout a un prix, et le prix est juste. »" }
          - { qui: halvine, dit: "« C'est simple : l'onglet Acheter montre ce que je vends, l'onglet Vendre montre ce que vous avez dans votre sac. Je reprends tout à moitié prix, sauf les objets de quête. »" }
          - { dit: "En vous penchant vers le comptoir, vous remarquez quelque chose qui brille entre deux pavés : une vieille breloque de cuivre." }
          - { qui: halvine, dit: "« Tiens, ça traîne là depuis des semaines. Gardez-la. Achetez-moi d'abord quelque chose d'utile, une petite potion par exemple, puis revendez-moi cette breloque : vous saurez tout faire. »" }
        effets:
          - { flag: boutique-decouverte, objet: breloque-cabossee, quete: { id: q-boutique, etape: acheter } }
        fin: true
  - id: sq-boutique-fin
    pnj: halvine
    rend_quete: true
    titre: "Premiers pas au Comptoir : le compte est bon"
    type: individuel
    lieu: boutique
    decor: boutique
    quete: q-boutique
    disponible_si: { quete_etape: { q-boutique: retour } }
    noeuds:
      debut:
        repliques:
          - { qui: halvine, dit: "« Acheté, vendu, et sans vous faire rouler : vous apprenez vite. » Elle pousse une petite fiole et quelques pièces vers vous." }
          - { qui: halvine, dit: "« Cadeau de la maison. Revenez quand votre bourse sera plus lourde : j'ai toujours de quoi l'alléger. »" }
        effets:
          - { terminer_quete: q-boutique, or: 15, xp: 20, objet: potion-soin-petite }
        fin: true