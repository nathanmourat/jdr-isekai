# Chapitre 5 — « La Guerre des Cendres » (1024 → 1027), le Mur d'Aube, niveaux 28 à 34.
quetes:
  - id: q-ch5-guerre
    titre: "Chapitre 5 — La Guerre des Cendres"
    type: principale
    chapitre: 5
    niveau: 27
    region: mur-d-aube
    resume: "La Légion Cendrée va attaquer le Mur d'Aube. Toutes les alliances que vous avez nouées vont être mises à l'épreuve."
    etapes:
      - { id: depart, objectif: "Se présenter au château de Lysmont pour le conseil de guerre (Germinal 1024).", scene: ch5-depart, lieu: chateau }
      - { id: fort, objectif: "Rejoindre la Maréchale à l'État-major de Fort-Aube.", scene: ch5-fort, lieu: fort-aube-etat-major, niveau: 28 }
      - { id: chute, objectif: "Défendre le chemin de ronde pendant l'assaut (Floréal 1025).", scene: ch5-chute, lieu: chemin-de-ronde, niveau: 29 }
      - { id: rang-s, objectif: "Passer l'épreuve du rang S à l'Arène de Lysmont (Germinal 1026).", scene: ch5-rang-s, lieu: arene, niveau: 30 }
      - { id: aldric, objectif: "Suivre la piste du chevalier noir jusqu'aux ruines de Valgrane (Ardent 1026).", scene: ch5-aldric, lieu: valgrane-ruines, niveau: 31 }
      - { id: contre-offensive, objectif: "Mener la contre-offensive dans la plaine cendrée (Aurore 1026).", scene: ch5-contre-offensive, lieu: plaine-cendree, niveau: 33 }
      - { id: fin, objectif: "Chapitre terminé." }

