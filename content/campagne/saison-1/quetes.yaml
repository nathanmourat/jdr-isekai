quetes:
  - id: q-ch1-appel
    titre: "Chapitre 1 — L'Appel"
    type: principale
    chapitre: 1
    resume: "Invoqués ou revenus d'une autre vie, vous voici à Lysmont. Survivez, entrez à la Guilde, et découvrez ce que la Couronne attend de vous."
    etapes:
      - { id: appel, objectif: "Écouter le Grand Prieur au Temple du Seuil.", scene: ch1-appel, lieu: temple-du-seuil }
      - { id: examen, objectif: "Passer l'examen d'entrée de la Guilde.", scene: ch1-examen, lieu: guilde }
      - { id: crypte, objectif: "Explorer la Crypte de la Fontaine (Brumaire 1013).", scene: ch1-crypte, lieu: crypte-fontaine }
      - { id: lanternes, objectif: "Assister à la Fête des Lanternes (15 Floréal 1014).", scene: ch1-lanternes, lieu: lysmont-place }
      - { id: serment, objectif: "Répondre à la convocation du roi (Nivôse 1014).", scene: ch1-serment, lieu: chateau }
      - { id: fin, objectif: "Chapitre terminé." }
  - id: q-boutique
    titre: "Premiers pas au Comptoir"
    type: secondaire
    chapitre: 1
    resume: "Dame Halvine vous montre comment acheter et vendre dans sa boutique."
    etapes:
      - { id: acheter, objectif: "Acheter un objet utile au Comptoir de Halvine (une petite potion de soin, par exemple).", lieu: boutique, declencheur: { acheter: boutique } }
      - { id: vendre, objectif: "Vendre la breloque cabossée (onglet « Vendre » de la boutique).", lieu: boutique, declencheur: { vendre: true } }
      - { id: retour, objectif: "Retourner parler à Dame Halvine.", scene: sq-boutique-fin, lieu: boutique }
  - id: q-loups
    titre: "Les loups de la Combe-aux-Saules"
    type: secondaire
    chapitre: 1
    resume: "Gareth le fermier perd ses moutons, et sa fille n'ose plus sortir."
    etapes:
      - { id: contrat, objectif: "Prendre l'affaire auprès de Dame Rowena, à la Guilde.", scene: sq-loups-guilde, lieu: guilde }
      - { id: ferme, objectif: "Aller voir Gareth à la Combe-aux-Saules.", scene: sq-loups-ferme, lieu: combe-aux-saules }
      - { id: traces, objectif: "Suivre les traces à la lisière de la Combe.", scene: sq-loups-traces, lieu: combe-lisiere }
      - { id: taniere, objectif: "Trouver la meute au vieux saule creux.", scene: sq-loups, lieu: combe-taniere }
      - { id: retour, objectif: "Revenir à la Guilde raconter la fin de l'affaire.", scene: sq-loups-retour, lieu: guilde }
  - id: q-reliques
    titre: "Le marchand de reliques"
    type: secondaire
    chapitre: 1
    resume: "Au Chaudron Fêlé, un marchand vend des « os de saint » à prix d'or."
    etapes:
      - { id: enqueter, objectif: "Approcher Ferrand à la taverne.", scene: sq-reliques, lieu: taverne }
  - id: q-tanneurs
    titre: "Les disparus du quartier des Tanneurs"
    type: secondaire
    chapitre: 1
    resume: "Trois personnes ont disparu en un mois dans les ruelles des Tanneurs."
    etapes:
      - { id: enqueter, objectif: "Écouter les habitants du quartier des Tanneurs.", scene: sq-tanneurs-plainte, lieu: quartier-tanneurs }
      - { id: piste, objectif: "Chercher une piste près du puits des Tanneurs.", scene: sq-tanneurs-piste, lieu: quartier-tanneurs }
      - { id: cave, objectif: "Fouiller la tannerie abandonnée.", scene: sq-tanneurs, lieu: tannerie-abandonnee }
      - { id: retour, objectif: "Faire son rapport à Dame Rowena, à la Guilde.", scene: sq-tanneurs-retour, lieu: guilde }
  - id: q-apprenti
    titre: "L'apprenti de l'Ordre"
    type: secondaire
    chapitre: 1
    resume: "Sœur Elianne s'inquiète : son apprenti Tobin passe ses nuits dans les archives interdites."
    etapes:
      - { id: parler, objectif: "Parler à Sœur Elianne au Temple du Seuil.", scene: sq-apprenti, lieu: temple-du-seuil }
  - id: q-tournoi
    titre: "Le tournoi des écuyers"
    type: secondaire
    chapitre: 1
    resume: "Aveline arbitre le tournoi des écuyers ; il manque un participant… ou un adversaire."
    etapes:
      - { id: participer, objectif: "Se présenter à l'arène.", scene: sq-tournoi-inscription, lieu: arene }
      - { id: reperer, objectif: "Observer le mercenaire tricheur sur la place de Lysmont.", scene: sq-tournoi-reperage, lieu: lysmont-place }
      - { id: duel, objectif: "Retourner à l'arène pour le duel.", scene: sq-tournoi, lieu: arene }
  - id: q-aveline
    titre: "Le Serment brisé"
    type: compagnon
    chapitre: 1
    resume: "Le père d'Aveline a été exécuté pour trahison après la chute de Valgrane. Elle n'y a jamais cru."
    etapes:
      - { id: confidence, objectif: "Gagner la confiance d'Aveline (palier « Proche »)." }
      - { id: archives, objectif: "Trouver un moyen d'accéder aux archives militaires de Valgrane (suite au chapitre 2)." }
