classe:
  id: gardien
  nom: Gardien sacré
  role: Protection
  description: "Un rempart vivant, béni par la lumière."
  caracteristiques: { FOR: 11, AGI: 6, INT: 7, VIT: 15, ESP: 12, CHA: 9 }
  attaque: { stat: FOR, element: physique, portee: melee, puissance: 10 }
  rang_prefere: avant
  armure: 8
  passif:
    id: rempart
    nom: Rempart
    description: "30 % de chances d'intercepter une attaque visant un allié, en subissant 20 % de dégâts en moins."
    parametres: { chance: 0.3, reduction: 0.2 }
  competences: [provocation-sainte, bouclier-d-aube]
  branches:
    - id: bastion
      nom: Bastion
      description: "Défense pure."
      competences: [{ niveau: 5, competence: mur-de-foi }, { niveau: 12, competence: egide-sacree }, { niveau: 20, competence: citadelle-de-lumiere }]
    - id: croise
      nom: Croisé
      description: "Riposte et dégâts sacrés."
      competences: [{ niveau: 5, competence: jugement-sacre }, { niveau: 12, competence: marteau-de-l-aube }, { niveau: 20, competence: colere-divine }]
  ultime: { nom: "Bastion éternel", description: "Pendant 2 tours, aucun allié ne peut tomber sous 1 PV.", competence: bastion-eternel }
  point_fort: "Rend le groupe très solide ; seul, il gagne en tenant longtemps."
  point_faible: "Dégâts faibles, combats longs, peu mobile."
  competences_detail:
    - id: provocation-sainte
      nom: Provocation sainte
      description: "Une onde sacrée frappe tous les ennemis et les force à le cibler pendant 2 tours ; sa défense augmente."
      cout: 4
      recharge: 3
      cible: tous_ennemis
      effets:
        - { type: degats, puissance: 5, stat: FOR, element: sacre }
        - { type: etat, etat: provoque, duree: 2 }
        - { type: etat, etat: bonus_defense, duree: 2, valeur: 0.2, cible: soi }
      ia: { priorite: 3 }
    - id: bouclier-d-aube
      nom: Bouclier d'aube
      description: "Donne à un allié un bouclier qui absorbe 20 % de ses PV."
      cout: 5
      recharge: 1
      cible: allie
      effets: [{ type: bouclier, pourcent_pv: 0.2 }]
      ia: { priorite: 3, quand: allie_blesse }
    - id: mur-de-foi
      nom: Mur de foi
      description: "+30 % de défense pour tout le groupe pendant 2 tours."
      cout: 7
      recharge: 3
      cible: tous_allies
      effets: [{ type: etat, etat: bonus_defense, duree: 2, valeur: 0.3 }]
      ia: { priorite: 2 }
    - id: jugement-sacre
      nom: Jugement sacré
      description: "Un coup de masse chargé de lumière."
      cout: 6
      cible: ennemi
      portee: melee
      effets: [{ type: degats, puissance: 14, stat: FOR, element: sacre }]
      ia: { priorite: 2 }
    # ── Saison 1 : compétences de branche des niveaux 12 et 20, et l'ultime (débloqué par la quête de classe, niveau 30)
    - id: egide-sacree
      nom: Égide sacrée
      description: "Un bouclier de lumière sur tout le groupe."
      cout: 11
      recharge: 4
      cible: tous_allies
      effets: [{ type: bouclier, pourcent_pv: 0.15 }]
      ia: { priorite: 4, quand: allie_blesse }
    - id: citadelle-de-lumiere
      nom: Citadelle de lumière
      description: "Le Gardien attire tous les coups et protège le groupe."
      cout: 13
      recharge: 5
      cible: tous_allies
      effets:
        - { type: etat, etat: bonus_defense, duree: 3, valeur: 0.3 }
        - { type: etat, etat: regeneration, duree: 3, valeur: 0.04 }
      ia: { priorite: 4, quand: allie_blesse }
    - id: marteau-de-l-aube
      nom: Marteau de l'aube
      description: "Un coup sacré qui peut étourdir de peur."
      cout: 10
      recharge: 2
      cible: ennemi
      portee: melee
      effets:
        - { type: degats, puissance: 21, stat: FOR, element: sacre }
        - { type: etat, etat: peur, duree: 1, chance: 0.4 }
      ia: { priorite: 3 }
    - id: colere-divine
      nom: Colère divine
      description: "La lumière frappe tous les ennemis ; les démons et les morts-vivants la craignent."
      cout: 14
      recharge: 3
      cible: tous_ennemis
      effets: [{ type: degats, puissance: 18, stat: FOR, element: sacre }]
      ia: { priorite: 4, quand: plusieurs_ennemis }
    - id: bastion-eternel
      nom: "Ultime — Bastion éternel"
      description: "Pendant 2 tours, le groupe est presque intouchable : énorme bouclier, défense et régénération."
      cout: 20
      recharge: 7
      cible: tous_allies
      effets:
        - { type: bouclier, pourcent_pv: 0.35 }
        - { type: etat, etat: bonus_defense, duree: 2, valeur: 0.5 }
        - { type: etat, etat: regeneration, duree: 2, valeur: 0.06 }
      ia: { priorite: 6, quand: allie_blesse }
