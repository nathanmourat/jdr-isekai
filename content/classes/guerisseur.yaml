classe:
  id: guerisseur
  nom: Guérisseur
  role: Soin
  description: "La lumière qui ramène ses compagnons du bord du gouffre."
  caracteristiques: { FOR: 5, AGI: 8, INT: 11, VIT: 10, ESP: 15, CHA: 11 }
  attaque: { stat: ESP, element: sacre, portee: distance, puissance: 7 }
  rang_prefere: arriere
  armure: 3
  # Familles d'équipement que la classe utilise bien. Hors de cette liste : l'objet s'équipe, avec un malus.
  # `interdits` : familles que la classe ne peut pas porter du tout (rare).
  maitrises: { armes: [baton, sceptre], armures: [legere], interdits: [lourde] }
  passif:
    id: main-bienveillante
    nom: Main bienveillante
    description: "Les soins qui dépassent les PV max deviennent un bouclier (50 % du surplus)."
    parametres: { bouclier_surplus: 0.5 }
  competences: [lumiere-apaisante, purification]
  branches:
    - id: sanctuaire
      nom: Sanctuaire
      description: "Soins de groupe."
      competences: [{ niveau: 5, competence: priere-de-groupe }, { niveau: 12, competence: cercle-de-vie }, { niveau: 20, competence: benediction-de-l-aube }]
    - id: jugement
      nom: Jugement
      description: "Dégâts sacrés, soin en frappant."
      competences: [{ niveau: 5, competence: chatiment }, { niveau: 12, competence: lance-de-lumiere }, { niveau: 20, competence: aube-vengeresse }]
  ultime: { nom: "Second Souffle", description: "Relève tous les alliés K.O. à 40 % de leurs PV.", competence: second-souffle }
  point_fort: "Rend le groupe presque increvable."
  point_faible: "Dégâts très faibles ; seul, il gagne en tenant, pas en tuant."
  competences_detail:
    - id: lumiere-apaisante
      nom: Lumière apaisante
      description: "Soigne un allié."
      cout: 5
      cible: allie
      effets: [{ type: soin, puissance: 11, stat: ESP }]
      ia: { priorite: 4, quand: allie_blesse }
    - id: purification
      nom: Purification
      description: "Retire les effets négatifs du groupe et le soigne un peu."
      cout: 6
      recharge: 2
      cible: tous_allies
      effets:
        - { type: purifier }
        - { type: soin, puissance: 5, stat: ESP }
      ia: { priorite: 2, quand: allie_blesse }
    - id: priere-de-groupe
      nom: Prière de groupe
      description: "Soigne tout le groupe."
      cout: 9
      recharge: 2
      cible: tous_allies
      effets: [{ type: soin, puissance: 11, stat: ESP }]
      ia: { priorite: 3, quand: allie_blesse }
    - id: chatiment
      nom: Châtiment
      description: "Dégâts sacrés ; le guérisseur récupère des PV."
      cout: 6
      cible: ennemi
      effets:
        - { type: degats, puissance: 13, stat: ESP, element: sacre }
        - { type: soin, puissance: 6, stat: ESP, cible: soi }
      ia: { priorite: 2 }
    # ── Saison 1 : compétences de branche des niveaux 12 et 20, et l'ultime (débloqué par la quête de classe, niveau 30)
    - id: cercle-de-vie
      nom: Cercle de vie
      description: "Un cercle de lumière qui soigne tout le groupe chaque tour."
      cout: 11
      recharge: 4
      cible: tous_allies
      effets:
        - { type: soin, puissance: 9, stat: ESP }
        - { type: etat, etat: regeneration, duree: 3, valeur: 0.05 }
      ia: { priorite: 4, quand: allie_blesse }
    - id: benediction-de-l-aube
      nom: Bénédiction de l'aube
      description: "Purifie tout le groupe et le protège."
      cout: 13
      recharge: 4
      cible: tous_allies
      effets:
        - { type: purifier }
        - { type: soin, puissance: 14, stat: ESP }
        - { type: bouclier, pourcent_pv: 0.1 }
      ia: { priorite: 5, quand: allie_blesse }
    - id: lance-de-lumiere
      nom: Lance de lumière
      description: "Une lance sacrée transperce la cible."
      cout: 10
      recharge: 2
      cible: ennemi
      effets:
        - { type: degats, puissance: 21, stat: ESP, element: sacre }
        - { type: etat, etat: expose, duree: 2, valeur: 0.15 }
      ia: { priorite: 3 }
    - id: aube-vengeresse
      nom: Aube vengeresse
      description: "La lumière brûle tous les ennemis et soigne le Guérisseur."
      cout: 14
      recharge: 3
      cible: tous_ennemis
      effets:
        - { type: degats, puissance: 16, stat: ESP, element: sacre }
        - { type: soin, puissance: 10, stat: ESP, cible: soi }
      ia: { priorite: 4, quand: plusieurs_ennemis }
    - id: second-souffle
      nom: "Ultime — Second Souffle"
      description: "Relève tous les alliés K.O. à 40 % de leurs PV et soigne tout le groupe."
      cout: 22
      recharge: 8
      cible: tous_allies
      effets:
        - { type: relever, pourcent_pv: 0.4, cible: tous_allies }
        - { type: soin, puissance: 18, stat: ESP }
      ia: { priorite: 7, quand: allie_ko }
