# ─────────────────────────────────────────────────────────────
#  Réglages de la campagne — modifiables sans toucher au code.
#  Après une modification : lancer `npm test` pour vérifier.
# ─────────────────────────────────────────────────────────────

config:
  saison_actuelle: 1
  # Romance entre adultes (version web). La version Roblox (tout public) l'exporte à false.
  romance: true

  saisons:
    - numero: 1
      titre: "Saison 1 — Le Souverain des Cendres"
      annee_debut: 1012          # an 0 de la campagne (printemps 1012 AV)
      annees_par_chapitre: 3
      chapitres: 6
      sessions_par_chapitre: 3   # environ 2 h chacune
      niveau_max: 40
      niveau_ultime: 30          # niveau requis (en plus de la quête de classe) pour l'ultime

  calendrier:
    jours_par_mois: 30
    mois:                        # 12 mois, 3 par saison
      - { nom: Germinal,  saison: printemps }
      - { nom: Floréal,   saison: printemps }
      - { nom: Pluvial,   saison: printemps }
      - { nom: Solaire,   saison: été }
      - { nom: Moisson,   saison: été }
      - { nom: Ardent,    saison: été }
      - { nom: Brumaire,  saison: automne }
      - { nom: Cendral,   saison: automne }
      - { nom: Givral,    saison: automne }
      - { nom: Nivôse,    saison: hiver }
      - { nom: Nuitlongue, saison: hiver }
      - { nom: Aurore,    saison: hiver }
    fetes:
      - { nom: "Fête des Lanternes",   mois: 2,  jour: 15 }
      - { nom: "Tournoi de la Couronne", mois: 4, jour: 10 }
      - { nom: "Grand Bazar de Qarzim", mois: 7,  jour: 1 }
      - { nom: "Nuitlongue",           mois: 11, jour: 30 }

  ellipses:
    entre_quetes_mois: [1, 4]     # durée typique d'une ellipse entre deux quêtes
    activites_temps_libre: 2      # nombre d'activités par joueur et par ellipse
    duree_reference_mois: 6       # les gains de temps libre sont donnés pour 6 mois
    # Les mois ne passent que si les joueurs le décident, en dormant à l'auberge (le Chaudron Fêlé).
    durees_auberge_mois: [1, 3, 6]  # durées proposées quand on clique sur le lit

  # Les jours avancent tout seuls pendant qu'on joue (jamais les mois : le minuteur s'arrête au dernier jour du mois).
  jours_temps_reel:
    minutes_par_jour: 10          # 1 jour du monde toutes les 10 minutes de jeu actif
    inactivite_minutes: 10        # sans action depuis ce délai, le temps ne passe plus

  personnage:
    total_caracteristiques: 60
    carac_min: 3
    carac_max: 17
    points_carac_par_niveau: 3
    age_invoque_min: 18
    age_invoque_max: 35
    annee_naissance_reincarne: 994
    niveau_branche: 5             # niveau où l'on choisit sa première compétence de branche
    rang_competence_max: 5        # chaque point de compétence : +10 % de puissance
    variantes_max: 2              # variantes (fusions comprises) par compétence ; une seule active à la fois
    competences_equipees_max: 6   # compétences utilisables en combat
    fusion_rang_min: 2            # rang requis dans les deux compétences pour les fusionner

  # XP pour passer du niveau n à n+1 = base × n^exposant
  experience:
    base: 100
    exposant: 1.5

  affinite:
    paliers:
      - { id: inconnue,  nom: "Inconnue",  seuil: 0 }
      - { id: alliee,    nom: "Alliée",    seuil: 20 }
      - { id: proche,    nom: "Proche",    seuil: 45 }
      - { id: amoureuse, nom: "Amoureuse", seuil: 70 }
      - { id: engagee,   nom: "Engagée",   seuil: 90 }
    cadeau: { prefere: 5, apprecie: 2, neutre: 0, deteste: -3 }
    jours_entre_cadeaux: 7

  reputation:
    paliers:
      - { nom: "Hostile", seuil: -100 }
      - { nom: "Méfiant", seuil: -40 }
      - { nom: "Neutre",  seuil: -10 }
      - { nom: "Ami",     seuil: 15 }
      - { nom: "Allié",   seuil: 45 }
      - { nom: "Honoré",  seuil: 80 }

  # Rangs de Guilde : les points ne font que DÉBLOQUER l'examen ; il faut aussi le niveau minimum.
  # examen « combat » : un combat contre un examinateur (sans danger : ni blessure ni or perdu, on retente le lendemain).
  # examen « epreuve » : un contrat en plusieurs étapes qui se termine par un combat.
  # examen « scene » : une scène de l'histoire donne le rang (effet rang_guilde) ; le rang S s'obtient au chapitre 5.
  # Sans « examen » : le rang n'est pas encore accessible (il arrivera avec un prochain chapitre).
  guilde:
    examinatrice: rowena
    rangs:
      - { rang: F, points: 0 }
      - { rang: E, points: 100, niveau_min: 3, examen: { type: combat, rencontre: examen-rang-e } }
      - { rang: D, points: 300, niveau_min: 6, examen: { type: combat, rencontre: examen-rang-d } }
      - { rang: C, points: 700, niveau_min: 10, examen: { type: epreuve, contrat: c-examen-c } }
      - { rang: B, points: 1500, niveau_min: 15, examen: { type: epreuve, contrat: c-examen-b } }
      - { rang: A, points: 3000, niveau_min: 22, examen: { type: combat, rencontre: examen-rang-a } }
      - { rang: S, points: 6000, niveau_min: 30, examen: { type: scene, scene: ch5-rang-s } }

  # Difficulté selon la puissance du groupe P = héros + 0,5 × compagnons présents.
  # Interpolation linéaire entre deux colonnes pour un P non entier.
  difficulte:
    - { puissance: 1, pv: 1.0, degats: 1.00, ennemis_en_plus: 0 }
    - { puissance: 2, pv: 2.7, degats: 1.35, ennemis_en_plus: 0 }
    - { puissance: 3, pv: 4.3, degats: 1.45, ennemis_en_plus: 1 }
    - { puissance: 4, pv: 6.0, degats: 1.70, ennemis_en_plus: 1 }
    - { puissance: 5, pv: 8.0, degats: 1.90, ennemis_en_plus: 2 }
    - { puissance: 6, pv: 10.0, degats: 2.10, ennemis_en_plus: 2 }

  combat:
    minuteur_tour_secondes: 60
    regen_mana_base: 2
    defense_par_vit: 2
    resistance_par_esp: 2
    toucher_base: 0.85
    toucher_par_agi: 0.02
    toucher_min: 0.5
    toucher_max: 0.95
    critique_base: 0.05
    critique_par_agi: 0.005
    multiplicateur_critique: 1.5
    variance_degats: 0.1
    potions_depart: 2
    # « Plus c'est puissant, moins c'est sûr » (voir CONCEPTION § 3.3)
    # (règle des héros et de leurs alliés ; les ennemis gardent la formule de base)
    toucher_bonus_attaque_base: 0.02   # une attaque de base est fiable : +2 points
    toucher_mana_gratuit: 5            # les 5 premiers points de mana d'une compétence ne coûtent rien en précision…
    toucher_malus_par_mana: 0.01       # …ensuite, 1 point de chance de toucher en moins par point de mana…
    toucher_malus_max: 0.05            # …dans la limite de 5 points
    toucher_par_niveau: 0.005          # +0,5 point par niveau d'avance sur la cible (et −0,5 par niveau de retard), 10 niveaux au plus

  # Maîtrise d'une compétence : rang 0 à 5. Elle monte en utilisant la compétence en combat (1 point par utilisation)
  # et avec l'activité « Entraînement » à l'auberge. Bonus modestes et plafonnés.
  maitrise:
    seuils: [5, 15, 30, 50, 80]        # points nécessaires pour les rangs 1 à 5
    degats_par_rang: 0.02              # +2 % de dégâts et de soins par rang (+10 % au rang 5)
    toucher_par_rang: 0.01             # +1 point de chance de toucher par rang (+5 au rang 5)

  mort_douce:
    perte_or_pourcent: 10
    blessure_pv_pourcent: 10
  # PV gardés d'un combat à l'autre (après le test 3) et façons de les récupérer
  soins:
    regen_jour_pourcent: 10        # chaque jour qui passe rend 10 % des PV max
    pv_apres_ko_pourcent: 20       # un héros K.O. se relève avec 20 % de ses PV
    repas: { prix: 3, pourcent: 30 }   # repas chaud dans une auberge
    ration_pourcent: 15            # manger une ration de voyage hors combat
    temple: { prix: 15 }           # soins des prêtres : tous les PV et la blessure
    # le lit de l'auberge (et le temps libre) rend tous les PV ; une potion hors combat rend puissance/64 des PV max

  graphismes:
    taille_tuile: 32
    taille_sprite_combat: 64
    taille_sprite_boss: 128
    taille_sprite_exploration: 32
    echelle_pixel_art: 2      # agrandissement des tuiles et sprites d'exploration
    echelle_combat: 3         # agrandissement des sprites de combat
