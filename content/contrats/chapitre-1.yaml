  - { id: c-gobelins, titre: "Gobelins sur la route du nord", description: "Des gobelins cendrés attaquent les charrettes.", rang_min: F, rencontre: gobelins-route, duree_jours: 4, recompenses: { or: 40, xp: 60, points_guilde: 25 } }
  - { id: c-negociation, titre: "Médiation au marché", description: "Calmer une dispute entre deux marchands (test de Charisme).", rang_min: E, test: { carac: CHA, difficulte: 19 }, duree_jours: 1, recompenses: { or: 50, xp: 35, points_guilde: 25 } }
