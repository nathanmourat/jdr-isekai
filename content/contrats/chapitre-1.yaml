# Contrats de guilde : missions courtes et répétables, jouables en solo et en asynchrone.
contrats:
  - { id: c-loups, titre: "Chasse aux loups", description: "Des loups rôdent près des bergeries de la Combe.", rang_min: F, rencontre: loups-combe, duree_jours: 3, recompenses: { or: 30, xp: 45, points_guilde: 20 } }
