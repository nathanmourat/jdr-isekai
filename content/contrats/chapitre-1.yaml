  - { id: c-araignees, titre: "Le nid sous la crypte", description: "Nettoyer un nid d'araignées géantes.", rang_min: D, rencontre: crypte-araignees, duree_jours: 3, recompenses: { or: 80, xp: 110, points_guilde: 45 } }
