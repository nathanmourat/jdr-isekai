# Ennemis du chapitre 3 (Sylvenoire, niveaux 15 à 22).
# Fichier généré par scripts/contenu/bestiaire.py à partir de scripts/contenu/ch3_ennemis.py : modifier la source, puis relancer.
ennemis:
  - id: feu-follet-sauvage
    nom: "Feu follet"
    description: "Un esprit de lumière bleue, sans corps. Il attire les voyageurs loin des sentiers."
    niveau: 15
    categorie: esprit
    sprite: feu-follet
    rang: arriere
    caracteristiques: { FOR: 9, AGI: 12, INT: 18, VIT: 14, ESP: 9, CHA: 4 }
    pv: 132
    armure: 6
    attaque: { stat: INT, element: arcane, portee: distance, puissance: 10 }
    attaques:
      - { nom: "Lueur brûlante", phrase: "frôle {cible} d'une lueur glacée", effet: rune }
      - { nom: "Éclat", phrase: "éclate au visage de {cible}", effet: rune }
    resistances: { physique: 0.3, arcane: 0.5, ombre: -0.3 }
    competences:
      - id: lueur-trompeuse
        nom: Lueur trompeuse
        description: "Une lumière qui égare."
        recharge: 3
        cible: ennemi
        effets: [{ type: etat, etat: affaibli, duree: 2, valeur: 0.2, chance: 0.6 }]
        ia: { priorite: 3 }
    recompenses: { xp: 203, or: 15 }

