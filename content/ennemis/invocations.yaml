# Créatures invoquées par les héros. Leur puissance augmente avec le niveau de l'invocateur.
ennemis:
  - id: loup-spectral
    nom: Loup spectral
    niveau: 1
    categorie: esprit
    invocation: true
    caracteristiques: { FOR: 8, AGI: 11, INT: 3, VIT: 6, ESP: 5, CHA: 3 }
    pv: 18
    armure: 1
    attaque: { stat: FOR, element: arcane, portee: melee, puissance: 4 }
    # Attaques de base nommées : même puissance que « attaque », avec un nom, une phrase ({cible} = la cible) et un effet visuel.
    attaques:
      - { nom: "Morsure spectrale", phrase: "traverse {cible} d'une morsure glacée", effet: rune }
      - { nom: "Griffes d'éther", phrase: "lacère {cible} de ses griffes translucides", effet: rune }
    recompenses: { xp: 0 }
  - id: golem-de-pierre
    nom: Golem de pierre
    niveau: 1
    categorie: construction
    invocation: true
    caracteristiques: { FOR: 9, AGI: 3, INT: 3, VIT: 14, ESP: 4, CHA: 3 }
    pv: 34
    armure: 8
    attaque: { stat: FOR, portee: melee, puissance: 6 }
    # Attaques de base nommées : même puissance que « attaque », avec un nom, une phrase ({cible} = la cible) et un effet visuel.
    attaques:
      - { nom: "Poing de pierre", phrase: "écrase son poing sur {cible}", effet: impact }
      - { nom: "Bousculade", phrase: "bouscule {cible} de tout son poids", effet: impact }
    competences:
      - id: grondement
        nom: Grondement
        description: "Provoque tous les ennemis."
        recharge: 3
        cible: tous_ennemis
        effets: [{ type: etat, etat: provoque, duree: 2 }]
        ia: { priorite: 5 }
    recompenses: { xp: 0 }
  - id: feu-follet
    nom: Feu follet
    niveau: 1
    categorie: esprit
    invocation: true
    caracteristiques: { FOR: 3, AGI: 12, INT: 9, VIT: 3, ESP: 5, CHA: 3 }
    pv: 14
    attaque: { stat: INT, element: feu, portee: distance, puissance: 6 }
    # Attaques de base nommées : même puissance que « attaque », avec un nom, une phrase ({cible} = la cible) et un effet visuel.
    attaques:
      - { nom: "Flammèche", phrase: "crache une flammèche sur {cible}", effet: feu }
      - { nom: "Étincelles", phrase: "crible {cible} d'étincelles", effet: feu }
    rang: arriere
    recompenses: { xp: 0 }
  - id: colosse
    nom: Colosse de pierre
    niveau: 1
    categorie: construction
    invocation: true
    caracteristiques: { FOR: 13, AGI: 4, INT: 3, VIT: 14, ESP: 4, CHA: 3 }
    pv: 60
    armure: 10
    attaque: { stat: FOR, portee: melee, puissance: 10 }
    # Attaques de base nommées : même puissance que « attaque », avec un nom, une phrase ({cible} = la cible) et un effet visuel.
    attaques:
      - { nom: "Poing du colosse", phrase: "abat un poing énorme sur {cible}", effet: impact }
      - { nom: "Écrasement", phrase: "tente d'écraser {cible} sous son pied", effet: impact }
    competences:
      - id: grondement-colosse
        nom: Grondement
        description: "Provoque tous les ennemis."
        recharge: 3
        cible: tous_ennemis
        effets: [{ type: etat, etat: provoque, duree: 2 }]
        ia: { priorite: 5 }
    recompenses: { xp: 0 }
  - id: tourelle
    nom: Tourelle mécanique
    niveau: 1
    categorie: construction
    invocation: true
    caracteristiques: { FOR: 3, AGI: 10, INT: 10, VIT: 8, ESP: 3, CHA: 3 }
    pv: 18
    armure: 4
    rang: arriere
    attaque: { stat: INT, portee: distance, puissance: 5 }
    # Attaques de base nommées : même puissance que « attaque », avec un nom, une phrase ({cible} = la cible) et un effet visuel.
    attaques:
      - { nom: "Carreau", phrase: "tire un carreau sur {cible}", effet: impact }
      - { nom: "Rafale de billes", phrase: "crible {cible} de billes d'acier", effet: impact }
    recompenses: { xp: 0 }
  # Ultime de l'Invocateur (Porte du Bestiaire) : invoqué au niveau 30 ou plus, donc déjà puissant.
  - id: wyrm-ancestral
    nom: Wyrm ancestral
    niveau: 1
    categorie: bete
    invocation: true
    sprite: wyrmling
    caracteristiques: { FOR: 16, AGI: 10, INT: 12, VIT: 14, ESP: 8, CHA: 6 }
    pv: 90
    armure: 8
    attaque: { stat: FOR, element: feu, portee: melee, puissance: 12 }
    attaques:
      - { nom: "Crocs de braise", phrase: "referme ses crocs brûlants sur {cible}", effet: feu }
      - { nom: "Coup de queue", phrase: "balaie {cible} d'un coup de queue écailleuse", effet: impact }
    competences:
      - id: souffle-ancestral
        nom: Souffle ancestral
        description: "Un torrent de flammes sur tous les ennemis."
        recharge: 2
        cible: tous_ennemis
        effets: [{ type: degats, puissance: 16, stat: INT, element: feu }]
        ia: { priorite: 5 }
    recompenses: { xp: 0 }
