# Ennemis de référence, utilisés UNIQUEMENT par la simulation d'équilibrage (niveau 1).
ennemis:
  - id: ref-brute
    nom: Brute de référence
    niveau: 1
    categorie: humanoide
    caracteristiques: { FOR: 12, AGI: 6, INT: 4, VIT: 12, ESP: 5, CHA: 4 }
    pv: 135
    armure: 6
    attaque: { stat: FOR, portee: melee, puissance: 11 }
    # Attaques de base nommées : même puissance que « attaque », avec un nom, une phrase ({cible} = la cible) et un effet visuel.
    attaques:
      - { nom: "Coup de massue", phrase: "abat sa massue sur {cible}", effet: impact }
      - { nom: "Coup de poing", phrase: "envoie son poing dans les côtes de {cible}", effet: impact }
    competences:
      - id: ref-coup-ecrasant
        nom: Coup écrasant
        description: "Un coup lourd."
        recharge: 2
        cible: ennemi
        portee: melee
        effets: [{ type: degats, puissance: 17, stat: FOR }]
        ia: { priorite: 2 }
    recompenses: { xp: 30, or: 10 }
  - id: ref-rapide
    nom: Rapide de référence
    niveau: 1
    categorie: bete
    caracteristiques: { FOR: 9, AGI: 15, INT: 4, VIT: 8, ESP: 5, CHA: 4 }
    pv: 95
    armure: 2
    attaque: { stat: AGI, portee: melee, puissance: 10 }
    # Attaques de base nommées : même puissance que « attaque », avec un nom, une phrase ({cible} = la cible) et un effet visuel.
    attaques:
      - { nom: "Morsure éclair", phrase: "mord {cible} avant qu'on l'ait vu bouger", effet: entaille }
      - { nom: "Coup de griffes", phrase: "griffe {cible} en passant", effet: entaille }
    competences:
      - id: ref-double-morsure
        nom: Double morsure
        description: "Deux morsures rapides."
        recharge: 2
        cible: ennemi
        portee: melee
        effets: [{ type: degats, puissance: 8, stat: AGI, coups: 2 }]
        ia: { priorite: 2 }
    recompenses: { xp: 30, or: 5 }
  - id: ref-mage
    nom: Mage de référence
    niveau: 1
    categorie: humanoide
    caracteristiques: { FOR: 4, AGI: 9, INT: 13, VIT: 7, ESP: 12, CHA: 5 }
    pv: 85
    armure: 1
    rang: arriere
    attaque: { stat: INT, element: arcane, portee: distance, puissance: 10 }
    # Attaques de base nommées : même puissance que « attaque », avec un nom, une phrase ({cible} = la cible) et un effet visuel.
    attaques:
      - { nom: "Trait arcanique", phrase: "lance un trait d'énergie sur {cible}", effet: rune }
      - { nom: "Éclat de runes", phrase: "fait éclater une rune devant {cible}", effet: rune }
    competences:
      - id: ref-boule-de-feu
        nom: Boule de feu
        description: "Une boule de feu."
        recharge: 2
        cible: ennemi
        effets:
          - { type: degats, puissance: 16, stat: INT, element: feu }
          - { type: etat, etat: brulure, duree: 2, valeur: 3, chance: 0.5 }
        ia: { priorite: 2 }
    recompenses: { xp: 30, or: 15 }
  - id: ref-faible
    nom: Sbire de référence
    niveau: 1
    categorie: humanoide
    caracteristiques: { FOR: 8, AGI: 9, INT: 4, VIT: 6, ESP: 4, CHA: 4 }
    pv: 42
    armure: 1
    attaque: { stat: FOR, portee: melee, puissance: 8 }
    # Attaques de base nommées : même puissance que « attaque », avec un nom, une phrase ({cible} = la cible) et un effet visuel.
    attaques:
      - { nom: "Coup de bâton", phrase: "frappe {cible} de son bâton", effet: impact }
      - { nom: "Coup de pied", phrase: "donne un coup de pied à {cible}", effet: impact }
    recompenses: { xp: 10, or: 3 }
  - id: ref-chef
    nom: Chef de référence (mini-boss)
    niveau: 2
    categorie: humanoide
    boss: true
    caracteristiques: { FOR: 13, AGI: 8, INT: 6, VIT: 13, ESP: 8, CHA: 6 }
    pv: 210
    armure: 7
    attaque: { stat: FOR, portee: melee, puissance: 11 }
    # Attaques de base nommées : même puissance que « attaque », avec un nom, une phrase ({cible} = la cible) et un effet visuel.
    attaques:
      - { nom: "Coup de hache", phrase: "abat sa hache sur {cible}", effet: entaille }
      - { nom: "Coup de pommeau", phrase: "frappe {cible} du pommeau de son arme", effet: impact }
      - { nom: "Coup de botte", phrase: "repousse {cible} d'un coup de botte", effet: impact }
    competences:
      - id: ref-balayage
        nom: Balayage
        description: "Frappe tous les adversaires."
        recharge: 3
        cible: tous_ennemis
        portee: melee
        effets: [{ type: degats, puissance: 11, stat: FOR }]
        ia: { priorite: 3 }
      - id: ref-cri-de-guerre
        nom: Cri de guerre
        description: "Augmente ses dégâts."
        recharge: 4
        cible: soi
        effets: [{ type: etat, etat: bonus_degats, duree: 2, valeur: 0.25 }]
        ia: { priorite: 2, quand: debut_combat }
    recompenses: { xp: 80, or: 40 }

rencontres:
  - { id: ref-brute, nom: "Référence : brute", ennemis: [{ id: ref-brute }], renforts: [ref-faible] }
  - { id: ref-rapide, nom: "Référence : rapide", ennemis: [{ id: ref-rapide }], renforts: [ref-faible] }
  - { id: ref-mage, nom: "Référence : mage", ennemis: [{ id: ref-mage }], renforts: [ref-faible] }
  - { id: ref-meute, nom: "Référence : groupe de faibles", ennemis: [{ id: ref-faible }, { id: ref-faible }, { id: ref-faible }], renforts: [ref-faible] }
  - { id: ref-chef, nom: "Référence : mini-boss", ennemis: [{ id: ref-chef }], renforts: [ref-faible] }
