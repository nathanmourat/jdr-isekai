# Phrases d'ambiance dites par les passants (version Roblox : bulles au-dessus des têtes).
# lieu : près de quel lieu on l'entend (absent = partout en ville) · moment : jour, nuit ou toujours
# qui : villageois, garde, marchand, client, pretre · si : condition (même format que les scènes)
# Version tout public : pas de romance ici (vérifié par npm run roblox:contenu).
ambiance:
  # ─── En ville, partout
  - { id: v-temps, texte: "Belle journée pour la saison, pas vrai ?", moment: jour }
  - { id: v-pain, texte: "Le pain a encore augmenté. Deux sous de plus, cette semaine.", moment: jour }
  - { id: v-appeles, texte: "Ce sont eux, les Appelés ? Ils ont l'air… normaux.", si: { flag: appel-fait } }
  - { id: v-appeles-2, texte: "On dit que l'Ordre les a fait venir d'un autre monde. Brr.", si: { flag: appel-fait } }
  - { id: v-avant-appel, texte: "Il paraît que le Temple prépare une grande cérémonie.", si: { pas_flag: appel-fait } }
  - { id: v-guilde, texte: "La Guilde recrute. Faut juste survivre à l'examen…", si: { pas_flag: examen-reussi } }
  - { id: v-guilde-ok, texte: "Les nouveaux de la Guilde ont battu le golem d'entraînement, il paraît !", si: { flag: examen-reussi } }
  - { id: v-crypte, texte: "Personne ne descend dans la Crypte de la Fontaine. Personne de sensé, en tout cas.", si: { pas_flag: sceau-trouve } }
  - { id: v-crypte-ok, texte: "Ils sont revenus de la crypte avec un sceau tout noir. Ça ne me dit rien qui vaille.", si: { flag: sceau-trouve } }
  - { id: v-lanternes, texte: "Vivement la Fête des Lanternes !", si: { pas_flag: lanternes-faites } }
  - { id: v-vorthak, texte: "Un démon, en pleine fête… J'en fais encore des cauchemars.", si: { flag: lanternes-faites } }
  - { id: v-nuit-1, texte: "Rentrez vite, la nuit tombe.", moment: nuit }
  - { id: v-nuit-2, texte: "*bâille* Encore une longue journée demain.", moment: nuit }
  # ─── Gardes
  - { id: g-ronde, qui: garde, texte: "Circulez. Rien à voir." }
  - { id: g-ordre, qui: garde, texte: "Ordre du roi : pas d'armes dégainées dans les rues." }
  - { id: g-nuit, qui: garde, moment: nuit, texte: "Restez dans la lumière des lanternes, la nuit." }
  - { id: g-cultistes, qui: garde, texte: "On a doublé les rondes depuis l'attaque des cultistes.", si: { flag: lanternes-faites } }
  - { id: g-serment, qui: garde, texte: "Le roi compte sur vous. Faites honneur à la couronne.", si: { flag: serment-couronne } }
  # ─── Marché de la place
  - { id: m-pommes, lieu: lysmont-place, qui: marchand, moment: jour, texte: "Pommes de la Combe ! Croquantes et sucrées !" }
  - { id: m-tissu, lieu: lysmont-place, qui: marchand, moment: jour, texte: "Tissus de Valgrane, la plus belle laine du royaume !" }
  - { id: m-epices, lieu: lysmont-place, qui: marchand, moment: jour, texte: "Épices du Sud, rapportées par la dernière caravane !" }
  - { id: m-potions, lieu: lysmont-place, qui: marchand, moment: jour, texte: "Une potion de soin, aventurier ? Ça peut sauver une vie !" }
  # ─── Lieux
  - { id: t-prieres, lieu: temple-du-seuil, qui: pretre, texte: "Que la Lumière Sereine guide vos pas." }
  - { id: t-silence, lieu: temple-du-seuil, qui: pretre, texte: "Silence, s'il vous plaît. C'est l'heure de la méditation." }
  - { id: gu-contrat, lieu: guilde, qui: client, texte: "Qui veut un contrat facile ? Des rats dans ma cave, rien de bien méchant…", si: { flag: examen-reussi } }
  - { id: gu-rang, lieu: guilde, qui: client, texte: "Rang C à vingt ans ! Moi, à vingt ans, je trayais des chèvres." }
  - { id: ta-chope, lieu: taverne, qui: client, texte: "Bram ! Une autre chope !" }
  - { id: ta-reliques, lieu: taverne, qui: client, texte: "Le marchand d'os de saint ? Arnaque, je vous dis.", si: { pas_flag: ferrand-demasque } }
  - { id: ta-ferrand, lieu: taverne, qui: client, texte: "Bien fait pour Ferrand. Vendre des os de poulet comme reliques…", si: { flag: ferrand-demasque } }
  - { id: ta-chanson, lieu: taverne, qui: client, moment: nuit, texte: "🎵 Au bord de la Fontaine, j'ai perdu ma chopine… 🎵" }
  - { id: co-loups, lieu: combe-aux-saules, texte: "Encore des loups cette nuit… Gareth a perdu trois moutons.", si: { pas_flag: loups-sauves } }
  - { id: co-loups-ok, lieu: combe-aux-saules, texte: "Plus un hurlement depuis que les aventuriers sont passés. Merci à eux !", si: { flag: loups-sauves } }
  - { id: tn-disparus, lieu: quartier-tanneurs, texte: "Encore quelqu'un a disparu dans les ruelles. On n'ose plus sortir le soir.", si: { pas_flag: lina-sauvee } }
  - { id: tn-lina, lieu: quartier-tanneurs, texte: "La petite Lina est rentrée saine et sauve. Quel soulagement !", si: { flag: lina-sauvee } }
  - { id: ar-tournoi, lieu: arene, texte: "Le tournoi des écuyers, ça, c'est du spectacle !" }
  - { id: ch-cour, lieu: chateau, qui: garde, texte: "La cour reçoit sur rendez-vous. Ou sur convocation du roi." }
  # ─── Marche des Sables (Qarzim)
  - { id: q-chaleur, lieu: qarzim-porte, texte: "Quelle chaleur… Même les chameaux se plaignent.", moment: jour, si: { flag: sables-ouverts } }
  - { id: q-cristaux, lieu: qarzim-bazar, qui: marchand, texte: "Cristaux d'éther ! Contre la fatigue, contre la tristesse, contre tout !", si: { flag: sables-ouverts } }
  - { id: q-concorde, lieu: qarzim-bazar, texte: "La Concorde fixe les prix, et nous, on paie.", si: { flag: sables-ouverts } }
  - { id: q-lunecroc, lieu: qarzim-porte, texte: "Les Lunecroc ont perdu leurs terres pour les mines. Pauvres gens.", si: { flag: sables-ouverts, pas_flag: mines-lunecroc } }
  - { id: q-lunecroc-ok, lieu: qarzim-porte, texte: "Les loups du désert ont repris une part des mines ! On n'avait jamais vu ça.", si: { flag: mines-lunecroc } }
  - { id: q-princesse, lieu: qarzim-residence, qui: garde, texte: "La princesse est sous bonne garde. On ne la touchera pas deux fois.", si: { flag: vashti-denoncee } }
  - { id: q-banquet, lieu: qarzim-residence, texte: "Un banquet à la Résidence d'Aubeclaire, en Ardent ! Tout le monde y sera.", si: { flag: sables-ouverts, quete_etape: { q-ch2-routes: complot } } }
  - { id: q-ruines, lieu: qarzim-oasis, qui: client, texte: "On dit que les Appelés sont revenus vivants des Ruines de Sel. Personne ne revient des Ruines.", si: { flag: ruines-explorees } }
  - { id: q-oasis, lieu: qarzim-oasis, qui: client, texte: "L'eau de l'Oasis Bleue est revenue. Mère Ziyane offre la tournée !", si: { flag: eau-rendue } }
  - { id: q-nuit, lieu: qarzim-porte, texte: "La nuit, le désert est froid comme une tombe. Gardez une couverture.", moment: nuit, si: { flag: sables-ouverts } }
  # ─── Sylvenoire (Ithrael)
  - { id: s-humains, lieu: ithrael-racines, texte: "Des humains, à Ithrael… La Reine devient bien patiente.", si: { flag: sylvenoire-ouverte, pas_flag: elfes-allies } }
  - { id: s-heros, lieu: ithrael-racines, texte: "Ce sont eux qui ont défendu la Clairière pendant la Nuitlongue.", si: { flag: elfes-allies } }
  - { id: s-marche, lieu: ithrael-marche, qui: marchand, texte: "Une graine contre une chanson ! Une bonne chanson, hein.", si: { flag: sylvenoire-ouverte } }
  - { id: s-ilysse, lieu: ithrael-cour, texte: "Ilyssë Vaëlnor est revenue… On dit que la Reine lui a pardonné.", si: { flag: ilysse-recrutee } }
  - { id: s-follets, lieu: ithrael-auberge, qui: client, texte: "Ne suivez jamais les lumières bleues. Jamais.", si: { flag: sylvenoire-ouverte } }
  - { id: s-legion, lieu: ithrael-racines, qui: garde, texte: "La Légion rôde sous les arbres. Gardez votre arc à portée de main.", si: { flag: sylvenoire-ouverte, pas_flag: elfes-allies } }
  - { id: s-nuit, lieu: ithrael-auberge, texte: "La nuit, les arbres chantent. Écoutez bien.", moment: nuit, si: { flag: sylvenoire-ouverte } }
  # ─── Monts Grisfer (Karak-Dûm)
  - { id: g-humains, lieu: karak-porte, qui: garde, texte: "Des humains à Karak-Dûm. Qu'ils essuient leurs bottes.", si: { flag: ch4-depart-fait, pas_flag: nains-allies } }
  - { id: g-marches, lieu: karak-porte, qui: garde, texte: "Ce sont eux qui sont descendus jusqu'au fond des Mille Marches. Respect.", si: { flag: nains-allies } }
  - { id: g-forge, lieu: karak-forge, qui: marchand, texte: "Une lame de Karak-Dûm, c'est pour la vie ! La vôtre, de préférence.", si: { flag: ch4-depart-fait } }
  - { id: g-forge-froide, lieu: karak-forge, texte: "Le feu de la Grande Forge est tiède… Mauvais présage.", si: { flag: karak-recus, pas_flag: forge-commencee } }
  - { id: g-chanson, lieu: karak-taverne, qui: client, texte: "Encore une chanson ! La quarante-septième ! On ne compte qu'à partir de trois !", si: { flag: ch4-depart-fait } }
  - { id: g-kobolds, lieu: karak-taverne, qui: client, texte: "On dit que Grumli laisse un tonneau aux kobolds, chaque mois. Drôle d'époque.", si: { flag: kobolds-amis } }
  - { id: gr-nuit, lieu: karak-porte, texte: "La nuit, les marteaux ne s'arrêtent jamais. On s'y habitue. Ou pas.", moment: nuit, si: { flag: ch4-depart-fait } }
  # ─── Archipel des Brumes (Port-Vérane)
  - { id: a-rhum, lieu: port-taverne, qui: client, texte: "Le rhum des Brumes guérit tout. Sauf la soif.", si: { flag: ch4-depart-fait } }
  - { id: a-corsa, lieu: port-quais, texte: "Corsa la Rouge a perdu sa jambe contre un requin. Ou un dragon. Ça dépend du jour.", si: { flag: ch4-depart-fait } }
  - { id: a-dragonne, lieu: port-quais, texte: "Une dragonne d'or a survolé le port ! J'en ai lâché mon filet.", si: { flag: ysoria-recrutee } }
  - { id: a-phare, lieu: port-taverne, qui: client, texte: "Le Phare noyé s'est encore allumé hier soir. Restez loin de cette lumière verte.", si: { flag: ch4-depart-fait, pas_flag: phare-commence } }
  - { id: a-tobby, lieu: port-taverne, qui: client, texte: "Le petit Tobby est rentré du Phare ! Le vieux Brann n'a jamais été aussi gentil.", si: { quete_terminee: q-phare } }
  - { id: a-epaves, lieu: port-marche, qui: marchand, texte: "Tout ce que la mer rapporte ! Ne demandez pas d'où ça vient.", si: { flag: ch4-depart-fait } }
  - { id: a-nuit, lieu: port-quais, texte: "La brume monte la nuit. Les cloches des navires sonnent toutes seules.", moment: nuit, si: { flag: ch4-depart-fait } }
  # ─── Mur d'Aube (Fort-Aube)
  - { id: m-attente, lieu: fort-aube-porte, qui: garde, texte: "Quarante mille, qu'ils disent. On verra bien combien rentrent chez eux.", si: { flag: ch5-depart-fait, pas_flag: mur-tombe } }
  - { id: m-breche, lieu: fort-aube-porte, qui: garde, texte: "Le Mur a une brèche, mais nous, on est toujours debout.", si: { flag: mur-tombe } }
  - { id: m-soupe, lieu: fort-aube-cantine, qui: client, texte: "La soupe de Mère Brisac, c'est la seule chose qui ne change pas dans cette guerre.", si: { flag: ch5-depart-fait } }
  - { id: m-marechale, lieu: fort-aube-etat-major, qui: garde, texte: "La Maréchale ne dort jamais. On dit qu'elle se repose en regardant les cartes.", si: { flag: ch5-depart-fait, pas_flag: mort:marechale } }
  - { id: m-marechale-morte, lieu: fort-aube-porte, texte: "Ils ont gravé le nom de la Maréchale sur la porte. Elle l'a tenue jusqu'au bout.", si: { flag: mort:marechale } }
  - { id: m-armes, lieu: fort-aube-armurerie, qui: marchand, texte: "Chaque armure a un nom ! Celle-ci, c'est Berthe. Elle a sauvé six soldats.", si: { flag: ch5-depart-fait } }
  - { id: m-dragons, lieu: camp-des-allies, texte: "Un dragon dort sur la colline. Il ronfle. Personne n'ose le réveiller.", si: { flag: dragons-allies } }
  - { id: m-rang-s, lieu: fort-aube-cantine, qui: client, texte: "Ce sont eux, les rangs S ! J'ai vu l'épreuve. Incroyable.", si: { flag: rang-s-obtenu } }
  - { id: m-nuit, lieu: fort-aube-porte, texte: "La nuit, on voit les feux de la Légion, au nord. Des milliers.", moment: nuit, si: { flag: ch5-depart-fait } }
  # ─── Terres Cendrées (Camp de l'Aube)
  - { id: t-ciel, lieu: camp-tentes, texte: "Il ne fait jamais nuit, ici. Le ciel reste couleur de braise. On dort mal.", si: { flag: ch6-depart-fait, pas_flag: saison-1-finie } }
  - { id: t-soupe, lieu: camp-tentes, qui: client, texte: "Mère Brisac a suivi l'armée jusqu'ici. Rien ne l'arrête. Même pas les Cendres.", si: { flag: ch6-depart-fait } }
  - { id: t-forge, lieu: camp-forge, qui: marchand, texte: "De l'obsidienne gratuite partout ! Le paradis des forgerons !", si: { flag: ch6-depart-fait } }
  - { id: t-cendrebourg, lieu: camp-tentes, qui: client, texte: "Les enfants démons de Cendrebourg sont venus voir les dragons. Ils n'ont pas peur, eux.", si: { flag: demons-epargnes } }
  - { id: t-citadelle, lieu: guilde-camp, qui: garde, texte: "La Citadelle… On dit que sa porte a toujours été ouverte. Ça fait encore plus peur.", si: { flag: ch6-depart-fait, pas_flag: orvan-vaincu } }
  - { id: t-paix, lieu: camp-tentes, texte: "C'est fini. C'est vraiment fini. Le ciel est bleu, au-dessus des Cendres.", si: { flag: voile-recousu } }
  - { id: t-pacte, lieu: camp-tentes, texte: "Des ambassadeurs démons, au camp ! Et personne ne sort l'épée. Drôle d'époque.", si: { flag: royaume-des-cendres } }
