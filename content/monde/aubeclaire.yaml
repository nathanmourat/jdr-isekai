# Région du chapitre 1. Les positions sont en pixels sur la carte (1920 × 1080).
regions:
  - id: aubeclaire
    nom: "Royaume d'Aubeclaire"
    carte: aubeclaire
    # Une ville regroupe plusieurs lieux : un seul point sur la carte du monde, puis un plan cliquable.
    # Les positions du plan viennent de assets/cartes/lysmont-plan.json quand le graphiste l'a livré ;
    # en attendant, on utilise `position_plan` (image de 1280 × 720).
    villes:
      - id: lysmont
        nom: "Ville de Lysmont"
        description: "La capitale d'Aubeclaire : tours blanches, toits bleus, et toujours du monde dans les rues."
        plan: lysmont-plan
        position: { x: 960, y: 570 }
    lieux:
      - id: temple-du-seuil
        nom: "Temple du Seuil"
        description: "Le grand temple blanc où l'Ordre accomplit l'Appel."
        decor: temple-du-seuil
        position: { x: 960, y: 345 }
        # `position` : où se tient le personnage sur le décor (1280 × 720), pour cliquer sur lui.
        pnj: [{ id: aureliath, position: { x: 640, y: 330 } }, { id: elianne }]
        boutique: [potion-soin-petite, antidote]
      - id: lysmont-place
        nom: "Place de Lysmont"
        description: "Le cœur de la capitale : fontaine, étals, rumeurs."
        decor: lysmont-place
        ville: lysmont
        position: { x: 960, y: 570 }
        position_plan: { x: 640, y: 380 }
        disponible_si: { flag: appel-fait }
        pnj: [{ id: aveline, si: { flag: aveline-rencontree } }]
      - id: guilde
        nom: "Guilde de la Rose des Vents"
        description: "Le hall des aventuriers : contrats, comptoir et bagarres."
        decor: guilde
        ville: lysmont
        position: { x: 1075, y: 610 }
        position_plan: { x: 900, y: 430 }
        disponible_si: { flag: appel-fait }
        pnj: [{ id: rowena }, { id: kaya, si: { flag: examen-reussi } }]
        boutique: [potion-soin-petite, antidote, bombe-feu, bombe-fumee, epee-courte, deux-mains-i, masse-i, dague, arc-court, arbalete-i, baton-apprenti, sceptre-i, orbe-i, instrument-i, lourde-i, armure-cuir, robe-mage, bouclier-bois, anneau-i, amulette-i, talisman-i, carquois-i, sacoche-i, kit-entretien-armes]
      - id: taverne
        nom: "Le Chaudron Fêlé"
        description: "La taverne et l'auberge de Bram : on y mange bien, on y parle trop, et on y dort à l'étage."
        decor: taverne
        ville: lysmont
        auberge: true
        position: { x: 845, y: 610 }
        position_plan: { x: 380, y: 430 }
        disponible_si: { flag: appel-fait }
        pnj: [{ id: bram, si: { pas_flag: mort:bram } }, { id: ferrand, si: { flag: examen-reussi } }]
        boutique: [ration, gateau-lysmont, livre-ancien]
      - id: boutique
        nom: "Le Comptoir de Halvine"
        description: "Une boutique encombrée du sol au plafond : potions, armes, cadeaux, et une balance qui ne ment jamais."
        decor: boutique
        ville: lysmont
        position: { x: 900, y: 640 }
        position_plan: { x: 560, y: 560 }
        disponible_si: { flag: appel-fait }
        pnj: [{ id: halvine }]
        boutique: [potion-soin-petite, potion-soin, potion-mana, antidote, bombe-feu, bombe-fumee, ration, fleur-des-champs, gateau-lysmont, bijou-dore, epee-i-maitre, deux-mains-i-maitre, masse-i-maitre, dague-i-maitre, arc-i-maitre, arbalete-i-maitre, baton-i-maitre, sceptre-i-maitre, orbe-i-maitre, instrument-i-maitre, lourde-i-maitre, intermediaire-i-maitre, legere-i-maitre, bouclier-i-maitre, anneau-i-maitre, amulette-i-maitre, talisman-i-maitre, carquois-i-maitre, sacoche-i-maitre]
      - id: chateau
        nom: "Château de Lysmont"
        description: "Le siège de la Couronne, tours blanches et toits bleus."
        decor: chateau-trone
        ville: lysmont
        position: { x: 960, y: 480 }
        position_plan: { x: 640, y: 150 }
        disponible_si: { flag: appel-fait }
        pnj: [{ id: edmund-iv }, { id: seraphine }]
      - id: quartier-tanneurs
        nom: "Quartier des Tanneurs"
        description: "Ruelles pauvres et cuves de teinture. On y disparaît, ces temps-ci."
        decor: quartier-tanneurs
        ville: lysmont
        position: { x: 1060, y: 680 }
        position_plan: { x: 980, y: 610 }
        disponible_si: { flag: examen-reussi }
      - id: arene
        nom: "Arène de Lysmont"
        description: "Le sable du tournoi des écuyers."
        decor: arene
        ville: lysmont
        position: { x: 1120, y: 530 }
        position_plan: { x: 1020, y: 230 }
        disponible_si: { flag: examen-reussi }
        pnj: [{ id: aveline, si: { flag: aveline-rencontree } }]
      - id: combe-aux-saules
        nom: "Combe-aux-Saules"
        description: "Forêt de saules au sud-ouest, fermes isolées et loups affamés."
        decor: combe-aux-saules
        position: { x: 440, y: 790 }
        disponible_si: { flag: examen-reussi }
        pnj: [{ id: gareth }]
      - id: crypte-fontaine
        nom: "Crypte de la Fontaine"
        description: "Des ruines couvertes de lierre, un escalier qui descend dans le noir."
        decor: crypte-entree
        position: { x: 1488, y: 500 }
        disponible_si: { quete_etape: { q-ch1-appel: crypte } }
      # ── Lieux d'étape : ils n'apparaissent sur la carte que pendant l'étape de quête ou de contrat qui y mène.
      - { id: combe-lisiere, nom: "Lisière de la Combe", description: "Ronces, souches et empreintes dans la terre meuble.", decor: combe-aux-saules, position: { x: 540, y: 730 }, etape_seulement: true }
      - { id: combe-ruisseau, nom: "Ruisseau aux Saules", description: "Une eau froide et claire sous les branches tombantes.", decor: combe-aux-saules, position: { x: 400, y: 880 }, etape_seulement: true }
      - { id: combe-taniere, nom: "Vieux saule creux", description: "Un saule énorme, aux racines creusées comme une grotte.", decor: combe-aux-saules, position: { x: 300, y: 760 }, etape_seulement: true }
      - { id: route-du-nord, nom: "Route du nord", description: "Une route pavée qui file vers le Mur d'Aube, bordée de fossés.", decor: route-du-nord, position: { x: 1040, y: 210 }, etape_seulement: true }
      - { id: gue-de-valmont, nom: "Gué de Valmont", description: "La rivière s'élargit ; les chariots passent à gué, lentement.", decor: gue-de-valmont, position: { x: 1300, y: 780 }, etape_seulement: true }
      - { id: champs-du-nord, nom: "Champs de blé du nord", description: "Des champs dorés, retournés par endroits comme par une charrue folle.", decor: champs-du-nord, position: { x: 800, y: 440 }, etape_seulement: true }
      - { id: grotte-des-mineurs, nom: "Grotte des mineurs", description: "Une entrée de mine étayée de poutres, d'où sort un air froid.", decor: grotte-des-mineurs, position: { x: 1600, y: 330 }, etape_seulement: true }
      - { id: collines-lune-sauge, nom: "Collines à lune-sauge", description: "Des collines pelées où pousse une herbe argentée, visible surtout au crépuscule.", decor: collines-lune-sauge, position: { x: 640, y: 290 }, etape_seulement: true }
      - { id: crypte-nid, nom: "Nid sous la crypte", description: "Un boyau latéral tapissé de toiles épaisses.", decor: crypte-entree, position: { x: 1560, y: 590 }, etape_seulement: true }
      - { id: egouts, nom: "Égouts de Lysmont", description: "Une grille soulevée derrière la fontaine, un escalier glissant, une odeur tenace.", decor: egouts, ville: lysmont, position: { x: 960, y: 600 }, position_plan: { x: 740, y: 480 }, etape_seulement: true }
      - { id: marche, nom: "Marché de Lysmont", description: "Des étals serrés, des cris, et deux marchands qui en viennent presque aux mains.", decor: lysmont-place, ville: lysmont, position: { x: 940, y: 560 }, position_plan: { x: 500, y: 330 }, etape_seulement: true }
      - { id: tannerie-abandonnee, nom: "Tannerie abandonnée", description: "Volets cloués, cuves à sec… et une trappe de cave qui a servi récemment.", decor: quartier-tanneurs, ville: lysmont, position: { x: 1080, y: 700 }, position_plan: { x: 1090, y: 540 }, etape_seulement: true }
