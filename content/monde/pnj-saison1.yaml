# Personnages non jouables des chapitres 2 à 6 (hors compagnons, qui sont dans content/compagnons/).
pnj:
  # ── Chapitre 2 : Marche des Sables
  - { id: ouzram, nom: "Maître Ouzram Telli", titre: "Armurier du Grand Bazar", description: "Vieil homme sec au turban safran, lunettes d'or, mains couvertes de petites brûlures de forge.", accueil: "Entrez, entrez ! Une lame de Qarzim ne rouille jamais, et mes prix ne mentent qu'à moitié." }
  - { id: ziyane, nom: "Mère Ziyane", titre: "Aubergiste de l'Oasis Bleue", description: "Femme ronde au rire sonore, foulard indigo, bracelets qui tintent à chaque geste.", accueil: "De l'eau fraîche, un lit sous les voiles, et pas de questions. Bienvenue à l'Oasis Bleue." }
  - { id: ibrek, nom: "Ibrek Sall", titre: "Intendant de la Guilde à Qarzim", description: "Jeune vulpin aux oreilles rousses, lunettes rondes, registre toujours ouvert. Il connaît les tarifs de tous les contrats par cœur.", accueil: "Comptoir de la Rose des Vents ! Les contrats sont au tableau ; le matériel, c'est ici." }
  - { id: hassad, nom: "Prévôt Hassad Meriyem", titre: "Prévôt de la Concorde", description: "Homme mince en soie blanche, barbe taillée au cordeau, une bague-cristal violette à chaque main. Courtois, glacial." }
  - { id: vashti, nom: "Conseillère Vashti Orren", titre: "Conseillère de la Concorde", description: "Femme élégante aux yeux maquillés de khôl, toujours un éventail à la main. Elle sourit trop." }
  - { id: sorha, nom: "L'Ancienne Sorha", titre: "Doyenne de la tribu Lunecroc", description: "Vieille ourvalis aux oreilles grises, aveugle d'un œil, appuyée sur un bâton gravé de loups. La grand-mère de Kaya." }
  - { id: tavek, nom: "Tavek Lunecroc", titre: "Chef de guerre lunecroc", description: "Grand ourvalis aux oreilles noires, peintures de guerre rouges, griffes de fer aux poings. Le cousin de Kaya." }
  - { id: kezir, nom: "Kezir", titre: "Maître de la Main de Sable", description: "Silhouette voilée de noir, voix douce, yeux dorés. Personne n'a jamais vu son visage." }
  - { id: vask, nom: "Capitaine Orlen Vask", titre: "Mercenaire de la Concorde", description: "Cuirasse dorée cabossée, crâne rasé, cicatrice du menton à l'oreille." }
  - { id: faelis, nom: "Faelis Brumevent", titre: "Marchande elfe", description: "Elfe sylvaine aux cheveux d'argent tressés de feuilles, longue cape vert sombre. Elle vend des herbes, et des secrets." }
  - { id: archiviste, nom: "Maître Corvin", titre: "Archiviste royal", description: "Petit homme voûté aux doigts tachés d'encre, qui parle aux livres plus qu'aux gens." }
  # ── Chapitre 3 : Sylvenoire
  - { id: reine-seve, nom: "La Reine-Sève", titre: "Reine des elfes de Sylvenoire", description: "Grande, immobile, des cheveux comme des racines blanches et des yeux couleur de mousse. Elle a vu la Déchirure." }
  - { id: thaliel, nom: "Thaliel", titre: "Aubergiste de la Feuille d'Argent", description: "Jeune elfe souriant, tablier vert, qui monte et descend les échelles plus vite qu'un écureuil.", accueil: "Bienvenue à la Feuille d'Argent ! Les hamacs sont doux, et la vue est gratuite." }
  - { id: mirwen, nom: "Mirwen", titre: "Marchande du Marché des Graines", description: "Elfe âgée aux mains couvertes de terre, qui connaît le nom de chaque graine de la forêt.", accueil: "Une graine bien choisie vaut une épée. Regardez, mais ne marchez pas sur les pousses." }
  - { id: orsa, nom: "Orsa Brindebois", titre: "Intendante du Relais de la Guilde", description: "Naine trapue aux tresses rousses, hache à la ceinture, seule naine tolérée à Ithrael — et fière de l'être.", accueil: "Des contrats, du matériel, et pas de feuilles dans mon registre. Qu'est-ce qu'il vous faut ?" }
  - { id: vaelor, nom: "Vaelor", titre: "Capitaine de la garde d'Ithrael", description: "Elfe au visage fermé, arc long dans le dos, qui n'a jamais souri à un humain." }
  - { id: intendant-domaine, nom: "Maître Aubin", titre: "Intendant de votre domaine", description: "Vieil homme aux mains de paysan et au regard d'ancien soldat, qui tient vos comptes mieux que vous." }
  - { id: morra, nom: "Morwenna « Morra »", titre: "Commandante de la Légion Cendrée", description: "Cornes noires, cheveux couleur de braise, épée-faux plus haute qu'elle. Humour noir, fierté, fatigue." }
  - { id: enfant-ithrael, nom: "Lirëa", titre: "Enfant d'Ithrael", description: "Une petite elfe de quarante ans (huit, pour un humain), qui suit tout ce qui brille." }
  # ── Chapitre 4 : Monts Grisfer et Archipel des Brumes
  - { id: bardrek, nom: "Bardrek", titre: "Roi-sous-la-Montagne", description: "Un nain immense (pour un nain), barbe tressée de fils d'or jusqu'aux genoux, couronne de fer noir. Il ne rit jamais avant le troisième tonneau." }
  - { id: durna, nom: "Maîtresse Durna Martelfeu", titre: "Forgeronne de la Grande Forge", description: "Naine aux bras couverts de cicatrices de brûlure, lunettes de forge sur le front, voix qui couvre les marteaux.", accueil: "Une arme de Karak-Dûm, c'est pour la vie. La vôtre, ou celle de votre ennemi." }
  - { id: grumli, nom: "Grumli", titre: "Tavernier de la Chope Ardente", description: "Nain rond comme un tonneau, tablier taché de bière, qui chante faux et fort.", accueil: "Une chope ? Deux ? Un tonneau ? Ici, on ne compte qu'à partir de trois !" }
  - { id: hjalmi, nom: "Hjalmi l'Éborgnée", titre: "Intendante de la Guilde à Karak-Dûm", description: "Naine borgne au bandeau de cuir, qui a été rang A avant de perdre son œil contre une salamandre.", accueil: "Contrats au tableau. Matériel au comptoir. Et on ne crache pas par terre." }
  - { id: corsa, nom: "Capitaine Corsa la Rouge", titre: "Capitaine pirate de Port-Vérane", description: "Grande femme aux cheveux rouges tressés de perles, sabre courbe, rire tonitruant. Elle a une jambe de bois et elle s'en vante." }
  - { id: brann, nom: "Vieux Brann", titre: "Tavernier du Requin Ivre", description: "Un ancien pirate couvert de tatouages délavés, un perroquet empaillé sur l'épaule.", accueil: "Bienvenue au Requin ! Le rhum est fort, les hamacs tanguent, et les dettes se paient." }
  - { id: corail, nom: "Corail", titre: "Marchande du Marché aux épaves", description: "Une jeune femme sang-dragon aux écailles nacrées, qui sait d'où vient chaque objet et ne le dit jamais.", accueil: "Tout ce que la mer rapporte, je le vends. Le reste, je le garde." }
  - { id: maree, nom: "Marée", titre: "Intendant de la Guilde à Port-Vérane", description: "Un vulpin roux en chemise de marin, qui a le mal de mer et tient pourtant un comptoir flottant.", accueil: "Contrats sur le mât ! Et si je deviens vert, ne vous inquiétez pas, c'est normal." }
  - { id: sirene, nom: "Néréa", titre: "Sirène du Récif", description: "Une sirène aux cheveux couleur d'algue et à la voix qui donne envie de se jeter à l'eau." }
  # ── Chapitre 5 : le Mur d'Aube
  - { id: marechale, nom: "Maréchale Ilsabet Corvin", titre: "Commandante du Mur d'Aube", description: "Une femme de soixante ans aux cheveux blancs coupés court, une cicatrice du front au menton. Elle n'a jamais perdu une bataille. Elle n'en a jamais gagné une facilement." }
  - { id: mere-brisac, nom: "Mère Brisac", titre: "Cantinière de la Gamelle", description: "Une grande femme aux bras de forgeron, louche à la main. Elle a nourri trois générations de soldats et en a enterré beaucoup.", accueil: "Asseyez-vous. Mangez. On ne se bat pas le ventre vide, chez moi." }
  - { id: tolvan, nom: "Tolvan l'Armurier", titre: "Maître de l'Armurerie du Mur", description: "Un vieil homme voûté, une loupe vissée à l'œil, qui parle aux armures comme à des enfants.", accueil: "Chaque armure ici a un nom. Choisissez bien : elle va vous sauver la vie." }
  - { id: valka, nom: "Sergente Valka", titre: "Intendante de la Guilde au Mur", description: "Une Ourvalis aux oreilles déchirées, ancienne rang A, qui distribue les missions comme des ordres.", accueil: "Missions au tableau. Pas de questions. Revenez vivants, c'est un ordre." }
  - { id: aldric, nom: "Prince Aldric", titre: "Frère de Séraphine, disparu en 1009", description: "Armure noire, cape bleue des princes d'Aubeclaire en lambeaux, yeux où brûle une lueur violette." }
  - { id: champion, nom: "Le Champion masqué", titre: "Épreuve du rang S", description: "Un guerrier en armure d'argent sans blason, masque lisse. Personne ne connaît son visage." }
  # ── Chapitre 6 : les Terres Cendrées
  - { id: orvan, nom: "Orvan", titre: "Souverain des Cendres, le Premier Appelé", description: "Un homme grand et maigre, en armure d'obsidienne, couronne de flammes noires. Six cents ans dans ses yeux. Il parle doucement, comme quelqu'un qui n'a parlé à personne depuis très longtemps." }
  - { id: lyss, nom: "Lyss", titre: "Sœur cadette de Morra", description: "Une jeune démone aux petites cornes et aux cheveux de braise, comme sa sœur. Elle a l'air d'avoir seize ans. Elle en a cent quatre-vingts." }
  - { id: ashka, nom: "Mère Ashka", titre: "Doyenne de Cendrebourg", description: "Une très vieille démone aux cornes usées, appuyée sur un bâton d'os. Elle a vu naître les Cendres et n'a jamais tenu une arme." }
