# Objets ajoutés par les chapitres 2 à 6 de la saison 1 (hors équipement : voir equipements.yaml).
objets:
  # ── Chapitre 2 : Marche des Sables ──
  - { id: potion-soin-grande, nom: "Grande potion de soin", description: "Une fiole épaisse, rouge sombre : elle referme les plaies en un instant.", utilite: "À boire en combat (bouton du sac). Pour les héros aguerris.", type: consommable, prix: 90, cible: allie, effets: [{ type: soin, puissance: 60, stat: VIT }] }
  - { id: potion-mana-grande, nom: "Grande potion de mana", description: "Un liquide bleu qui pétille sur la langue.", utilite: "À boire en combat : rend 45 points de mana.", type: consommable, prix: 70, cible: soi, effets: [{ type: mana, valeur: 45 }] }
  - { id: eau-d-oasis, nom: "Gourde d'eau d'oasis", description: "Une eau fraîche tirée du puits de l'Oasis Bleue.", utilite: "À boire en combat : soigne un peu et retire les effets négatifs.", type: consommable, prix: 20, cible: allie, effets: [{ type: purifier }, { type: soin, puissance: 14, stat: VIT }] }
  - { id: viande-grillee, nom: "Brochettes d'agneau grillé", description: "Épicées, juteuses, encore fumantes.", type: cadeau, prix: 10 }
  - { id: the-a-la-menthe, nom: "Boîte de thé à la menthe", description: "Un thé fin du Grand Bazar, dans une boîte en cuivre ciselé.", type: cadeau, prix: 18 }
  - { id: epices-de-qarzim, nom: "Sachet d'épices de Qarzim", description: "Safran, cumin et poivre des dunes. Cela vaut presque son poids en or.", type: cadeau, prix: 30 }
  - { id: carnet-de-contes, nom: "Carnet de contes", description: "Des contes de toutes les régions, recopiés à la main par un conteur du Bazar.", type: cadeau, prix: 22 }
  - { id: perle-du-desert, nom: "Perle du désert", description: "Une perle de verre de sable, chaude au toucher, qui change de couleur au soleil.", type: cadeau, prix: 45, mystere: true }
  - { id: cristal-ether, nom: "Cristal d'éther", description: "Un cristal violet qui bourdonne doucement, comme s'il respirait.", utilite: "Matériau : se revend très cher… mais à qui profite ce commerce ?", type: materiau, prix: 35 }
  - { id: tablette-dechirure, nom: "Tablette de la Déchirure", description: "Une tablette d'argile couverte d'écriture elfique très ancienne. On y parle d'un rituel, d'un Voile, et d'une faute.", type: quete }
  - { id: lettre-valgrane, nom: "Lettre scellée de Valgrane", description: "Un ordre de repli daté de 1003, signé du commandant de Valgrane… et contresigné d'un sceau de l'Ordre.", type: quete }
  - { id: grand-livre-rouge, nom: "Copie du Grand Livre rouge", description: "Les comptes secrets de la Concorde : qui achète les cristaux, qui doit de l'argent à qui.", type: quete }
  - { id: insigne-main-de-sable, nom: "Insigne de la Main de Sable", description: "Une main de bronze tenant un grain de sable : la marque des assassins de Qarzim.", type: quete }
  # ── Chapitre 3 : Sylvenoire
  - { id: the-de-sylve, nom: "Thé de sylve", description: "Des feuilles d'argent qui sentent la pluie.", type: cadeau, prix: 16 }
  - { id: miel-des-fleurs-d-argent, nom: "Miel des fleurs d'argent", description: "Un miel presque blanc, qui brille dans le noir.", type: cadeau, prix: 24 }
  - { id: plume-de-chouette-blanche, nom: "Plume de chouette blanche", description: "Les elfes l'offrent à ceux dont ils respectent la sagesse.", type: cadeau, prix: 20 }
  - { id: livre-des-contes-sylvains, nom: "Contes sylvains", description: "Des histoires elfiques sur les étoiles, les arbres et les dragons d'avant.", type: cadeau, prix: 35 }
  - { id: codex-dechirure, nom: "Codex de la Déchirure", description: "Le grand livre des elfes qui ont tenté de recoudre le Voile. Les dernières pages sont arrachées.", type: quete }
  - { id: corne-de-morra, nom: "Corne brisée", description: "Une corne noire, brisée pendant le combat de la Nuitlongue. Elle est encore tiède.", type: quete }
  - { id: sceau-du-domaine, nom: "Sceau du domaine", description: "Le sceau de cire de vos terres : il vous fait seigneur ou dame, pour le meilleur et pour les impôts.", type: quete }
  # ── Chapitre 4 : Monts Grisfer et Archipel des Brumes
  - { id: potion-soin-supreme, nom: "Potion de soin suprême", description: "Une fiole dorée qui brille comme un soleil miniature.", utilite: "À boire en combat (bouton du sac). Pour les héros les plus aguerris.", type: consommable, prix: 180, cible: allie, effets: [{ type: soin, puissance: 100, stat: VIT }] }
  - { id: biere-de-karak, nom: "Tonnelet de bière de Karak", description: "Une bière brune et amère, brassée sous la montagne depuis mille ans.", type: cadeau, prix: 18 }
  - { id: pierre-de-feu, nom: "Pierre de feu", description: "Une pierre volcanique qui reste tiède toute la nuit. Les nains en offrent aux amis.", type: cadeau, prix: 28 }
  - { id: rhum-des-brumes, nom: "Rhum des Brumes", description: "Un rhum noir qui sent la fumée et la vanille. Les pirates jurent qu'il guérit tout.", type: cadeau, prix: 20 }
  - { id: coquillage-chantant, nom: "Coquillage chantant", description: "Quand on l'approche de l'oreille, on entend une sirène chanter.", type: cadeau, prix: 26 }
  - { id: ecaille-de-dragon-polie, nom: "Écaille de dragon polie", description: "Une écaille dorée, polie comme un miroir. Elle brille de mille feux.", type: cadeau, prix: 60, mystere: true }
  - { id: registre-des-appels, nom: "Estampage du Registre des Appels", description: "Une copie, frottée au charbon, des tables de pierre où les nains ont noté chaque Appel depuis l'an 430… et ce qu'il a coûté.", type: quete }
  - { id: oeuf-de-braise, nom: "Œuf de braise", description: "Un œuf de dragon, gros comme une tête, brûlant comme une forge. Il bat doucement.", type: quete }
  - { id: carte-marine, nom: "Carte marine de Corsa", description: "La seule carte qui montre le chemin du Nid des Wyrms entre les récifs.", type: quete }
  # ── Chapitre 5 : le Mur d'Aube
  - { id: insigne-rang-s, nom: "Broche du rang S", description: "Une broche d'or noir en forme d'étoile à sept branches. Il n'en existe que douze au monde.", type: quete }
  - { id: cle-de-braise, nom: "Clé de braise", description: "Une clé forgée par Durna Martelfeu dans le souffle d'Ysoria. Elle est toujours chaude. Elle ouvre les chaînes d'obsidienne.", type: quete }
  - { id: armure-de-corvin, nom: "Armure du premier maréchal", description: "Une armure bosselée aux armes du premier maréchal du Mur. Tolvan dit qu'elle porte chance.", type: quete }
  - { id: lettre-de-l-espion, nom: "Lettre chiffrée", description: "Une lettre codée trouvée sur l'espion de la tour de guet. Les chiffres ressemblent à ceux de la Concorde.", type: quete }
