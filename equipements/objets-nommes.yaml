# Objets nommés (rares, épiques, légendaires), écrits à la main.
# Les stats ne sont PAS écrites ici : generer.py les calcule avec la règle de budget.
# Rareté maximum par palier : I = peu commun, II = rare, III et IV = épique, V et VI = légendaire, X = mythique.
# Par classe : palier I = 2 peu communs nommés (arme + tenue, sans effet) ; palier II = 2 rares ;
# paliers III à VI = 1 rare + 1 épique ; 1 légendaire au palier V (récompense de la quête de classe).
# Rotation des emplacements par palier :
#   I : arme + tenue                       II : accessoire + arme
#   III : rare = tenue, épique = accessoire IV : rare = arme, épique = tenue
#   V : rare = accessoire, épique = arme    VI : rare = tenue, épique = accessoire
# Effets possibles : critique, precision, resistance:<élément>, touche:<élément>, mana, vigueur
# Éléments : feu, glace, foudre, sacre, ombre, poison, arcane

