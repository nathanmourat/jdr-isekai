# Textes de content/campagne/saison-1/chapitre-3/compagnes.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Elianne — La prière du soir
- fr: Elianne est agenouillée sur la plateforme de l'auberge, face au soleil couchant, les mains jointes. Elle ne prie pas. Elle regarde ses mains.
- fr: « Avant, les mots venaient tout seuls. Maintenant… » Elle vous fait de la place à côté d'elle. « Tu pries, toi ? Dans ton monde, je veux dire. »
- fr: S'agenouiller à côté d'elle, en silence.
- fr: « Pas vraiment. Mais je sais écouter. »
- fr: « Prier ne sert à rien. Agir, si. »
- fr: "Le soleil disparaît. Au bout d'un long moment, elle murmure : « Merci. C'est la première fois depuis des semaines que ce silence ne me fait pas peur. »"
- fr: "Elle parle longtemps : de l'orphelinat, des chants du Temple, du jour de l'Appel. « J'étais si fière, ce jour-là. » Elle se tait. « Je ne sais plus si je dois l'être. »"
- fr: « Peut-être. » Elle se relève, épousseta sa robe. « Mais il faut savoir pourquoi on agit. C'est à ça que servent les prières. » Elle s'en va, sans colère.
- fr: Elianne — Le tribut du Voile
- fr: Elianne sort de son sac un paquet de lettres jaunies, attachées par un ruban gris. « Je les ai trouvées dans les archives du Temple, l'an dernier. Des lettres de Grands Prieurs, sur quatre siècles. »
- fr: "« Elles parlent toutes du « tribut du Voile ». Chaque Appel a un prix. Personne n'écrit lequel. Mais l'une d'elles dit : « Le Souverain grandit à chaque fois que nous appelons. Qu'importe : nos héros grandissent plus vite. » »"
- fr: « Ça veut dire que notre venue a renforcé les Cendres ? »
- fr: Lui prendre la main. « Ce n'est pas ta faute, Elianne. »
- fr: « Je crois, oui. » Elle range les lettres. « Les Grands Prieurs le savaient. Auréliath le sait. Et il a quand même appelé. » Ses mains tremblent. « Il faut une preuve. Une preuve que personne ne pourra brûler. »
- fr: « On dit que les nains de Grisfer gardent les registres de tous les Appels, gravés dans la pierre des Mille Marches. Les nains ne détruisent jamais rien. » Elle relève la tête. « Tu viendras ? »
- fr: Ilyssë — Les étoiles de l'autre monde
- fr: Ilyssë vous attend avec un carnet, une plume, et l'air d'un chat devant une souris. « Assieds-toi. Les étoiles de ton monde. Combien ? Quelles couleurs ? Est-ce qu'elles bougent ? Est-ce que vous avez des dragons ? Non ? Quel dommage. »
- fr: Répondre patiemment à toutes ses questions.
- fr: « Et toi ? Pose-moi une question qui ne soit pas une étude. »
- fr: Elle note trois pages, fébrile. « Des lunes artificielles ? Des voitures sans chevaux ? Tu inventes. » Elle sourit. « Continue d'inventer. »
- fr: Elle pose sa plume. Long silence. « …Est-ce que tu as peur de mourir ici ? Loin de chez toi ? » Elle détourne les yeux. « Moi, j'ai peur de vivre encore cinq cents ans sans avoir compris. »
- fr: Ilyssë — Les notes confisquées
- fr: « Cinquante ans de travail. » Ilyssë désigne un coffre scellé derrière le trône vide de la Reine. « Confisqués le jour de mon bannissement. La Reine m'a pardonné. Elle ne m'a pas rendu mes notes. »
- fr: Demander les notes à la Reine. (Charisme, difficulté 24)
- fr: Ouvrir le coffre, discrètement. (Agilité, difficulté 23)
- fr: La Reine écoute, puis ouvre le coffre elle-même. « Les vérités qu'on enferme pourrissent. Tiens, Ilyssë. »
- fr: Le coffre s'ouvre sans un bruit. Ilyssë serre ses carnets contre elle comme un enfant.
- fr: Un garde vous surprend… et détourne les yeux. Le capitaine Vaelor, de loin, hausse les épaules. Les carnets sont à vous.
- fr: "Ilyssë feuillette, fébrile, et s'arrête sur un schéma : un cercle, déchiré, et des fils qui le recousent. « Mon idée d'il y a cinquante ans. Recoudre le Voile depuis l'endroit où il est le plus fin. » Elle vous regarde. « Avec quelqu'un qui vient de l'autre côté. »"
- fr: « Tu… tu crois que ce serait possible ? Avec toi ? » Elle referme le carnet, gênée de son propre espoir.
- fr: Kaya — Le rang A
- fr: Kaya débarque dans votre hamac en brandissant une carte de cuivre. « RANG A ! Rowena m'a écrit ! Rang A ! » Elle vous secoue comme un prunier. « Encore un rang, et je rentre chez moi la tête haute ! »
- fr: La féliciter et fêter ça. Brochettes à volonté.
- fr: « Et après le rang S, tu feras quoi ? »
- fr: Les elfes n'ont jamais vu personne manger autant. Thaliel, effaré, compte les brochettes sur ses doigts. Kaya hurle à la lune depuis la plus haute branche. Personne ne dort.
- fr: Elle s'arrête, surprise. « Après ? » Elle réfléchit, les oreilles en arrière. « Je n'y avais jamais pensé. » Elle vous regarde. « Peut-être que je resterai avec toi. Si tu veux. »
- fr: Nadja — Les comptes des elfes
- fr: Nadja est désespérée. « Ils n'ont pas de monnaie. Ils échangent. Une graine contre une chanson. Un arc contre « un souvenir agréable ». » Elle se tient la tête. « Comment on fait des affaires avec des gens qui n'ont pas de prix ? »
- fr: « Tu échanges un souvenir. Raconte-leur Qarzim. »
- fr: « Tu respires et tu profites. Pour une fois. »
- fr: Elle raconte le Bazar, les épices, la poussière. Les elfes écoutent, fascinés. Elle repart avec trois arcs, un manteau et l'air ahuri de quelqu'un qui vient de faire la meilleure affaire de sa vie sans dépenser une pièce.
- fr: "Elle s'assoit sur une branche, les jambes dans le vide. Au bout d'une heure, elle dit : « C'est la première fois depuis mes seize ans que je ne compte rien. » Elle sourit. « C'est terrifiant. »"
- fr: Séraphine — Une lettre du Mur d'Aube
- fr: Séraphine a reçu une lettre d'un officier du Mur d'Aube. Elle la lit pour la dixième fois. « Une patrouille a vu un homme en armure noire, sur les remparts de Valgrane en ruine. Il portait une cape bleue. La cape des princes d'Aubeclaire. »
- fr: « On ira voir. Dès qu'on pourra. Je te le promets. »
- fr: « Une cape, ça se vole. Prépare-toi au pire. »
- fr: « Une armure noire… » Elle replie la lettre. « S'il est vivant, pourquoi ne revient-il pas ? » Personne ne répond.
- fr: Aveline — Le manoir
- fr: Aveline a passé la journée à apprendre à vos miliciens à tenir une lance. Elle a de la paille dans les cheveux et l'air heureux. « Castelroc, le domaine de mon père, ressemblait à ça. Avant. »
- fr: « Alors aide-moi à en faire un endroit dont ton père aurait été fier. »
- fr: « Tu pourrais rester ici. Être la capitaine de ma garde. »
- fr: Elle rougit jusqu'aux oreilles. « Je sers la Couronne. » Un temps. « …Mais la Couronne ne m'a jamais offert un manoir avec des pommiers. » Elle détourne la tête pour cacher son sourire.
- fr: Le soir, elle reste assise sur les marches du manoir à regarder vos gens rentrer des champs. « Je comprends pourquoi on se bat, maintenant. Pas pour un roi. Pour ça. »
