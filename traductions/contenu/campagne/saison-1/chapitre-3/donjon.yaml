# Textes de content/campagne/saison-1/chapitre-3/donjon.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Bibliothèque des Racines
- fr: Des étagères taillées dans les racines, à perte de vue. Des millions de livres. Et une odeur de terre, de cire et de très vieux papier.
- fr: Des lumières bleues dansent entre les rayonnages… et se tournent vers vous.
- fr: Un lutrin renversé cache une boîte de bois.
- fr: "Un coffre de copiste : plumes, encre… et une bourse oubliée."
- fr: Une étagère bascule dans un nuage de poussière !
- fr: "Les racines du plafond se détachent et prennent forme : des gardiens de bois."
- fr: Une racine s'enroule autour de vos chevilles !
- fr: Le squelette d'un elfe, assis contre un rayonnage, un livre sur les genoux. Il est mort en lisant.
- fr: Une armoire scellée de cire verte.
- fr: Des spores s'échappent d'un champignon géant !
- fr: "Au centre de la dernière salle, un arbre se déplie lentement. Ses yeux s'ouvrent : deux nœuds de lumière verte. « Qui… vient lire ? »"
- fr: "Sur un pupitre de bois vivant, un livre plus grand qu'un bouclier : le Codex de la Déchirure."
- fr: "Un cercle gravé au sol, et au centre, une phrase en elfique : « Ici, nous avons demandé pardon. »"
- fr: Vous n'avez pas trouvé le Codex. Ilyssë refuse de remonter sans lui.
