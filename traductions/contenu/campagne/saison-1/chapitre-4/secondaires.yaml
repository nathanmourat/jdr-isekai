# Textes de content/campagne/saison-1/chapitre-4/secondaires.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: La forge qui s'éteint
- fr: Maîtresse Durna frappe un lingot, le regarde, et le jette dans un seau avec dégoût. « Tiède. TIÈDE ! Le feu de la Grande Forge brûle depuis mille ans, et le voilà qui tousse comme un vieux nain. »
- fr: « La Braise-mère. Le cœur du feu. Elle vient de la Coulée de lave, là-haut. Et les salamandres l'ont volée, j'en mettrais ma barbe au feu. Enfin, si j'avais une barbe. »
- fr: « Nous irons chercher votre Braise-mère. »
- fr: « Rapportez-la dans ça. » Elle vous tend une lanterne de bronze aux parois épaisses comme un pouce. « Et ne la touchez pas avec les doigts. Vous n'en aurez plus. »
- fr: La Coulée de lave
- fr: La lave descend en grosses vagues lentes. Au milieu, sur un rocher noir, une braise grosse comme un poing pulse comme un cœur. Autour d'elle, des salamandres dorment, enroulées.
- fr: Se glisser jusqu'à la braise sans les réveiller. (Agilité, difficulté 26)
- fr: Attaquer les salamandres.
- fr: Les salamandres vous chassent de la coulée, les vêtements fumants. Mais dans la bousculade, la braise a roulé jusqu'à vos pieds. Vous l'attrapez avec la lanterne.
- fr: La Braise-mère entre dans la lanterne avec un soupir de contentement. Le bronze devient rouge, puis se calme.
- fr: Le feu de mille ans
- fr: Durna verse la Braise-mère dans le foyer. Le feu rugit si fort que toute la forge recule d'un pas. Puis tous les forgerons d'Ardenclume se mettent à frapper en même temps, comme un tambour de victoire.
- fr: « Les armes de cette guerre sortiront d'ici, et elles seront chaudes. » Elle vous tend un petit paquet. « Et ça, c'est pour vous. Un nain ne doit jamais rien à personne. »
- fr: La cave de Grumli
- fr: Grumli pleure dans sa barbe, et ce n'est pas une image. « Trois tonneaux ! Trois ! Vidés par en dessous, avec un petit trou rond. Et des traces de pattes. Des PETITES pattes ! »
- fr: « Il y a un vieux tunnel sous la cave. Il descend jusqu'aux Mines profondes. Je n'ose pas y aller. Les mines, c'est plein de kobolds. Et moi, je suis tavernier, pas guerrier. »
- fr: « Nous allons retrouver vos voleurs de bière. »
- fr: « Et s'ils ont tout bu, ramenez-moi au moins les tonneaux ! Ce sont des tonneaux de famille ! »
- fr: Les voleurs de bière
- fr: Au bout du tunnel, une galerie. Des dizaines de kobolds (petits, écailleux, avec de grandes oreilles) sont assis autour des trois tonneaux de Grumli. Ils ont l'air… très joyeux.
- fr: "Plus loin dans la galerie, une lueur rouge : des gelées de magma qui avancent lentement. Les kobolds n'ont pas volé la bière pour s'amuser. Ils fuient leurs mines, envahies."
- fr: Chasser les gelées de magma pour rendre leurs mines aux kobolds.
- fr: Attaquer les kobolds et reprendre les tonneaux.
- fr: Les gelées vous repoussent… mais les kobolds se jettent dans la mêlée avec des pioches et des seaux d'eau. À vous tous, vous en venez à bout.
- fr: Les kobolds rentrent chez eux en chantant (très faux). Le plus vieux vous rend les tonneaux vides, avec une pépite d'or dans chacun, en guise d'excuse.
- fr: Les kobolds s'enfuient dans les galeries… vers les gelées de magma. Vous entendez leurs cris longtemps. Vous récupérez les tonneaux.
- fr: Une tournée pour la maison
- fr: Grumli serre ses tonneaux dans ses bras comme des enfants retrouvés. « Mes tonneaux ! »
- fr: Il écoute l'histoire des kobolds, et se gratte la tête. « Des voisins qui aiment la bière… Bon. Je leur laisserai un tonneau par mois. Au fond du tunnel. C'est bon pour les affaires, les voisins. »
- fr: « Tournée générale ! Pour les héros ! » Personne, dans toute la taverne, ne refuse.
- fr: La lumière du Phare noyé
- fr: Le vieux Brann essuie le même verre depuis une heure. « Mon fils Tobby. Seize ans, la tête pleine de vent. Le Phare noyé s'est allumé, il y a trois nuits. Il a pris une barque pour aller voir qui l'allume. »
- fr: « Personne ne revient du Phare. On dit que l'équipage du Vent-Noir y monte la garde, depuis qu'il a coulé. Cinquante ans sous l'eau, et ils montent encore la garde. »
- fr: « Nous ramènerons Tobby. »
- fr: Le Phare noyé
- fr: La mer arrive au deuxième étage du phare. Vous montez par l'escalier en colimaçon, couvert d'algues. En haut, la lanterne brille d'une lumière verte, froide, qui ne chauffe rien.
- fr: "Un garçon est assis contre la lanterne, terrifié mais vivant : Tobby. Entre vous et lui, des marins ruisselants se lèvent, les yeux vides. L'équipage du Vent-Noir."
- fr: Se battre pour passer.
- fr: « Votre navire a coulé il y a cinquante ans. Vous pouvez vous reposer. » (Esprit, difficulté 26)
- fr: Les noyés vous repoussent vers l'escalier… mais le soleil se lève, et ils s'effondrent en flaques d'eau de mer. Tobby se jette dans vos bras.
- fr: Le capitaine noyé vous regarde longtemps. Puis il retire son chapeau. « Cinquante ans… » La lanterne s'éteint. Quand vous rouvrez les yeux, il n'y a plus que de l'eau sur les marches.
- fr: Tobby claque des dents. « Ils… ils voulaient juste que quelqu'un allume la lumière pour eux. Pour retrouver le port. »
- fr: Le retour de Tobby
- fr: Le vieux Brann lâche son verre, qui se brise. Il serre Tobby si fort que le garçon proteste. Puis il lui donne une claque derrière la tête, et le serre encore.
- fr: « Au Requin Ivre, vous ne paierez plus jamais une chope. Jamais. Et prenez ça. » Il vous tend une vieille bourse, lourde de doublons.
- fr: Le chant de Néréa
- fr: Corail polit une perle sans vous regarder. « Les marins disent que la sirène du Récif chante pour les noyer. Les marins sont idiots. »
- fr: "« Néréa chante depuis un mois. Toujours le même chant : un appel au secours, en langue des sirènes. Je suis la seule ici à la comprendre. » Elle lève enfin les yeux. « Et moi, je ne sais pas me battre. »"
- fr: « Nous irons au Récif. »
- fr: Le Récif des sirènes
- fr: Le soir tombe sur le Récif. Une voix s'élève, belle à en avoir mal. Sur un rocher, une sirène aux cheveux d'algue chante, les yeux fermés. Sa queue est prise dans un filet de fer.
- fr: Elle ouvre les yeux. « Enfin, des gens qui ne sautent pas à l'eau. » Sa voix parlée est rauque. « Les crabes du récif gardent le filet. Ils m'apportent à manger pour que je reste grasse. Pour la Concorde, qui paie cher les écailles de sirène. »
- fr: Attaquer les crabes qui gardent le filet.
- fr: Les crabes vous repoussent dans l'eau. Mais pendant qu'ils s'occupent de vous, Néréa a rongé le filet. Elle plonge, libre, en riant.
- fr: Néréa vous offre un coquillage nacré. « Quand tu voudras une chanson, souffle dedans. Je viendrai. » Elle hésite. « Et si un jour un barde vient au Récif… je lui apprendrai le dernier couplet. »
- fr: Une dette de sirène
- fr: Corail écoute, et pour la première fois, elle sourit franchement. « Néréa est ma cousine. Très éloignée. » Elle vous tend une écaille dorée, polie comme un miroir. « Ne la vendez jamais. »
