# Textes de content/campagne/saison-1/chapitre-5/compagnes.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Aveline — Gauvain de Castelroc
- fr: Une lettre est arrivée de Lysmont, scellée du sceau royal. Aveline la tient sans l'ouvrir depuis une heure. « Lis-la, toi. Je n'y arrive pas. »
- fr: « Par décision du roi Edmund IV, le chevalier Gauvain de Castelroc, qui tint la porte nord de Valgrane en l'an 1003 et sauva trois mille âmes, est lavé de toute accusation. Son nom sera gravé sur le Mur d'Aube, parmi ceux de ses défenseurs. »
- fr: « Le peuple connaît la vérité. Il l'a exigé. »
- fr: « Le roi l'a fait sans dire pourquoi. Je sais pourquoi. Ça me suffit. »
- fr: La prendre dans vos bras.
- fr: « Ton père serait fier de toi, Aveline. »
- fr: Elle pleure, puis elle rit, puis elle pleure encore. « Vingt-deux ans. » Elle s'essuie les yeux avec sa manche, comme une enfant. « Je n'ai plus rien à prouver. » Elle vous regarde. « Alors maintenant… je peux choisir ce que je veux vraiment. »
- fr: Elianne — La foi et la vérité
- fr: Elianne a soigné quatre cents blessés depuis la chute du Mur. Ce soir, une lettre de l'Ordre lui demande de rentrer à Lysmont. « On me propose de devenir prieure. Moi. » Elle rit, sans joie.
- fr: « Je pourrais changer l'Ordre de l'intérieur. Ou le quitter, et soigner les gens ici, sans voile, sans mensonges. » Elle vous regarde. « Qu'est-ce que tu ferais ? »
- fr: « Deviens prieure. Fais de l'Ordre ce qu'il aurait dû être. »
- fr: « Quitte-le. Ta lumière n'a pas besoin d'eux. »
- fr: « Prieure. » Elle pèse le mot. « Ils vont détester ça. Une prieure qui dit la vérité. » Elle sourit pour de bon. « Après la guerre. Pas avant. Ma place est ici. »
- fr: Elle déchire la lettre, lentement, en tout petits morceaux, et les jette au vent du nord. « Voilà. » Elle respire. « Je me sens légère. Comme si j'avais posé un sac que je portais depuis l'enfance. »
- fr: « Merci d'avoir cherché la vérité avec moi. Elle faisait mal. Elle fait toujours mal. Mais elle est à nous, maintenant. »
- fr: Ilyssë — Recoudre le Voile
- fr: Ilyssë n'a pas dormi depuis trois jours. Autour d'elle, des pages couvertes de schémas, de fils dessinés, de cercles. « J'ai trouvé. » Elle a les yeux rouges et la voix qui tremble. « J'ai trouvé comment on recoud le Voile. »
- fr: "« Il faut quelqu'un qui vient de l'autre côté. Quelqu'un dont le passage a déchiré le Voile. Il tient le fil. Et il faut le cœur du Voile : là où la première déchirure a été faite. »"
- fr: Elle pose le doigt sur la carte, au nord. « La Citadelle d'Obsidienne. Orvan s'y est installé exactement au-dessus. Évidemment. »
- fr: « Alors nous irons recoudre le Voile dans la Citadelle. »
- fr: « Et si on recoud le Voile… on ne pourra plus jamais rentrer chez nous ? »
- fr: Ilyssë se tait longtemps. « Avant de le recoudre, on pourrait l'ouvrir une dernière fois. Proprement. Une porte, juste le temps de passer. » Elle détourne les yeux. « Si certains d'entre vous veulent partir. »
- fr: Elle range ses pages, et pour la première fois depuis trois jours, elle s'allonge dans l'herbe. « Cinquante ans de bannissement pour ça. » Elle sourit au ciel. « Ça valait le coup. »
- fr: Kaya — Le hurlement des ancêtres
- fr: Kaya porte sa broche du rang S sur son cœur, et elle la touche toutes les cinq minutes pour vérifier qu'elle est toujours là. « La tribu a écrit. Sorha dit que les ancêtres ont hurlé toute la nuit de l'épreuve. Les vieux ont pleuré. »
- fr: Elle se tait. Ses oreilles se baissent. « J'ai eu ce que je voulais. Depuis que je suis petite. Et maintenant… » Elle vous regarde. « Maintenant, je ne veux plus que ça. Je te veux, toi, dans ma meute. Pour toujours. »
- fr: « Je suis déjà dans ta meute, Kaya. »
- fr: Hurler à la lune avec elle.
- fr: Kaya hurle. Vous hurlez. Toute la Gamelle s'arrête, puis les soldats Lunecroc reprennent, puis tout le camp. Mère Brisac lève les yeux au ciel. Elle sourit.
- fr: Nadja — Le prix de la liberté
- fr: Nadja pose le Grand Livre rouge sur la table de la Gamelle. « Trente ans de trafic. Les caisses du camp. Le sceau. Les lettres. Tout y est. » Elle tapote la couverture. « Envoyé en copie au roi, à la Reine-Sève et à Bardrek. Ce matin. »
- fr: « La Concorde est finie. Le Prévôt Hassad a fui vers les îles du Levant. Et devine quoi ? » Elle sort un parchemin. « Ma dette a disparu avec eux. Plus personne pour la réclamer. »
- fr: « Tu es libre, Nadja. »
- fr: « Et maintenant, que fait une marchande libre ? »
- fr: « Elle ouvre sa propre maison de commerce. Honnête. Enfin… honnête à quatre-vingts pour cent. » Elle sourit. « Et elle cherche un associé. Pour la vie. Les contrats à vie, c'est très rentable. »
- fr: Pour la première fois, Nadja ne compte rien. Elle reste assise, les mains à plat sur le Grand Livre, et elle respire. « Libre. C'est un drôle de mot. Je vais m'y habituer. »
- fr: Séraphine — Mon frère
- fr: "Une lettre de Lysmont : les prêtres ont soigné Aldric. La lueur violette est partie. Il dort beaucoup, il parle peu. Le premier mot qu'il a dit, c'est son prénom à elle. « Séraphine. »"
- fr: Séraphine relit la lettre en souriant et en pleurant en même temps. « Il est vivant. Il est revenu. Pas entier. Mais revenu. »
- fr: Séraphine regarde vers le nord. « Il est quelque part là-bas. Il s'est arrêté, à Valgrane. Il s'est arrêté deux fois. » Elle serre la cape bleue. « Il reviendra. Je le sais. »
- fr: Séraphine regarde vers le nord. « Il est quelque part là-bas. Il s'est arrêté, à Valgrane. » Elle serre les poings. « La prochaine fois, je le ramènerai. »
- fr: Séraphine a enterré la cape bleue de son frère sous un pommier, derrière le Mur. Elle y vient tous les soirs. Ce soir, elle vous a demandé de venir.
- fr: « Je voulais une Couronne qui ne traite pas les héros comme des armes. » Elle vous prend la main. « Aldric était une arme, pour Orvan. Je ne laisserai plus jamais personne faire ça. À personne. »
- fr: « Alors construisons ce royaume-là, ensemble. »
- fr: La serrer contre vous, sans rien dire.
- fr: « Quand tout ça sera fini, mon père voudra me marier à un prince. » Elle rit. « Il va être très déçu. »
- fr: Ysoria — L'éclosion
- fr: Ysoria a couvé l'œuf dans la cheminée de la Gamelle pendant six semaines. Mère Brisac a protesté, puis abandonné. Cette nuit, la coquille craque.
- fr: Une petite tête rouge et or sort de l'œuf. Deux yeux de braise, immenses. Le dragonneau éternue une flamme minuscule, regarde Ysoria… puis vous. Et rampe dans vos mains.
- fr: Ysoria a les larmes aux yeux, ce qui fait de la vapeur. « Il t'a choisi en deuxième. Chez les dragons, c'est… c'est la famille. » Elle renifle. « Maintenant, il faut décider. Les dragons doivent-ils revenir dans le monde ? Ou retourner dormir dans l'Archipel ? »
- fr: « Qu'ils reviennent. Le monde a besoin de vous. »
- fr: « Qu'ils restent dans l'Archipel, en paix. Le monde ne vous mérite pas encore. »
- fr: « Alors nous reviendrons. » Elle gratte doucement la tête du petit. « Il volera au-dessus des villes, et les enfants lui feront signe. Ce sera bien. »
- fr: « En paix. » Elle hoche la tête, lentement. « Tu as peut-être raison. Mais moi, je resterai avec toi. Il faut bien qu'un dragon surveille les humains. »
- fr: « Il faut lui donner un nom. » Elle vous regarde, très sérieuse. « Un nom de dragon. Long. Avec beaucoup de syllabes. » Le dragonneau éternue. Vous l'appelez Atchoum. Ysoria est scandalisée pendant trois jours.
- fr: Morra — La clé de braise
- fr: Maîtresse Durna a préparé un moule en forme de clé. « Le feu d'un dragon. Plus vieux que les Cendres. » Elle regarde Ysoria, qui croise les bras. « Si madame veut bien. »
- fr: Ysoria regarde Morra, longuement. « Une démone. » Puis elle hausse les épaules. « Une démone qui veut sauver sa petite sœur. Les dragons comprennent ça. » Elle souffle dans la forge.
- fr: La forge devient blanche. Durna frappe, frappe, frappe, en hurlant une chanson naine. Quand elle plonge la clé dans l'eau, la vapeur remplit toute la forge.
- fr: Tendre la clé à Morra.
- fr: "Morra prend la clé dans ses deux mains, comme quelque chose de fragile. Elle ne dit rien pendant longtemps. Puis : « Trois cents ans que personne ne m'a rien donné. » Elle vous regarde. « Je ne sais pas comment on dit merci. Je vais apprendre. »"
