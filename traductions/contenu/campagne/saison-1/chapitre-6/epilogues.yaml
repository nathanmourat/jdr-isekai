# Textes de content/campagne/saison-1/chapitre-6/epilogues.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Épilogue — Printemps 1030
- fr: Printemps 1030. Dix-huit ans après l'Appel, vous marchez dans les rues de Lysmont. Les enfants vous montrent du doigt. Les vieux vous saluent. Les marchands vous font des prix.
- fr: La broche du rang S brille sur votre poitrine. À la Guilde, Dame Rowena a fait accrocher votre portrait au-dessus du tableau des contrats. Les jeunes recrues vous demandent des autographes.
- fr: Sur vos terres, à la lisière de Sylvenoire, les champs ont été replantés. Les miliciens qui ont tenu la porte de Fort-Aube sont rentrés chez eux en héros. On a donné votre nom au moulin.
- fr: Aveline de Castelroc ne vous quitte plus. « Une capitaine a besoin de quelqu'un à protéger », dit-elle. Personne n'est dupe.
- fr: Séraphine vous écrit toutes les semaines, de longues lettres pleines de lois à changer et de dessins dans les marges.
- fr: Kaya débarque sans prévenir, deux fois par mois, avec un contrat « trop facile pour moi toute seule ».
- fr: Elianne passe vous voir chaque dimanche, et vous marchez longtemps, sans rien dire. C'est le meilleur moment de la semaine.
- fr: Nadja vous a réservé une part de la Maison Kesh. « Associé à vie. C'est dans le contrat. Lis les petites lignes. »
- fr: Ilyssë vous envoie chacun de ses livres, dédicacés d'une phrase sarcastique, différente à chaque fois.
- fr: Ysoria atterrit parfois dans votre jardin, au milieu de la nuit, avec le petit Atchoum, pour « vérifier que tout va bien ».
- fr: Morra et Lyss viennent dîner chez vous tous les mois. Morra apporte le pain. Lyss pose mille questions.
- fr: Mais d'abord, il y a eu la porte. Ce mois-là, au sommet de la Citadelle, vous avez regardé longtemps les lumières de votre ancien monde. Puis il a fallu choisir.
- fr: Rester à Velmaris. Ce monde est devenu le vôtre.
- fr: Rentrer chez vous, en promettant de revenir un jour.
- fr: Quand la porte s'est refermée, vous avez senti quelque chose se fermer aussi en vous. Puis s'ouvrir, autrement. Velmaris. Chez vous.
- fr: Vous avez franchi la porte avec un sac, une épée, et une lettre pour chacun de ceux qui restaient. De l'autre côté, il paraît que vous n'aviez pas vieilli d'un jour. Ilyssë dit qu'une porte, ça peut se rouvrir. Un jour. Peut-être en saison 2.
- fr: Le soir tombe sur Lysmont. Quelque part, une auberge allume ses lanternes. Une nouvelle histoire attend. Elle attend toujours.
