- fr: Chapitre 6 — Le Souverain des Cendres
- fr: La porte des Terres Cendrées est ouverte. Au bout de la route, la Citadelle d'Obsidienne, et Orvan, le Souverain, qui vous attend depuis six cents ans.
- fr: Rejoindre l'État-major de Fort-Aube pour franchir la porte (Germinal 1027).
- fr: Approcher du village de Cendrebourg (Brumaire 1027).
- fr: Traverser la Forêt pétrifiée (Solaire 1028).
- fr: Entrer dans la Citadelle d'Obsidienne (Floréal 1029).
- fr: Monter au sommet de la Citadelle et affronter Orvan (Aurore 1029).
- fr: Saison 1 terminée.
- fr: Le dragon gris
- fr: Au Lac de lave, un dragon mort depuis mille ans s'est relevé. Ysoria dit que c'est son arrière-grand-oncle. Elle veut qu'il se repose.
- fr: Écouter Ysoria, à la Tente des Braves.
- fr: Rendre le repos au dragon gris, au Lac de lave.
- fr: Les prêtres oubliés
- fr: Une patrouille a trouvé des robes de l'Ordre, très anciennes, au Col des Soupirs. Leurs propriétaires ne sont jamais rentrés. Ils sont toujours là-bas.
- fr: Écouter la Sergente Valka, au comptoir de la Guilde.
- fr: Monter au Col des Soupirs.
- fr: Faire votre rapport à Valka.
- fr: Les enfants de Cendrebourg
- fr: Les gardes d'obsidienne ont emmené cinq enfants de Cendrebourg vers le Puits de cendre, pour en faire des soldats.
- fr: Écouter Mère Ashka, à Cendrebourg.
- fr: Descendre au Puits de cendre.
- fr: Ramener les enfants à Cendrebourg.
