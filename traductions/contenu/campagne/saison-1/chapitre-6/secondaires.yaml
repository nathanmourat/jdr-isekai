# Textes de content/campagne/saison-1/chapitre-6/secondaires.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Le dragon gris
- fr: Ysoria n'a pas touché à sa soupe. « Au Lac de lave, il y a un dragon mort qui marche. Gris. Les Cendres l'ont relevé. » Elle serre les poings. « Je connais son odeur. C'est Valdrask. Le grand-père de mon grand-père. »
- fr: « Il ne sait plus qui il est. Il souffre. » Elle vous regarde. « Chez les dragons, quand un ancien souffre, c'est la famille qui l'aide à partir. Tu es de la famille. Viens. »
- fr: « Je viens avec toi. »
- fr: Le repos de Valdrask
- fr: Au bord du Lac de lave, un dragon aux ailes trouées se dresse, gris comme la cendre. Ses yeux sont vides. Autour de lui, des ombres du Voile tournent comme des mouches.
- fr: Ysoria s'avance. « Valdrask. C'est moi. Ysoria. » Le dragon gris tourne la tête vers elle. Puis il rugit, et le souffle gris part vers vous.
- fr: Lui rendre le repos.
- fr: Le dragon gris vous repousse… puis s'arrête, au bord du lac. Ysoria s'est mise entre vous et lui, les bras ouverts. Il la regarde longtemps. Il se couche.
- fr: Le dragon gris s'allonge au bord du lac, la tête sur ses pattes. Ses yeux se rallument une seconde, dorés, et il regarde Ysoria. Puis ils s'éteignent, doucement, pour de bon.
- fr: Ysoria pose la main sur son museau. « Dors, grand-père. » Elle ne pleure pas. Les dragons ne pleurent pas devant les autres. Mais elle vous prend la main, et la serre très fort.
- fr: Les prêtres oubliés
- fr: Valka jette sur la table une robe en lambeaux, blanche et or. « L'Ordre. Très vieux modèle. Une patrouille l'a trouvée au Col des Soupirs, avec des dizaines d'autres. Et des voix qui chantent, la nuit. »
- fr: « Les prêtres qui ont abandonné Orvan, il y a six cents ans… On dit qu'ils sont venus le chercher, plus tard. Pour s'excuser, ou pour finir le travail. Ils ne sont jamais rentrés. »
- fr: « Nous irons au Col des Soupirs. »
- fr: Le Col des Soupirs
- fr: Au Col des Soupirs, le vent pleure entre les falaises. Au milieu du passage, des prêtres morts depuis des siècles chantent une prière à l'envers, autour d'un autel de basalte. Des gardes d'obsidienne les protègent.
- fr: Elianne écoute. Elle pâlit. « C'est la prière du pardon. Ils la chantent à l'envers. Ça fait six cents ans qu'ils demandent pardon, et qu'ils le refusent. »
- fr: Interrompre la prière.
- fr: Chanter la prière dans le bon sens, par-dessus la leur. (Esprit, difficulté 36)
- fr: Votre voix monte. Les prêtres s'arrêtent, un par un. Le plus vieux vous regarde, et dans ses orbites vides, quelque chose brille. Puis ils tombent en poussière, et le vent emporte la poussière vers le sud.
- fr: Les gardes d'obsidienne, eux, n'ont pas besoin de pardon.
- fr: Les gardes vous repoussent jusqu'à la sortie du col… mais l'autel se brise tout seul, et les liches s'effondrent. Sans prière, plus rien ne les tient debout.
- fr: "Sur l'autel brisé, un registre de l'Ordre, écrit il y a six siècles. La dernière page dit : « Nous l'avons trahi. Que quelqu'un, un jour, lui dise que nous le regrettions. »"
- fr: Le registre des regrets
- fr: Valka lit la dernière page, et ses oreilles se couchent. « Six cents ans pour écrire une phrase. » Elle vous rend le registre. « Gardez-le. Si vous le voyez, là-haut… Vous savez quoi lui dire. »
- fr: Les enfants de Cendrebourg
- fr: Mère Ashka vous attend à l'entrée du village, appuyée sur son bâton. Elle a l'air d'avoir pris dix ans en une nuit. « Les gardes d'obsidienne sont venus. Ils ont pris cinq enfants. Pour en faire des soldats, au Puits de cendre. »
- fr: « Vous nous avez épargnés. Je n'ai pas le droit de vous demander plus. » Elle baisse la tête. « Je vous le demande quand même. »
- fr: « Nous allons les chercher. »
- fr: Le Puits de cendre
- fr: Au fond du Puits de cendre, une lumière violette. Cinq petits démons, attachés ensemble, regardent des gardes d'obsidienne graver des runes sur des armures trop grandes pour eux.
- fr: Morra ne dit rien. Elle descend la première, sa faux à la main.
- fr: Libérer les enfants.
- fr: Les gardes vous repoussent… mais pendant le combat, le plus grand des enfants a rongé ses liens, puis ceux des autres. Ils grimpent hors du puits comme des chats.
- fr: Le plus petit des enfants vous tire par la manche. « Vous êtes les humains qui n'ont pas brûlé le village ? » Vous hochez la tête. Il réfléchit, très sérieux. « Merci. » Puis il vous donne une petite fleur grise.
- fr: Le retour des enfants
- fr: Tout le village vous attend. Quand les enfants courent vers leurs parents, une clameur monte de Cendrebourg, si forte qu'on l'entend jusqu'au Camp de l'Aube.
- fr: Mère Ashka pose sa main ridée sur votre front, à la manière démone. « Quand cette guerre sera finie, il y aura toujours une place pour vous à Cendrebourg. Toujours. »
