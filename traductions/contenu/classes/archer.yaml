  de: Markierender Pfeil
  ja: 標的の矢
- fr: Dégâts et marque (+15 % de dégâts subis pendant 3 tours).
  en: Damage and mark (+15% damage taken for 3 turns).
  es: Daño y marca (+15 % de daño recibido durante 3 turnos).
  de: Schaden und Markierung (+15 % erlittener Schaden für 3 Runden).
  ja: ダメージとマーク（3ターンの間、被ダメージ+15%）。
