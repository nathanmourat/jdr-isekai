# Textes de content/classes/archer.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Archer spirituel
  en: Spirit Archer
  es: Arquero espiritual
  de: Geisterschütze
  ja: 精霊の射手
- fr: Dégâts (distance)
  en: Damage (ranged)
  es: Daño (distancia)
  de: Schaden (Fernkampf)
  ja: 火力（遠距離）
- fr: Ses flèches portent les esprits des ancêtres.
  en: Their arrows carry the spirits of the ancestors.
  es: Sus flechas llevan los espíritus de los antepasados.
  de: Seine Pfeile tragen die Geister der Ahnen.
  ja: 矢に祖霊を宿す。
- fr: Œil du faucon
  en: Hawk Eye
  es: Ojo de halcón
  de: Falkenauge
  ja: 鷹の目
- fr: Ses attaques simples ont 30 % de chances de marquer la cible ; les cibles marquées subissent +15 % de dégâts de tout le groupe.
  en: Basic attacks have a 30% chance to mark the target; marked targets take +15% damage from the whole group.
  es: Sus ataques básicos tienen un 30 % de probabilidad de marcar al objetivo; los objetivos marcados reciben +15 % de daño de todo el grupo.
  de: Einfache Angriffe markieren das Ziel mit 30 % Chance; markierte Ziele erleiden +15 % Schaden von der ganzen Gruppe.
  ja: 通常攻撃が30%の確率で対象をマークする。マークされた対象はパーティー全員から+15%のダメージを受ける。
- fr: Tireur d'élite
  en: Sharpshooter
  es: Tirador de élite
  de: Scharfschütze
  ja: 狙撃手
- fr: Une cible, perforation.
  en: Single target, piercing.
  es: Un objetivo, perforación.
  de: Ein Ziel, durchschlagend.
  ja: 単体、貫通。
- fr: Chaman des vents
  en: Wind Shaman
  es: Chamán de los vientos
  de: Windschamane
  ja: 風のシャーマン
- fr: Esprits et soutien léger.
  en: Spirits and light support.
  es: Espíritus y apoyo ligero.
  de: Geister und leichte Unterstützung.
  ja: 精霊と軽い支援。
- fr: Pluie des Ancêtres
  en: Rain of the Ancestors
  es: Lluvia de los Antepasados
  de: Regen der Ahnen
  ja: 祖霊の雨
- fr: Pendant 2 tours, une pluie de flèches frappe tous les ennemis à chaque début de tour.
  en: For 2 turns, a rain of arrows strikes all enemies at the start of each turn.
  es: Durante 2 turnos, una lluvia de flechas golpea a todos los enemigos al comienzo de cada turno.
  de: 2 Runden lang trifft zu Beginn jeder Runde ein Pfeilregen alle Gegner.
  ja: 2ターンの間、毎ターン開始時に矢の雨が敵全体を打つ。
- fr: Dégâts réguliers et fiables, depuis la deuxième ligne.
  en: Steady, reliable damage from the second line.
  es: Daño constante y fiable desde la segunda línea.
  de: Gleichmäßiger, zuverlässiger Schaden aus der zweiten Reihe.
  ja: 後列から安定して確実なダメージ。
- fr: Fragile au contact ; peu d'outils défensifs.
  en: Fragile up close; few defensive tools.
  es: Frágil en el cuerpo a cuerpo; pocas herramientas defensivas.
  de: Im Nahkampf zerbrechlich; wenige Verteidigungsmittel.
  ja: 接近戦に弱く、守りの手段が少ない。
- fr: Flèche marquante
  en: Marking Arrow
