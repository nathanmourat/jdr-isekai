  en: The Guardian draws every blow and protects the group.
  es: El Guardián atrae todos los golpes y protege al grupo.
  de: Der Hüter zieht alle Schläge auf sich und schützt die Gruppe.
  ja: ガーディアンがすべての攻撃を引きつけ、パーティーを守る。
- fr: Marteau de l'aube
  en: Hammer of Dawn
  es: Martillo del alba
  de: Hammer der Morgenröte
  ja: 暁の鉄槌
- fr: Un coup sacré qui peut étourdir de peur.
  en: A holy blow that can stun with fear.
  es: Un golpe sagrado que puede aturdir de miedo.
  de: Ein heiliger Schlag, der vor Furcht lähmen kann.
  ja: 恐怖で動きを止めることもある聖なる一撃。
- fr: Colère divine
  en: Divine Wrath
  es: Ira divina
  de: Göttlicher Zorn
  ja: 神の怒り
- fr: La lumière frappe tous les ennemis ; les démons et les morts-vivants la craignent.
  en: The light strikes all enemies; demons and undead fear it.
  es: La luz golpea a todos los enemigos; los demonios y los no muertos la temen.
  de: Das Licht trifft alle Gegner; Dämonen und Untote fürchten es.
  ja: 光が敵全体を打つ。悪魔とアンデッドはこれを恐れる。
- fr: Ultime — Bastion éternel
  en: Ultimate — Eternal Bastion
  es: Definitiva — Bastión eterno
  de: Ultimativ — Ewige Bastion
  ja: 奥義 — 永遠の砦
- fr: "Pendant 2 tours, le groupe est presque intouchable : énorme bouclier, défense et régénération."
  en: "For 2 turns, the group is nearly untouchable: huge shield, defence and regeneration."
  es: "Durante 2 turnos, el grupo es casi intocable: enorme escudo, defensa y regeneración."
  de: "2 Runden lang ist die Gruppe fast unantastbar: riesiger Schild, Verteidigung und Regeneration."
  ja: 2ターンの間、パーティーはほぼ無敵：巨大な盾、防御、再生。
