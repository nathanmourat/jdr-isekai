  en: Pack
  es: Manada
  de: Rudel
  ja: 群れ
- fr: Plusieurs petites invocations.
  en: Several small summons.
  es: Varias invocaciones pequeñas.
  de: Mehrere kleine Beschwörungen.
  ja: 小さな召喚獣を複数。
- fr: Colosse
  en: Colossus
  es: Coloso
  de: Koloss
  ja: 巨像
- fr: Une grosse invocation.
  en: One big summon.
  es: Una invocación grande.
  de: Eine große Beschwörung.
  ja: 大型の召喚獣1体。
- fr: Porte du Bestiaire
  en: Gate of the Bestiary
  es: Puerta del Bestiario
  de: Tor des Bestiariums
  ja: 獣界の門
- fr: Invoque une créature légendaire pendant 3 tours.
  en: Summons a legendary creature for 3 turns.
  es: Invoca a una criatura legendaria durante 3 turnos.
  de: Beschwört 3 Runden lang eine legendäre Kreatur.
  ja: 3ターンの間、伝説の生き物を召喚する。
- fr: Agit plusieurs fois par tour grâce à ses invocations, qui encaissent à sa place.
  en: Acts several times per turn thanks to their summons, which take hits for them.
  es: Actúa varias veces por turno gracias a sus invocaciones, que encajan los golpes por él.
  de: Handelt dank seiner Beschwörungen mehrmals pro Runde, die die Treffer für ihn einstecken.
  ja: 召喚獣のおかげで1ターンに何度も行動でき、攻撃も肩代わりしてもらえる。
- fr: Très faible si ses invocations sont détruites ; vulnérable au silence.
  en: Very weak if their summons are destroyed; vulnerable to silence.
  es: Muy débil si destruyen sus invocaciones; vulnerable al silencio.
  de: Sehr schwach, wenn seine Beschwörungen vernichtet werden; anfällig für Stille.
  ja: 召喚獣を倒されるととても弱い。沈黙に弱い。
- fr: Appel du gardien de pierre
  en: Call of the Stone Guardian
  es: Llamada del guardián de piedra
  de: Ruf des Steinwächters
  ja: 石の守護者の召喚
- fr: Invoque un golem de pierre qui provoque les ennemis pendant 2 tours.
  en: Summons a stone golem that taunts enemies for 2 turns.
  es: Invoca un gólem de piedra que provoca a los enemigos durante 2 turnos.
  de: Beschwört einen Steingolem, der 2 Runden lang die Gegner provoziert.
  ja: 2ターンの間敵を挑発する石のゴーレムを召喚する。
- fr: Échange d'âme
  en: Soul Exchange
  es: Intercambio de alma
