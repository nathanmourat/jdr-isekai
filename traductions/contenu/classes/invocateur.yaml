- fr: Invocateur
  en: Summoner
  es: Invocador
  de: Beschwörer
  ja: 召喚士
- fr: Contrôle / dégâts indirects
  en: Control / indirect damage
  es: Control / daño indirecto
  de: Kontrolle / indirekter Schaden
  ja: 妨害／間接火力
- fr: Il combat entouré de créatures liées à son âme.
  en: Fights surrounded by creatures bound to their soul.
  es: Combate rodeado de criaturas ligadas a su alma.
  de: Kämpft umgeben von Kreaturen, die an seine Seele gebunden sind.
  ja: 魂で結ばれた生き物たちに囲まれて戦う。
- fr: Lien d'âme
