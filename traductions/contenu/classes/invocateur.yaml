  de: Seelenband
  ja: 魂の絆
- fr: Un loup spectral combat à ses côtés en permanence. S'il tombe, il revient au bout de 4 tours.
  en: A spectral wolf permanently fights at their side. If it falls, it returns after 4 turns.
  es: Un lobo espectral combate siempre a su lado. Si cae, vuelve al cabo de 4 turnos.
  de: Ein Geisterwolf kämpft ständig an seiner Seite. Fällt er, kehrt er nach 4 Runden zurück.
  ja: 霊狼が常にそばで戦う。倒れても4ターン後に戻ってくる。
