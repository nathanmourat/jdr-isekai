- fr: Sœur Elianne
- fr: Prêtresse de l'Ordre
- fr: Douce, patiente, mais têtue comme une mule quand il s'agit de justice. Elle rit rarement, et toujours au mauvais moment.
- fr: Orpheline élevée par l'Ordre de la Lumière Sereine. Elle a assisté à l'Appel des héros, et ne s'en est jamais tout à fait remise.
- fr: Découvrir la vérité sur les invocations… et choisir entre sa foi et la vérité.
- fr: « Vous l'avez fait souffrir pour rien. Je ne peux pas pardonner ça. »
- fr: « Vous avez profané les morts. Ils ne vous avaient rien fait. »
