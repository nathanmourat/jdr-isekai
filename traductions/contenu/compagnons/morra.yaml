- fr: Morwenna « Morra »
- fr: Ancienne commandante de la Légion Cendrée
- fr: Humour noir, fierté, tendresse cachée sous trois couches de sarcasme. Découvre le monde des vivants avec méfiance… et une gourmandise surprenante pour le pain chaud.
- fr: Commandante de la Première Légion pendant deux siècles. Le Souverain garde sa petite sœur Lyss enchaînée dans la Citadelle d'Obsidienne pour s'assurer de son obéissance.
- fr: Libérer sa sœur Lyss.
- fr: « Tous les démons, sans distinction ? Les enfants aussi ? » Elle recule. « Je me suis trompée sur toi. »
- fr: « Tu m'as vendue à l'Ordre. » Elle ne crie pas. C'est pire.
- fr: Fauche cendrée
- fr: Un grand cercle de sa faux, qui laisse une traînée d'ombre.
- fr: Marque de la Légion
- fr: Elle connaît les points faibles des soldats cendrés. Et des autres.
- fr: Discipline de la Légion
- fr: +6 % de dégâts pour tout le groupe.
- fr: Connaissance des Cendres
- fr: +6 % de précision pour le groupe.
- fr: Riposte d'ombre
- fr: 25 % de chances de contre-attaquer quand elle est frappée.
- fr: Deux ombres, une lame
- fr: "Attaque combinée avec son héros : +25 % de dégâts."
