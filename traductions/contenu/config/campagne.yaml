- fr: « Asseyez-vous. Respirez. La Lumière fera le reste, et moi un peu aussi. »
  en: “Sit down. Breathe. The Light will do the rest, and so will I, a little.”
  es: «Siéntese. Respire. La Luz hará el resto, y yo un poco también.»
  de: „Setzt Euch. Atmet. Das Licht erledigt den Rest, und ich ein wenig auch.“
  ja: 「座って。深呼吸を。あとは光が——それと私も少しだけ——なんとかします」
- fr: Sœur Elianne pose les mains au-dessus des plaies et murmure une prière. La lumière descend, chaude comme un soleil d'été.
  en: Sister Elianne holds her hands above the wounds and murmurs a prayer. The light comes down, warm as a summer sun.
  es: La hermana Elianne pone las manos sobre las heridas y murmura una oración. La luz desciende, cálida como un sol de verano.
  de: Schwester Elianne hält die Hände über die Wunden und murmelt ein Gebet. Das Licht senkt sich herab, warm wie eine Sommersonne.
  ja: シスター・エリアンヌが傷の上に手をかざし、祈りをささやく。夏の陽のように温かな光が降りてくる。
- fr: « Voilà. Vous voilà {{guéri|guérie}}. Essayez de ne pas vous faire frapper pendant au moins… une semaine. »
  en: “There. You're healed. Try not to get hit for at least… a week.”
  es: «Ya está. Ya está {{curado|curada}}. Intente que no le golpeen durante al menos… una semana.»
  de: „So. Ihr seid geheilt. Versucht, Euch mindestens … eine Woche lang nicht schlagen zu lassen.“
  ja: 「はい、治りました。せめて…一週間は殴られないようにしてくださいね」
- fr: « Celle-ci est plus profonde. Ne bougez pas, ça va piquer. » La lumière se resserre sur la vieille plaie, qui se referme lentement.
  en: “This one's deeper. Don't move, it'll sting.” The light tightens around the old wound, which slowly closes.
  es: «Esta es más profunda. No se mueva, va a escocer.» La luz se ciñe sobre la vieja herida, que se cierra lentamente.
  de: „Die hier ist tiefer. Nicht bewegen, das brennt gleich.“ Das Licht zieht sich um die alte Wunde zusammen, die sich langsam schließt.
  ja: 「こっちは深いですね。動かないで、少ししみますよ」光が古傷に集まり、ゆっくりと塞いでいく。
- fr: « Et cette fois, laissez la cicatrice tranquille. »
  en: “And this time, leave the scar alone.”
  es: «Y esta vez, deje la cicatriz en paz.»
  de: „Und diesmal lasst die Narbe in Ruhe.“
  ja: 「今度こそ、傷跡をいじらないでくださいね」
