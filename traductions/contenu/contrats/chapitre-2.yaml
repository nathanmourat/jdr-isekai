# Textes de content/contrats/chapitre-2.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Nid de scorpions près des puits
- fr: Des scorpions des sables ont fait leur nid sous un puits de caravane.
- fr: Aller aux puits du sud.
- fr: Une odeur âcre monte d'un puits. Des carcasses de rats, vidées de l'intérieur.
- fr: Descendre voir
- fr: Détruire le nid de scorpions.
- fr: Au fond, des dizaines de petits dards s'agitent. Et deux gros scorpions se dressent.
- fr: Revenir au Comptoir de la Guilde.
- fr: Ibrek coche une case dans son registre. « Les caravanes vous remercient. »
- fr: Toucher la récompense
- fr: Escorte vers l'oasis perdue
- fr: Un géographe vulpin veut cartographier l'oasis perdue. Il a besoin de bras… et d'épées.
- fr: Retrouver le géographe à la Porte des Caravanes.
- fr: Le géographe a des instruments partout et aucune gourde. « L'eau ? J'avais oublié l'eau. »
- fr: Lui acheter de l'eau.
- fr: Il vous remercie trois fois et vous promet un pourboire.
- fr: Partager la vôtre.
- fr: Vous serez à court plus vite, mais il vous regarde comme un héros.
- fr: Escorter le géographe jusqu'à l'oasis perdue.
- fr: À mi-chemin, des chacals vous encerclent, attirés par l'odeur des provisions.
- fr: Le géographe a sa carte. Ibrek a son rapport. Et vous, votre paie.
- fr: Pillards sur la route du nord
- fr: Une bande de pillards rançonne les caravanes qui montent vers Aubeclaire.
- fr: Patrouiller sur la Route des Caravanes.
- fr: Des traces de sabots, une roue brisée, un ballot d'étoffes abandonné. Ils ne sont pas loin.
- fr: Tendre un piège avec le ballot comme appât.
- fr: Les pillards mordent à l'hameçon au crépuscule.
- fr: Suivre les traces de sabots.
- fr: Les traces mènent à un vallon où fume un feu de camp.
- fr: Mettre les pillards hors d'état de nuire.
- fr: Les cimeterres sortent des fourreaux.
- fr: Ibrek compte les chèches turquoise que vous posez sur le comptoir. « La route est libre. »
- fr: Les momies du sud
- fr: Des momies de sel ont été vues hors des Ruines. Une caravane a fui en abandonnant sa cargaison.
- fr: Retrouver la cargaison abandonnée.
- fr: Des caisses éventrées dans le sable. Des empreintes de pieds bandés partent vers le sud.
- fr: Suivre les empreintes
- fr: Renvoyer les momies au repos.
- fr: Au creux d'une dune, deux momies montent la garde autour de la cargaison, comme si elle leur appartenait.
- fr: La cargaison est rendue. Ibrek frissonne. « Des momies hors des Ruines… Ce n'est pas normal. »
- fr: Le convoi de cristaux
- fr: Escorter un convoi de cristaux d'éther vers le nord. Bien payé. Peut-être trop bien.
- fr: Prendre le convoi aux mines d'éther.
- fr: Les caisses sont marquées d'une rune violette. Le chef de convoi refuse de dire où elles vont.
- fr: Ouvrir une caisse en douce.
- fr: Des cristaux, emballés dans de la cendre. De la cendre noire, comme à Lysmont, la Nuit des Lanternes.
- fr: Faire le travail sans poser de questions.
- fr: Le chef de convoi hoche la tête, satisfait. Trop satisfait.
- fr: Escorter le convoi vers le nord.
- fr: "À la frontière, les « acheteurs » attendent : des mercenaires de la Concorde, et un mage aux mains violettes. Ils ne veulent pas de témoins."
- fr: Ibrek écoute votre récit, pâle. « Je vais écrire à Dame Rowena. Ce soir. »
