# Textes de content/contrats/chapitre-3.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Loups de brume à la lisière
- fr: Des loups de brume attaquent les bûcherons qui travaillent à la lisière.
- fr: Aller à la lisière de Sylvenoire.
- fr: Des haches abandonnées, des arbres à moitié coupés. Les bûcherons ont fui en laissant tout.
- fr: Attendre la brume
- fr: Repousser les loups de brume.
- fr: La brume monte. Des yeux blancs s'allument.
- fr: Revenir au Relais de la Guilde.
- fr: Orsa note la prime dans son registre. « Les elfes diront que c'est la faute des bûcherons. Ils auront à moitié raison. »
- fr: Toucher la récompense
- fr: Spores dans le marais
- fr: Un cercle de champignons vénéneux s'étend dans le Marais de brume. Il faut le détruire avant les pluies.
- fr: Traverser le Marais de brume.
- fr: L'eau noire arrive aux genoux. Des chapeaux violets dépassent de la brume.
- fr: Avancer avec un linge humide sur le visage.
- fr: Les spores vous piquent les yeux, mais pas les poumons.
- fr: Allumer des torches pour éloigner les spores.
- fr: Les champignons reculent devant le feu. Pour l'instant.
- fr: Détruire le cercle de champignons.
- fr: Au centre du cercle, les plus gros champignons se lèvent sur des pattes de racines.
- fr: Orsa vous tend une serviette. « Vous sentez le marais. Payés quand même. »
- fr: Éclaireurs de la Légion
- fr: Des éclaireurs de la Légion Cendrée ont été vus près du Bois des Feux follets. La Reine paie pour leurs têtes… enfin, pour leur départ.
- fr: Trouver les traces des éclaireurs.
- fr: Des brindilles cassées, des traces de bottes ferrées, une odeur de cendre.
- fr: Les suivre à la trace.
- fr: Les traces mènent à un camp caché sous les fougères.
- fr: Demander aux feux follets.
- fr: Une lumière bleue vous conduit, en dansant, droit vers le camp.
- fr: Chasser les éclaireurs.
- fr: Les éclaireurs se lèvent d'un bond autour du feu.
- fr: Orsa siffle. « Rang C, et déjà des démons. Rowena va être jalouse. »
- fr: Les sylvains fous
- fr: Deux sylvains corrompus barrent la route des caravanes d'Ithrael.
- fr: Aller sur la route des caravanes, près du Vieux-Chêne.
- fr: Des chariots renversés, des racines partout. Les arbres bougent quand on ne les regarde pas.
- fr: Avancer
- fr: Arrêter les sylvains corrompus.
- fr: Deux sylvains aux feuilles violettes se tournent vers vous en grinçant.
- fr: Orsa compte les échardes dans vos manches. « La route est libre. Les elfes vont dire merci. Avec un an de retard. »
