# Textes de content/contrats/chapitre-4.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Nuée sur le Col des Vents
- fr: Des chauves-souris de lave attaquent les caravanes de minerai qui passent le Col des Vents.
- fr: Monter au Col des Vents.
- fr: Le vent hurle entre les pics. Des chariots renversés, du minerai répandu dans la neige, et des traces de brûlure sur les bâches.
- fr: Attendre la nuit
- fr: Chasser la nuée.
- fr: La nuit tombe. Des points rouges s'allument dans le ciel, comme des braises qui volent. Puis ils plongent.
- fr: Revenir au comptoir d'Ardenclume.
- fr: Hjalmi tamponne le contrat d'un coup sec. « Les caravanes repasseront demain. Bon travail. Ne crachez pas par terre en sortant. »
- fr: Toucher la récompense
- fr: Kobolds à la source chaude
- fr: Une bande de kobolds a pris possession de la source chaude où les vieux nains soignent leurs rhumatismes. Les vieux nains sont furieux.
- fr: Aller à la source chaude.
- fr: Des kobolds barbotent dans l'eau fumante, l'air ravi. Sur la rive, des pioches, des seaux, et un panneau en kobold que personne ne sait lire.
- fr: Leur parler d'abord, avec des gestes.
- fr: Les kobolds vous écoutent poliment, puis vous jettent de l'eau chaude au visage.
- fr: Leur faire peur en criant très fort.
- fr: Les kobolds sortent de l'eau, très vexés, et prennent leurs pioches.
- fr: Déloger les kobolds.
- fr: Les kobolds se mettent en rang, pioches levées.
- fr: Hjalmi grogne. « Les vieux vous envoient une tonne de remerciements. Moi, je vous envoie la prime. C'est plus utile. »
- fr: Les pilleurs de l'Île aux épaves
- fr: Une bande de pirates sans pavillon pille les navires échoués sur l'Île aux épaves. Même Corsa la Rouge veut les voir partir.
- fr: Aborder l'Île aux épaves.
- fr: Des navires couchés les uns sur les autres, des mâts comme des forêts mortes. Un feu brûle dans la cale d'un galion.
- fr: Approcher par la plage, à découvert.
- fr: Une vigie vous voit et sonne la cloche. Ils vous attendent.
- fr: Grimper par les mâts couchés.
- fr: Vous tombez du ciel au milieu de leur campement. Effet garanti.
- fr: Chasser les pilleurs.
- fr: « Des héros ! » crie le chef des pilleurs. « Enfin quelqu'un de riche ! »
- fr: Revenir au comptoir de Port-Vérane.
- fr: Marée est vert, comme d'habitude. « Bravo. Euh. Excusez-moi. » Il se penche par-dessus le bastingage. Puis il vous paie.
- fr: Les pontes de la Plage noire
- fr: Les crabes des récifs dévorent les œufs des tortues de feu sur la Plage noire. Sans tortues, plus de lampes à huile à Port-Vérane.
- fr: Aller à la Plage noire.
- fr: Le sable volcanique est chaud sous les pieds. Des nids de tortues, éventrés. Des pinces énormes qui dépassent du sable.
- fr: Creuser près des nids
- fr: Chasser les crabes.
- fr: Le sable se soulève. Les crabes des récifs sortent, pinces grandes ouvertes.
- fr: « Les tortues vous remercient, dit Marée. Enfin, elles ne disent rien. Ce sont des tortues. Mais l'intention y est. »
