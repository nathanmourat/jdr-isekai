# Textes de content/contrats/chapitre-5.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Diablotins sur le chemin de ronde
- fr: Chaque nuit, des nuées de diablotins harcèlent les sentinelles du chemin de ronde. Il faut leur faire passer l'envie.
- fr: Monter la garde sur le chemin de ronde.
- fr: La nuit tombe. Les sentinelles allument les braseros, une par une. Au nord, des points rouges dansent dans le noir.
- fr: Attendre la nuée
- fr: Repousser les diablotins.
- fr: La nuée arrive en ricanant, des fourches plein les mains.
- fr: Revenir au comptoir de Fort-Aube.
- fr: Valka hoche la tête. « Les sentinelles ont dormi deux heures cette nuit. Un luxe. Merci. »
- fr: Toucher la récompense
- fr: La patrouille de la tour de l'est
- fr: Une patrouille de la Légion utilise une vieille tour du Mur comme abri. Il faut la déloger avant qu'elle ne s'y installe.
- fr: Approcher de la tour de guet.
- fr: De la fumée sort des meurtrières. Quelqu'un fait cuire quelque chose qui sent le soufre.
- fr: Enfumer la tour par le bas.
- fr: Les légionnaires sortent en toussant, furieux.
- fr: Monter par l'extérieur, de pierre en pierre.
- fr: Vous tombez sur eux par le toit. Effet de surprise garanti.
- fr: Chasser la patrouille.
- fr: Les légionnaires forment un mur de boucliers.
- fr: « Une tour de moins pour eux, dit Valka. Il en reste quarante-sept. Revenez demain. »
- fr: Tête de la Légion
- fr: Un capitaine de la Légion a installé un camp avancé dans la plaine cendrée. Sans lui, ses troupes reculeront.
- fr: Trouver le camp avancé.
- fr: Des tentes noires, des étendards en os, et une grande tente au centre, gardée.
- fr: S'infiltrer
- fr: Vaincre le capitaine.
- fr: Le capitaine sort de sa tente, son épée à deux mains sur l'épaule. « Enfin, de la distraction. »
- fr: Valka plante une épingle sur la carte, là où était le camp. « Ils ont reculé de deux lieues. Excellent. »
- fr: Le colosse égaré
- fr: Un colosse de siège s'est remis en marche tout seul, près de la Brèche. Personne ne le pousse, mais il avance quand même.
- fr: Aller à la Brèche.
- fr: Le sol tremble à intervalles réguliers. Un pas. Un autre. Le colosse avance vers le Mur, très lentement, les yeux éteints.
- fr: Lui barrer la route
- fr: Arrêter le colosse.
- fr: Ses yeux s'allument quand vous approchez.
- fr: « Les nains veulent les morceaux, dit Valka. Pour faire des enclumes. » Elle sourit. « Vous voyez ? Rien ne se perd. »
