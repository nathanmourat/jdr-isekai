# Textes de content/monde/ambiance.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Belle journée pour la saison, pas vrai ?
- fr: Le pain a encore augmenté. Deux sous de plus, cette semaine.
- fr: Ce sont eux, les Appelés ? Ils ont l'air… normaux.
- fr: On dit que l'Ordre les a fait venir d'un autre monde. Brr.
- fr: Il paraît que le Temple prépare une grande cérémonie.
- fr: La Guilde recrute. Faut juste survivre à l'examen…
- fr: Les nouveaux de la Guilde ont battu le golem d'entraînement, il paraît !
- fr: Personne ne descend dans la Crypte de la Fontaine. Personne de sensé, en tout cas.
- fr: Ils sont revenus de la crypte avec un sceau tout noir. Ça ne me dit rien qui vaille.
- fr: Vivement la Fête des Lanternes !
- fr: Un démon, en pleine fête… J'en fais encore des cauchemars.
- fr: Rentrez vite, la nuit tombe.
- fr: "*bâille* Encore une longue journée demain."
- fr: Circulez. Rien à voir.
- fr: "Ordre du roi : pas d'armes dégainées dans les rues."
- fr: Restez dans la lumière des lanternes, la nuit.
- fr: On a doublé les rondes depuis l'attaque des cultistes.
- fr: Le roi compte sur vous. Faites honneur à la couronne.
- fr: Pommes de la Combe ! Croquantes et sucrées !
- fr: Tissus de Valgrane, la plus belle laine du royaume !
- fr: Épices du Sud, rapportées par la dernière caravane !
- fr: Une potion de soin, aventurier ? Ça peut sauver une vie !
- fr: Que la Lumière Sereine guide vos pas.
- fr: Silence, s'il vous plaît. C'est l'heure de la méditation.
- fr: Qui veut un contrat facile ? Des rats dans ma cave, rien de bien méchant…
- fr: Rang C à vingt ans ! Moi, à vingt ans, je trayais des chèvres.
- fr: Bram ! Une autre chope !
- fr: Le marchand d'os de saint ? Arnaque, je vous dis.
- fr: Bien fait pour Orlan. Vendre des os de poulet comme reliques…
- fr: Le colporteur aux os de saint ? Parti vers d'autres marchés. Il a laissé une ardoise de trois bières chez Bram.
- fr: 🎵 Au bord de la Fontaine, j'ai perdu ma chopine… 🎵
- fr: Encore des loups cette nuit… Gareth a perdu trois moutons.
- fr: Plus un hurlement depuis que les aventuriers sont passés. Merci à eux !
- fr: Encore quelqu'un a disparu dans les ruelles. On n'ose plus sortir le soir.
- fr: La petite Lina est rentrée saine et sauve. Quel soulagement !
- fr: Le tournoi des écuyers, ça, c'est du spectacle !
- fr: La cour reçoit sur rendez-vous. Ou sur convocation du roi.
- fr: Quelle chaleur… Même les chameaux se plaignent.
- fr: Cristaux d'éther ! Contre la fatigue, contre la tristesse, contre tout !
- fr: La Concorde fixe les prix, et nous, on paie.
- fr: Les Lunecroc ont perdu leurs terres pour les mines. Pauvres gens.
- fr: Les loups du désert ont repris une part des mines ! On n'avait jamais vu ça.
- fr: La princesse est sous bonne garde. On ne la touchera pas deux fois.
- fr: Un banquet à la Résidence d'Aubeclaire, en Ardent ! Tout le monde y sera.
- fr: On dit que les Appelés sont revenus vivants des Ruines de Sel. Personne ne revient des Ruines.
- fr: L'eau de l'Oasis Bleue est revenue. Mère Ziyane offre la tournée !
- fr: La nuit, le désert est froid comme une tombe. Gardez une couverture.
- fr: Des humains, à Ithrael… La Reine devient bien patiente.
- fr: Ce sont eux qui ont défendu la Clairière pendant la Nuitlongue.
- fr: Une graine contre une chanson ! Une bonne chanson, hein.
- fr: Ilyssë Vaëlnor est revenue… On dit que la Reine lui a pardonné.
- fr: Ne suivez jamais les lumières bleues. Jamais.
- fr: La Légion rôde sous les arbres. Gardez votre arc à portée de main.
- fr: La nuit, les arbres chantent. Écoutez bien.
- fr: Des humains à Ardenclume. Qu'ils essuient leurs bottes.
- fr: Ce sont eux qui sont descendus jusqu'au fond des Mille Marches. Respect.
- fr: Une lame d'Ardenclume, c'est pour la vie ! La vôtre, de préférence.
- fr: Le feu de la Grande Forge est tiède… Mauvais présage.
- fr: Encore une chanson ! La quarante-septième ! On ne compte qu'à partir de trois !
- fr: On dit que Grumli laisse un tonneau aux kobolds, chaque mois. Drôle d'époque.
- fr: La nuit, les marteaux ne s'arrêtent jamais. On s'y habitue. Ou pas.
- fr: Le rhum des Brumes guérit tout. Sauf la soif.
- fr: Corsa la Rouge a perdu sa jambe contre un requin. Ou un dragon. Ça dépend du jour.
- fr: Une dragonne d'or a survolé le port ! J'en ai lâché mon filet.
- fr: Le Phare noyé s'est encore allumé hier soir. Restez loin de cette lumière verte.
- fr: Le petit Tobby est rentré du Phare ! Le vieux Brann n'a jamais été aussi gentil.
- fr: Tout ce que la mer rapporte ! Ne demandez pas d'où ça vient.
- fr: La brume monte la nuit. Les cloches des navires sonnent toutes seules.
- fr: Quarante mille, qu'ils disent. On verra bien combien rentrent chez eux.
- fr: Le Mur a une brèche, mais nous, on est toujours debout.
- fr: La soupe de Mère Brisac, c'est la seule chose qui ne change pas dans cette guerre.
- fr: La Maréchale ne dort jamais. On dit qu'elle se repose en regardant les cartes.
- fr: Ils ont gravé le nom de la Maréchale sur la porte. Elle l'a tenue jusqu'au bout.
- fr: Chaque armure a un nom ! Celle-ci, c'est Berthe. Elle a sauvé six soldats.
- fr: Un dragon dort sur la colline. Il ronfle. Personne n'ose le réveiller.
- fr: Ce sont eux, les rangs S ! J'ai vu l'épreuve. Incroyable.
- fr: La nuit, on voit les feux de la Légion, au nord. Des milliers.
- fr: Il ne fait jamais nuit, ici. Le ciel reste couleur de braise. On dort mal.
- fr: Mère Brisac a suivi l'armée jusqu'ici. Rien ne l'arrête. Même pas les Cendres.
- fr: De l'obsidienne gratuite partout ! Le paradis des forgerons !
- fr: Les enfants démons de Cendrebourg sont venus voir les dragons. Ils n'ont pas peur, eux.
- fr: La Citadelle… On dit que sa porte a toujours été ouverte. Ça fait encore plus peur.
- fr: C'est fini. C'est vraiment fini. Le ciel est bleu, au-dessus des Cendres.
- fr: Des ambassadeurs démons, au camp ! Et personne ne sort l'épée. Drôle d'époque.
- fr: Ma grand-mère disait que la Fête des Lanternes était pour la Passeuse, celle qui porte la lanterne des morts. Avant que l'Ordre ne la reprenne.
- fr: Les caravaniers jurent par Tharvos, le Cœur-Battant. Moi, je jure par mes bottes.
- fr: Douze dieux, et pas un pour m'aider à payer mon loyer.
- fr: Trois dés, dont un sans face… Fenna-aux-Dés me boude, ce soir.
- fr: "Saint Aldebrand, le Premier Appelé… Drôle de saint : personne ne connaît son visage."
- fr: Pourquoi « Temple du Seuil » ? Plus personne ne s'en souvient. Une vieille histoire de porte, je crois.
- fr: Les Douze servent la Lumière. Priez-les si vous voulez, mais remerciez la Lumière.
- fr: Un contrat signé devant la Rose des Vents, c'est sacré. Même Oraëlle n'y trouverait rien à redire.
