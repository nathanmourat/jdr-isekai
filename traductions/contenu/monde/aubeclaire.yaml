- fr: Une grille soulevée derrière la fontaine, un escalier glissant, une odeur tenace.
- fr: Marché de Lysmont
- fr: Des étals serrés, des cris, et deux marchands qui en viennent presque aux mains.
- fr: Tannerie abandonnée
- fr: Volets cloués, cuves à sec… et une trappe de cave qui a servi récemment.
