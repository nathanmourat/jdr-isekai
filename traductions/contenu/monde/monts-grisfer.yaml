# Textes de content/monde/monts-grisfer.yaml
# Outil : npm run traductions:extraire (ne retire jamais une traduction). Voir scripts/traductions.ts.
- fr: Monts Grisfer
- fr: Montagnes, mines et forges volcaniques. Les nains d'Ardenclume y gardent leurs secrets… et leurs registres.
- fr: Ardenclume
- fr: La cité-forge des nains, creusée dans la montagne. On y entend battre les marteaux jour et nuit.
- fr: Porte d'Ardenclume
- fr: Une porte de bronze haute comme dix hommes, gravée de runes et de visages de rois.
- fr: Salle du Haut-Forgeron
- fr: Une salle immense taillée dans la roche, éclairée par des rivières de lave domptées.
- fr: La Grande Forge
- fr: La forge la plus chaude du monde. Les armes qui en sortent ne rouillent jamais.
- fr: La Chope Ardente
- fr: "Une taverne naine : tables de pierre, chopes de bronze, et des chansons qui durent toute la nuit."
- fr: Comptoir de la Guilde (Ardenclume)
- fr: Un comptoir de pierre où une naine borgne tient les contrats d'une main de fer.
- fr: Les Mille Marches
- fr: "Un escalier qui s'enfonce dans la montagne : une marche par étage, mille étages. Personne n'est jamais arrivé en bas… sauf les rois."
- fr: Mines profondes
- fr: Les galeries abandonnées des anciens nains, où les kobolds ont fait leur nid.
- fr: Coulée de lave
- fr: Une rivière de feu qui descend lentement de la montagne. Les salamandres y prennent leur bain.
- fr: Col des Vents
- fr: Un passage étroit entre deux pics, où le vent hurle comme une bête.
- fr: Source chaude
- fr: Une source fumante au creux de la roche, où les nains viennent soigner leurs vieux os.
