  en: Burly, dark-skinned, brown beard, leather apron, a ledger in hand, a stern look. Nothing leaves the stores without his signature.
  es: Fornido, piel morena, barba castaña, delantal de cuero, un registro en la mano, aire severo. Nada sale de la reserva sin su firma.
  de: Kräftig, dunkle Haut, brauner Bart, Lederschürze, ein Register in der Hand, strenge Miene. Nichts verlässt das Lager ohne seine Unterschrift.
  ja: がっしりした褐色の肌の男。茶色の髭、革の前掛け、手には帳簿、厳しい顔つき。署名なしでは何ひとつ倉庫から出さない。
