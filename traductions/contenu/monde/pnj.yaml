- fr: Petite femme vive aux lunettes rondes, tablier plein de poches, boulier à la main, compte plus vite que lui.
  en: A lively little woman with round glasses, an apron full of pockets, an abacus in hand — and she counts faster than it does.
  es: Mujercita vivaz de gafas redondas, delantal lleno de bolsillos, ábaco en mano, que cuenta más rápido que él.
  de: Eine flinke kleine Frau mit runder Brille, einer Schürze voller Taschen und einem Abakus in der Hand — sie rechnet schneller als er.
  ja: 丸眼鏡の小柄で快活な女性。ポケットだらけの前掛け、手には算盤——算盤より速く計算する。
- fr: Bienvenue au Comptoir ! Regardez tout, touchez peu, et payez comptant.
  en: Welcome to the Counter! Look at everything, touch little, and pay cash.
  es: ¡Bienvenidos al Mostrador! Mirad todo, tocad poco y pagad al contado.
  de: Willkommen im Kontor! Alles ansehen, wenig anfassen und bar bezahlen.
  ja: いらっしゃい！よく見て、あまり触らず、お代は現金でね。
