- fr: Cheveux noirs au carré sous un voile clair, chapelet de perles bleues. Douce, patiente, têtue quand il s'agit de justice.
  en: Black bobbed hair under a pale veil, a rosary of blue beads. Gentle, patient, stubborn when it comes to justice.
  es: Melena negra bajo un velo claro, rosario de cuentas azules. Dulce, paciente, terca cuando se trata de justicia.
  de: Schwarzer Bob unter einem hellen Schleier, ein Rosenkranz aus blauen Perlen. Sanft, geduldig, stur, wenn es um Gerechtigkeit geht.
  ja: 淡いヴェールの下に黒髪のボブ、青い数珠。穏やかで辛抱強く、正義のことになると頑固。
- fr: Que la Lumière vous garde. Le Temple vend peu de choses, mais elles soignent.
