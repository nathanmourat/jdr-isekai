- fr: "Moustache noire, bagues à tous les doigts, lunettes cerclées d'or, manteau violet et or : il reconnaît une fausse pièce au premier coup d'œil."
  en: "Black moustache, rings on every finger, gold-rimmed spectacles, a purple and gold coat: he spots a fake at first glance."
  es: "Bigote negro, anillos en todos los dedos, gafas con montura dorada, abrigo violeta y oro: reconoce una falsificación a la primera."
  de: "Schwarzer Schnurrbart, Ringe an allen Fingern, goldgefasste Brille, violett-goldener Mantel: Er erkennt eine Fälschung auf den ersten Blick."
  ja: 黒い口髭、全部の指に指輪、金縁眼鏡、紫と金の外套。偽物は一目で見抜く。
- fr: Un objet dont vous ignorez tout ? Dix pièces, et je vous dis ce qu'il vaut vraiment.
  en: An item you know nothing about? Ten coins, and I'll tell you what it's really worth.
  es: ¿Un objeto del que no sabéis nada? Diez monedas y os digo lo que vale de verdad.
  de: Ein Gegenstand, über den ihr nichts wisst? Zehn Münzen, und ich sage euch, was er wirklich wert ist.
  ja: 正体のわからない品かね？十枚で、本当の値打ちを教えてやろう。
