  es: Que la Luz os guarde. El Templo vende pocas cosas, pero curan.
  de: Möge das Licht euch behüten. Der Tempel verkauft wenig, aber was er verkauft, heilt.
  ja: 光のご加護を。神殿の品は少ないけれど、どれも傷を癒やします。
