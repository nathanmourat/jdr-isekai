- fr: Petit homme rond aux joues rouges, chapeau à larges bords couvert de breloques, gilet moutarde rapiécé, énorme sacoche en bandoulière, sourire de vendeur.
  en: A small round man with red cheeks, a wide-brimmed hat covered in trinkets, a patched mustard waistcoat, a huge satchel across his body, a salesman's smile.
  es: Hombrecillo regordete de mejillas rojas, sombrero de ala ancha lleno de baratijas, chaleco mostaza remendado, enorme bolsa en bandolera, sonrisa de vendedor.
  de: Ein kleiner rundlicher Mann mit roten Wangen, ein breitkrempiger Hut voller Anhänger, eine geflickte senfgelbe Weste, eine riesige Umhängetasche, ein Verkäuferlächeln.
  ja: 赤ら顔の小太りの男。小物だらけのつば広帽子、つぎはぎの芥子色のベスト、大きな肩掛け鞄、商売人の笑み。
