  es: <b>{esc}</b> — {age} años · nivel {niveau} · {or} de oro
  de: <b>{esc}</b> — {age} Jahre · Level {niveau} · {or} Gold
  ja: <b>{esc}</b> — {age}歳 · レベル{niveau} · {or}G
- fr: <b>La saison 1 est terminée.</b> Vous pouvez continuer à parcourir Velmaris, finir vos contrats et vos quêtes de compagnes.
  en: <b>Season 1 is over.</b> You can keep exploring Velmaris, finish your contracts and your companion quests.
  es: <b>La temporada 1 ha terminado.</b> Podéis seguir recorriendo Velmaris, terminar vuestros contratos y las misiones de vuestras compañeras.
  de: <b>Staffel 1 ist vorbei.</b> Ihr könnt Velmaris weiter erkunden und eure Aufträge und Gefährtenquests abschließen.
  ja: <b>シーズン1は終わった。</b>ヴェルマリスの探索や、依頼・仲間クエストの続きを楽しめる。
- fr: "La saison 2 arrivera dans une prochaine mise à jour : la sauvegarde sera reprise, et la fin obtenue décidera de son point de départ."
  en: "Season 2 will arrive in a future update: your save will carry over, and the ending you reached will decide its starting point."
  es: "La temporada 2 llegará en una próxima actualización: se conservará la partida guardada y el final obtenido decidirá su punto de partida."
  de: "Staffel 2 kommt mit einem künftigen Update: Der Spielstand wird übernommen, und das erreichte Ende bestimmt den Ausgangspunkt."
  ja: シーズン2は今後のアップデートで登場予定。セーブは引き継がれ、迎えたエンディングが始まりを決める。
- fr: "<b>Un long moment va passer.</b> Quand tout le monde est prêt, retrouvez-vous dans une auberge et utilisez le lit : le groupe dormira jusqu'au début du chapitre suivant."
  en: "<b>A long time is about to pass.</b> When everyone is ready, meet at an inn and use the bed: the group will sleep until the start of the next chapter."
  es: "<b>Va a pasar mucho tiempo.</b> Cuando todos estén listos, reuníos en una posada y usad la cama: el grupo dormirá hasta el inicio del capítulo siguiente."
  de: "<b>Es wird viel Zeit vergehen.</b> Wenn alle bereit sind, trefft euch in einem Gasthaus und benutzt das Bett: Die Gruppe schläft bis zum Beginn des nächsten Kapitels."
  ja: <b>長い時が流れようとしている。</b>全員の準備ができたら宿屋に集まりベッドを使おう。パーティーは次の章の始まりまで眠る。
- fr: "Chapitre {v} : « {v2} »."
  en: "Chapter {v}: “{v2}”."
  es: "Capítulo {v}: «{v2}»."
  de: "Kapitel {v}: „{v2}“."
  ja: 第{v}章：「{v2}」
- fr: Masquer les conseils
  en: Hide tips
  es: Ocultar los consejos
  de: Tipps ausblenden
  ja: ヒントを隠す
- fr: "⚔ <b>Combat au tour par tour</b> : à ton tour, choisis « Attaquer » ou une compétence, puis clique sur un ennemi (contour doré). « Conseils » propose une bonne action."
  en: "⚔ <b>Turn-based combat</b>: on your turn, choose “Attack” or a skill, then click an enemy (golden outline). “Tips” suggests a good move."
  es: "⚔ <b>Combate por turnos</b>: en tu turno, elige «Atacar» o una habilidad y luego haz clic en un enemigo (contorno dorado). «Consejos» propone una buena acción."
  de: "⚔ <b>Rundenbasierter Kampf</b>: Wähle in deinem Zug „Angreifen“ oder eine Fähigkeit und klicke dann auf einen Gegner (goldener Umriss). „Tipps“ schlägt eine gute Aktion vor."
  ja: ⚔ <b>ターン制バトル</b>：自分の番に「攻撃」かスキルを選び、敵（金色の輪郭）をクリック。「ヒント」が良い行動を提案してくれる。
- fr: 💬 Lis les répliques avec « Continuer », puis choisis une réponse. À plusieurs, chacun vote et la majorité l'emporte.
  en: 💬 Read the lines with “Continue”, then choose an answer. In a group, everyone votes and the majority wins.
  es: 💬 Lee las réplicas con «Continuar» y luego elige una respuesta. En grupo, cada uno vota y gana la mayoría.
  de: 💬 Lies die Dialoge mit „Weiter“ und wähle dann eine Antwort. In der Gruppe stimmt jeder ab, und die Mehrheit entscheidet.
  ja: 💬 「続ける」でセリフを読み、返事を選ぼう。パーティーでは全員が投票し、多数決で決まる。
- fr: "🕯 Avance avec ton avatar : les événements (coffres, pièges, monstres) se déclenchent sous les pieds du meneur, marqué par la lueur dorée."
  en: "🕯 Move with your avatar: events (chests, traps, monsters) trigger under the leader's feet, marked by the golden glow."
  es: "🕯 Avanza con tu avatar: los eventos (cofres, trampas, monstruos) se activan bajo los pies del líder, marcado por el brillo dorado."
  de: "🕯 Bewege dich mit deinem Avatar: Ereignisse (Truhen, Fallen, Monster) lösen unter den Füßen des Anführers aus, den das goldene Leuchten markiert."
  ja: 🕯 アバターで進もう。イベント（宝箱・罠・モンスター）は金色に光るリーダーの足元で起こる。
- fr: 🗨 C'est ici ! Approche-toi du personnage marqué d'un <b>« ! » doré</b> et appuie sur <b>E</b> pour lui parler.
  en: 🗨 This is the place! Walk up to the character marked with a <b>golden “!”</b> and press <b>E</b> to talk.
  es: 🗨 ¡Es aquí! Acércate al personaje marcado con un <b>«!» dorado</b> y pulsa <b>E</b> para hablarle.
  de: 🗨 Hier ist es! Geh zu der Figur mit dem <b>goldenen „!“</b> und drück <b>E</b>, um mit ihr zu sprechen.
  ja: 🗨 ここだ！<b>金色の「！」</b>が付いたキャラクターに近づいて<b>E</b>で話しかけよう。
- fr: "🚪 Ce n'est pas ici : sors par la porte (touche <b>E</b>), puis suis la flèche dorée jusqu'à <b>{nomCible}</b>."
  en: "🚪 Not here: go out the door (<b>E</b> key), then follow the golden arrow to <b>{nomCible}</b>."
  es: "🚪 No es aquí: sal por la puerta (tecla <b>E</b>) y sigue la flecha dorada hasta <b>{nomCible}</b>."
  de: "🚪 Nicht hier: Geh durch die Tür hinaus (Taste <b>E</b>) und folge dann dem goldenen Pfeil bis <b>{nomCible}</b>."
  ja: 🚪 ここではない。ドアから出て（<b>E</b>キー）、金色の矢印をたどって<b>{nomCible}</b>へ。
- fr: "🎯 Objectif : <b>{objectif}</b>. L'histoire attend : va dormir au <b>Chaudron Fêlé</b> (la taverne) pour faire passer le temps."
  en: "🎯 Objective: <b>{objectif}</b>. The story is waiting: go sleep at the <b>Cracked Cauldron</b> (the tavern) to let time pass."
  es: "🎯 Objetivo: <b>{objectif}</b>. La historia espera: ve a dormir al <b>Caldero Rajado</b> (la taberna) para que pase el tiempo."
  de: "🎯 Ziel: <b>{objectif}</b>. Die Geschichte wartet: Schlaf im <b>Gesprungenen Kessel</b> (der Taverne), damit Zeit vergeht."
  ja: 🎯 目標：<b>{objectif}</b>。物語は時を待っている。<b>ひび割れ釜亭</b>（酒場）で眠って時間を進めよう。
- fr: |-
    
    Astuce : le menu <b>👥 Groupe</b> permet de jouer à plusieurs.
  en: |-
    
    Tip: the <b>👥 Group</b> menu lets you play with others.
  es: |-
    
    Consejo: el menú <b>👥 Grupo</b> permite jugar con otros.
  de: |-
    
    Tipp: Über das Menü <b>👥 Gruppe</b> kannst du mit anderen spielen.
  ja: |-
    
    ヒント：<b>👥 パーティー</b>メニューで他の人と遊べる。
- fr: "🎯 Objectif : <b>{objectif}</b>. Suis la <b>flèche dorée</b> jusqu'à <b>{nomCible}</b>, puis appuie sur <b>E</b> devant la porte. (Le bouton « Guider » de la barre du haut montre aussi le chemin.){astuce}"
  en: "🎯 Objective: <b>{objectif}</b>. Follow the <b>golden arrow</b> to <b>{nomCible}</b>, then press <b>E</b> at the door. (The “Guide me” button in the top bar also shows the way.){astuce}"
  es: "🎯 Objetivo: <b>{objectif}</b>. Sigue la <b>flecha dorada</b> hasta <b>{nomCible}</b> y pulsa <b>E</b> delante de la puerta. (El botón «Guiarme» de la barra superior también muestra el camino.){astuce}"
  de: "🎯 Ziel: <b>{objectif}</b>. Folge dem <b>goldenen Pfeil</b> bis <b>{nomCible}</b> und drück dann <b>E</b> an der Tür. (Die Schaltfläche „Führen“ oben zeigt ebenfalls den Weg.){astuce}"
  ja: 🎯 目標：<b>{objectif}</b>。<b>金色の矢印</b>をたどって<b>{nomCible}</b>へ行き、ドアの前で<b>E</b>を押そう。（上部バーの「案内」ボタンでも道がわかる）{astuce}
