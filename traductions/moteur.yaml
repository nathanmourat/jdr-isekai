  es: aumenta el daño de los hechizos y habilidades que usan la Inteligencia (+5 % por punto).
  de: erhöht den Schaden von Zaubern und Fähigkeiten, die Intelligenz nutzen (+5 % pro Punkt).
  ja: 知力を使う呪文とスキルのダメージが上がる（1ポイントにつき+5%）。
