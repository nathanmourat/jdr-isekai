  es: da «presencia» en combate (±1 % de daño infligido y recibido por punto por encima o por debajo de 10) y ayuda en los diálogos y el comercio.
  de: verleiht im Kampf „Präsenz“ (±1 % verursachter und erlittener Schaden pro Punkt über oder unter 10) und hilft in Gesprächen und beim Handel.
  ja: 戦闘での「存在感」（10を超える・下回る1ポイントごとに与ダメージと被ダメージが±1%）を与え、会話や取引にも役立つ。
