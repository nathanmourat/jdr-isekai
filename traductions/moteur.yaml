- fr: Commence chaque combat avec 1 charge de rune.
  en: Starts each fight with 1 rune charge.
  es: Empieza cada combate con 1 carga de runa.
  de: Beginnt jeden Kampf mit 1 Runenladung.
  ja: 各戦闘をルーンのチャージ1で開始する。
- fr: Les sorts de zone coûtent 15 % de mana en moins.
  en: Area spells cost 15% less mana.
  es: Los hechizos de área cuestan un 15 % menos de maná.
  de: Flächenzauber kosten 15 % weniger Mana.
  ja: 範囲呪文のマナ消費が15%減る。
- fr: Les invocations commencent le combat avec 20 % de PV en plus.
  en: Summons start the fight with 20% more HP.
  es: Las invocaciones empiezan el combate con un 20 % más de PV.
  de: Beschwörungen beginnen den Kampf mit 20 % mehr LP.
  ja: 召喚獣はHP+20%で戦闘を始める。
- fr: La première attaque du combat est toujours un coup critique.
  en: The first attack of the fight is always a critical hit.
  es: El primer ataque del combate siempre es un golpe crítico.
  de: Der erste Angriff des Kampfes ist immer ein kritischer Treffer.
  ja: 戦闘の最初の攻撃は必ずクリティカルになる。
- fr: Le héros subit 10 % de dégâts en moins.
  en: The hero takes 10% less damage.
  es: El héroe recibe un 10 % menos de daño.
  de: Der Held erleidet 10 % weniger Schaden.
  ja: ヒーローの被ダメージが10%減る。
- fr: Les objets de soin et les bombes sont 25 % plus efficaces.
  en: Healing items and bombs are 25% more effective.
  es: Los objetos de curación y las bombas son un 25 % más eficaces.
  de: Heilgegenstände und Bomben sind 25 % wirksamer.
  ja: 回復アイテムと爆弾の効果が25%上がる。
- fr: L'attaque touche toujours, même un ennemi caché.
  en: The attack always hits, even a hidden enemy.
  es: El ataque siempre acierta, incluso a un enemigo escondido.
  de: Der Angriff trifft immer, selbst einen versteckten Gegner.
  ja: 攻撃は必ず当たる。隠れた敵にも。
- fr: Les soins du héros rendent 15 % de PV en plus.
  en: The hero's heals restore 15% more HP.
  es: Las curaciones del héroe devuelven un 15 % más de PV.
  de: Die Heilungen des Helden stellen 15 % mehr LP wieder her.
  ja: ヒーローの回復量が15%増える。
- fr: Sang de dragon donne son plein effet dès 50 % de PV.
  en: Dragon Blood takes full effect from 50% HP.
  es: Sangre de dragón surte pleno efecto desde el 50 % de PV.
  de: Drachenblut wirkt schon ab 50 % LP voll.
  ja: 「竜の血」がHP50%から最大効果を発揮する。
- fr: Refrain dure 1 tour de plus.
  en: Refrain lasts 1 more turn.
  es: Estribillo dura 1 turno más.
  de: Refrain hält 1 Runde länger.
  ja: 「リフレイン」の持続が1ターン延びる。
- fr: Une fois par combat, relève un allié K.O. avec 30 % de ses PV.
  en: Once per fight, revives a KO'd ally with 30% of their HP.
  es: Una vez por combate, levanta a un aliado K.O. con el 30 % de sus PV.
  de: Einmal pro Kampf richtet es einen K.-o.-Verbündeten mit 30 % seiner LP wieder auf.
  ja: 戦闘ごとに1回、戦闘不能の味方をHP30%で蘇生する。
- fr: Chaque ennemi vaincu par le porteur lui rend 10 % de ses PV max.
  en: Each enemy defeated by the wearer restores 10% of their max HP.
  es: Cada enemigo vencido por el portador le devuelve un 10 % de sus PV máx.
  de: Jeder vom Träger besiegte Gegner stellt 10 % seiner max. LP wieder her.
  ja: 装備者が敵を倒すたび、最大HPの10%を回復する。
- fr: Les coups critiques infligent × 2 au lieu de × 1,5.
  en: Critical hits deal × 2 instead of × 1.5.
  es: Los golpes críticos infligen × 2 en lugar de × 1,5.
  de: Kritische Treffer verursachen × 2 statt × 1,5.
  ja: クリティカルのダメージが×1.5ではなく×2になる。
