- fr: augmente les dégâts des attaques et des compétences de corps à corps qui utilisent la Force (+5 % par point).
  en: increases the damage of melee attacks and skills that use Strength (+5% per point).
  es: aumenta el daño de los ataques y habilidades cuerpo a cuerpo que usan la Fuerza (+5 % por punto).
  de: erhöht den Schaden von Nahkampfangriffen und -fähigkeiten, die Stärke nutzen (+5 % pro Punkt).
  ja: 筋力を使う近接攻撃とスキルのダメージが上がる（1ポイントにつき+5%）。
- fr: Agilité
  en: Agility
  es: Agilidad
  de: Geschick
  ja: 敏捷
- fr: fait agir plus tôt, toucher plus souvent (+2 % par point d'écart avec la cible), esquiver, et réussir plus de coups critiques (+0,5 % par point).
  en: lets you act sooner, hit more often (+2% per point of difference with the target), dodge, and land more critical hits (+0.5% per point).
  es: hace actuar antes, acertar más (+2 % por punto de diferencia con el objetivo), esquivar y lograr más golpes críticos (+0,5 % por punto).
  de: lässt dich früher handeln, öfter treffen (+2 % pro Punkt Unterschied zum Ziel), ausweichen und mehr kritische Treffer landen (+0,5 % pro Punkt).
  ja: 早く行動でき、命中しやすくなり（対象との差1ポイントにつき+2%）、回避とクリティカルも増える（1ポイントにつき+0.5%）。
