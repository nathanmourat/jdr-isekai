  es: da maná (+3 por punto), lo hace volver más rápido, refuerza las curaciones y reduce el daño mágico recibido.
  de: gibt Mana (+3 pro Punkt), lässt es schneller zurückkehren, verstärkt Heilungen und verringert erlittenen magischen Schaden.
  ja: マナが増え（1ポイントにつき+3）、回復が早まり、回復量が上がり、魔法ダメージを軽減する。
