- fr: Bienvenue chez nous ! Essuyez vos bottes, s'il vous plaît.
  en: Welcome to our home! Please wipe your boots.
  es: ¡Bienvenidos a casa! Limpiaos las botas, por favor.
  de: Willkommen bei uns! Bitte die Stiefel abtreten.
  ja: ようこそ！ブーツの泥は落としてね。
- fr: Mon fils dit qu'il veut devenir aventurier, comme vous. J'en dors mal.
  en: My son says he wants to become an adventurer, like you. I can barely sleep.
  es: Mi hijo dice que quiere ser aventurero, como vosotros. No pego ojo.
  de: Mein Sohn sagt, er will Abenteurer werden, wie ihr. Ich kann kaum noch schlafen.
  ja: 息子があなたたちみたいな冒険者になりたいって言うのよ。心配で眠れないわ。
- fr: On raconte que des Appelés sont arrivés au Temple. C'est vous ?
  en: They say some Summoned arrived at the Temple. Is that you?
  es: Dicen que unos Llamados llegaron al Templo. ¿Sois vosotros?
  de: Man sagt, im Tempel seien Gerufene angekommen. Seid ihr das?
  ja: 神殿に召喚者が現れたって噂だけど、あなたたちのこと？
- fr: La soupe est sur le feu. Il y en a assez pour un héros affamé.
  en: The soup is on the fire. There's enough for a hungry hero.
  es: La sopa está al fuego. Hay suficiente para un héroe hambriento.
  de: Die Suppe steht auf dem Feuer. Es reicht für einen hungrigen Helden.
  ja: スープを火にかけてるよ。お腹をすかせたヒーローの分もある。
- fr: Le pain sort du four ! Le premier est pour les héros.
  en: Bread's out of the oven! The first loaf is for the heroes.
  es: ¡El pan sale del horno! El primero es para los héroes.
  de: Das Brot kommt aus dem Ofen! Das erste ist für die Helden.
  ja: パンが焼けたよ！最初の一つはヒーローに。
- fr: Levée à quatre heures, comme tous les matins depuis trente ans.
  en: Up at four, like every morning for thirty years.
  es: En pie a las cuatro, como todas las mañanas desde hace treinta años.
  de: Um vier aufgestanden, wie jeden Morgen seit dreißig Jahren.
  ja: 三十年、毎朝四時起きさ。
- fr: Goûtez-moi cette brioche aux pommes. Spécialité de Lysmont !
  en: Taste this apple brioche. A Lysmont speciality!
  es: Pruebe este brioche de manzana. ¡Especialidad de Lysmont!
  de: Probiert mal diese Apfelbrioche. Eine Spezialität aus Lysmont!
  ja: このリンゴのブリオッシュを食べてみて。リスモン名物だよ！
- fr: Une lame bien aiguisée vaut mieux qu'un long discours.
  en: A well-honed blade is worth more than a long speech.
  es: Una hoja bien afilada vale más que un largo discurso.
  de: Eine gut geschliffene Klinge sagt mehr als lange Reden.
  ja: よく研いだ刃は長い演説に勝る。
- fr: Je ferre les chevaux du château. Même ceux du roi ont mauvais caractère.
  en: I shoe the castle's horses. Even the king's have a foul temper.
  es: Yo herro los caballos del castillo. Hasta los del rey tienen mal carácter.
  de: Ich beschlage die Pferde des Schlosses. Selbst die des Königs sind launisch.
  ja: 城の馬の蹄鉄を打ってるんだ。王様の馬だって気性が荒い。
- fr: Si votre épée a une entaille, ne la laissez pas comme ça. Elle vous trahira.
  en: If your sword has a nick, don't leave it like that. It'll betray you.
  es: Si tu espada tiene una mella, no la dejes así. Te traicionará.
  de: Wenn dein Schwert eine Scharte hat, lass es nicht so. Es wird dich verraten.
  ja: 剣に刃こぼれがあるなら放っておくな。いざという時に裏切られるぞ。
- fr: Cette laine vient des moutons de la Combe-aux-Saules. La plus douce du royaume.
  en: This wool comes from the sheep of Combe-aux-Saules. The softest in the kingdom.
  es: Esta lana viene de las ovejas de Combe-aux-Saules. La más suave del reino.
  de: Diese Wolle stammt von den Schafen aus Combe-aux-Saules. Die weichste im Königreich.
  ja: この羊毛はコンブ＝オ＝ソールの羊のもの。王国一やわらかいよ。
- fr: Une cape pour l'hiver ? Le vent du nord ne pardonne pas.
  en: A cloak for winter? The north wind shows no mercy.
  es: ¿Una capa para el invierno? El viento del norte no perdona.
  de: Ein Umhang für den Winter? Der Nordwind kennt keine Gnade.
  ja: 冬用のマントはいかが？北風は容赦しないよ。
- fr: Le bleu de ce tissu, c'est de la guède. Trois semaines de teinture !
  en: The blue of this cloth is woad. Three weeks of dyeing!
  es: El azul de esta tela es glasto. ¡Tres semanas de tinte!
  de: Das Blau dieses Stoffs ist Färberwaid. Drei Wochen Färben!
  ja: この青はタイセイ染め。三週間もかかるんだ！
- fr: La moisson sera bonne cette année, si les loups nous laissent tranquilles.
  en: The harvest will be good this year, if the wolves leave us alone.
  es: La cosecha será buena este año, si los lobos nos dejan en paz.
  de: Die Ernte wird dieses Jahr gut, wenn die Wölfe uns in Ruhe lassen.
  ja: 狼さえ来なければ、今年は豊作だ。
- fr: Le moulin tourne depuis l'aube. Le vent est avec nous.
  en: The mill has been turning since dawn. The wind is with us.
  es: El molino gira desde el alba. El viento está de nuestra parte.
  de: Die Mühle dreht sich seit dem Morgengrauen. Der Wind ist auf unserer Seite.
  ja: 夜明けから風車が回ってる。風が味方してくれてるね。
- fr: Vous venez de la ville ? Ici, on se lève avec les poules. Littéralement.
  en: From the city, are you? Out here we get up with the hens. Literally.
  es: ¿Venís de la ciudad? Aquí nos levantamos con las gallinas. Literalmente.
  de: Ihr kommt aus der Stadt? Hier stehen wir mit den Hühnern auf. Wortwörtlich.
  ja: 町から来たのかい？ここじゃ鶏と一緒に起きるんだ。文字どおりね。
- fr: Attention au taureau du voisin. Il n'aime personne.
  en: Watch out for the neighbour's bull. He likes nobody.
  es: Cuidado con el toro del vecino. No le gusta nadie.
  de: Vorsicht vor dem Stier des Nachbarn. Er mag niemanden.
  ja: 隣の牛には気をつけな。誰にもなつかないんだ。
