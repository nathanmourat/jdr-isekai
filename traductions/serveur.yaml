  es: Halo del Alba
  de: Morgenhalo
  ja: 暁の光輪
- fr: Un anneau de lumière dorée flotte au-dessus de ta tête et des étincelles t'entourent.
  en: A ring of golden light floats above your head and sparks surround you.
  es: Un anillo de luz dorada flota sobre tu cabeza y te rodean chispas.
  de: Ein Ring aus goldenem Licht schwebt über deinem Kopf, und Funken umgeben dich.
  ja: 頭上に金色の光の輪が浮かび、火花があなたを包む。
- fr: Cape de la Guilde
  en: Guild Cape
  es: Capa del Gremio
  de: Gildenumhang
  ja: ギルドのマント
- fr: Bleu nuit à liseré doré, la cape des aventuriers de Lysmont.
  en: Midnight blue with golden trim, the cape of Lysmont's adventurers.
  es: Azul noche con ribete dorado, la capa de los aventureros de Lysmont.
  de: Nachtblau mit goldenem Saum, der Umhang der Abenteurer von Lysmont.
  ja: 金の縁取りの濃紺。リスモンの冒険者のマント。
- fr: Cape des Sables
  en: Cape of the Sands
  es: Capa de las Arenas
  de: Umhang des Sandes
  ja: 砂のマント
- fr: Une étoffe légère couleur dune, brodée de rouge, venue de la Marche des Sables.
  en: A light dune-coloured fabric embroidered in red, from the Sand Marches.
  es: Una tela ligera color duna, bordada en rojo, venida de la Marca de las Arenas.
  de: Ein leichter, dünenfarbener Stoff mit roter Stickerei aus der Sandmark.
  ja: 砂の辺境から来た、赤い刺繍入りの砂丘色の軽い布。
- fr: Cape des Brumes
  en: Cape of the Mists
  es: Capa de las Brumas
  de: Umhang der Nebel
  ja: 霧のマント
- fr: "Gris-bleu, presque transparente : elle semble faite de la brume de l'Archipel."
  en: "Blue-grey, almost transparent: it seems woven from the Archipelago's mist."
  es: "Gris azulada, casi transparente: parece hecha de la bruma del Archipiélago."
  de: "Blaugrau, fast durchsichtig: Er scheint aus dem Nebel des Archipels gewebt."
  ja: 青灰色でほとんど透明。群島の霧で織られたかのよう。
- fr: Cape royale de Lysmont
  en: Royal Cape of Lysmont
  es: Capa real de Lysmont
  de: Königlicher Umhang von Lysmont
  ja: リスモン王家のマント
- fr: Pourpre et or, avec le soleil levant d'Aubeclaire brodé dans le dos.
  en: Purple and gold, with the rising sun of Aubeclaire embroidered on the back.
  es: Púrpura y oro, con el sol naciente de Aubeclaire bordado en la espalda.
  de: Purpur und Gold, mit der aufgehenden Sonne von Aubeclaire auf dem Rücken.
  ja: 紫と金。背中にオーブクレールの朝日の刺繍。
- fr: Lanterne d'Aubeclaire
  en: Lantern of Aubeclaire
  es: Linterna de Aubeclaire
  de: Laterne von Aubeclaire
  ja: オーブクレールの灯
- fr: "Un titre doré au-dessus de ta tête : « Lanterne d'Aubeclaire »."
  en: "A golden title above your head: “Lantern of Aubeclaire”."
  es: "Un título dorado sobre tu cabeza: «Linterna de Aubeclaire»."
  de: "Ein goldener Titel über deinem Kopf: „Laterne von Aubeclaire“."
  ja: 頭上に金色の称号：「オーブクレールの灯」。
- fr: Chasseur de Brumes
  en: Mist Hunter
  es: Cazador de Brumas
  de: Nebeljäger
  ja: 霧の狩人
- fr: Le titre de celles et ceux qui ont navigué dans l'Archipel.
  en: The title of those who have sailed the Archipelago.
  es: El título de quienes han navegado por el Archipiélago.
  de: Der Titel derer, die den Archipel befahren haben.
  ja: 群島を航海した者の称号。
- fr: Gardien du Voile
  en: Keeper of the Veil
  es: Guardián del Velo
  de: Hüter des Schleiers
  ja: ヴェールの守り手
- fr: Un titre violet qui scintille doucement.
  en: A purple title that gently shimmers.
  es: Un título violeta que centellea suavemente.
  de: Ein violetter Titel, der sanft schimmert.
  ja: やさしくきらめく紫の称号。
- fr: Fondateur
  en: Founder
  es: Fundador
  de: Gründer
  ja: 創設者
- fr: "Réservé au Pack du Fondateur : merci d'avoir cru en Velmaris !"
  en: "Exclusive to the Founder's Pack: thank you for believing in Velmaris!"
  es: "Reservado al Pack del Fundador: ¡gracias por creer en Velmaris!"
  de: "Nur im Gründerpaket: Danke, dass du an Velmaris glaubst!"
  ja: 創設者パック限定：ヴェルマリスを信じてくれてありがとう！
- fr: Pétales de saule
  en: Willow petals
  es: Pétalos de sauce
  de: Weidenblüten
  ja: 柳の花びら
- fr: Des pétales roses volent derrière toi quand tu marches.
  en: Pink petals fly behind you as you walk.
  es: Pétalos rosas vuelan detrás de ti al caminar.
  de: Rosa Blütenblätter fliegen hinter dir her, wenn du gehst.
  ja: 歩くと桃色の花びらが舞う。
- fr: Pas de cendre
  en: Ash steps
  es: Pasos de ceniza
  de: Aschenschritte
  ja: 灰の足跡
- fr: Chaque pas laisse une traînée de cendres rougeoyantes.
  en: Each step leaves a trail of glowing ash.
  es: Cada paso deja un rastro de cenizas incandescentes.
  de: Jeder Schritt hinterlässt eine Spur glühender Asche.
  ja: 一歩ごとに赤く光る灰の跡が残る。
- fr: Poussière d'étoiles
  en: Stardust
  es: Polvo de estrellas
  de: Sternenstaub
  ja: 星屑
- fr: Une traînée lumineuse d'or et d'argent suit chacun de tes pas.
  en: A shining trail of gold and silver follows each of your steps.
  es: Un rastro luminoso de oro y plata sigue cada uno de tus pasos.
  de: Eine leuchtende Spur aus Gold und Silber folgt jedem deiner Schritte.
  ja: 金と銀の光の軌跡が足取りを追う。
- fr: Sorts étoilés
  en: Starry spells
  es: Hechizos estrellados
  de: Sternenzauber
  ja: 星の呪文
- fr: Tes sorts et tes flèches laissent une pluie d'étoiles dorées. La couleur de l'élément reste visible.
  en: Your spells and arrows leave a shower of golden stars. The element's colour stays visible.
  es: Tus hechizos y flechas dejan una lluvia de estrellas doradas. El color del elemento sigue visible.
  de: Deine Zauber und Pfeile hinterlassen einen Regen goldener Sterne. Die Farbe des Elements bleibt sichtbar.
  ja: 呪文や矢が金色の星を降らせる。属性の色はそのまま見える。
- fr: Prisme
  en: Prism
  es: Prisma
  de: Prisma
  ja: プリズム
- fr: Une traînée aux couleurs de l'arc-en-ciel suit chacun de tes sorts.
  en: A rainbow-coloured trail follows each of your spells.
  es: Un rastro con los colores del arcoíris sigue cada uno de tus hechizos.
  de: Eine Spur in Regenbogenfarben folgt jedem deiner Zauber.
  ja: 呪文のたびに虹色の軌跡が続く。
- fr: Feu d'artifice
  en: Fireworks
  es: Fuegos artificiales
  de: Feuerwerk
  ja: 花火
- fr: Trois fusées qui éclatent en gerbes de couleurs au-dessus de toi. 3 utilisations par achat.
  en: Three rockets bursting into showers of colour above you. 3 uses per purchase.
  es: Tres cohetes que estallan en lluvias de colores sobre ti. 3 usos por compra.
  de: Drei Raketen, die über dir in bunten Garben zerplatzen. 3 Nutzungen pro Kauf.
  ja: 頭上で三発のロケットが色とりどりに弾ける。1回の購入で3回使える。
- fr: Lâcher de lanternes
  en: Lantern release
  es: Suelta de linternas
  de: Laternenflug
  ja: ランタン飛ばし
- fr: Une dizaine de lanternes célestes montent lentement dans le ciel, comme à la fête d'Aubeclaire. 3 utilisations par achat.
  en: A dozen sky lanterns slowly rise into the sky, as at the Aubeclaire festival. 3 uses per purchase.
  es: Una docena de linternas celestes suben lentamente al cielo, como en la fiesta de Aubeclaire. 3 usos por compra.
  de: Ein Dutzend Himmelslaternen steigt langsam in den Himmel, wie beim Fest von Aubeclaire. 3 Nutzungen pro Kauf.
  ja: オーブクレールの祭りのように、十ほどの天灯がゆっくり空へ昇る。1回の購入で3回使える。
